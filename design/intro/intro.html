<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>Oil Level Tracker — intro</title>
<!-- P-1 introduction video, draft 3 (docs/40-operations/intro-video.md). Not product code, and not
     an app screen: a light motion piece in the app's own colours (DESIGN.md §2) around real screens
     of the app. seek(t) draws the frame at t seconds and resolves once its images are decoded;
     scripts/render_intro.py captures it 30 times a second, edits the music to it and synthesises the
     sound effects listed in CUES. Scenes keep to the music's bars (108 BPM: bar n starts at bar(n)).
     Open with ?t=12.5 for one moment, ?play to watch. assets/ is made by scripts/render_intro.py
     (ignored by Git): clips of the app driven as an inspector would, one screenshot per frame with
     the pointer's place, which this page draws. -->
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable.min.css">
<style>
  :root {
    --bg-1: #FFFFFF; --bg-3: #F5F5F5; --fg-1: #242424; --fg-2: #424242; --fg-3: #616161;
    --stroke-1: #D1D1D1; --stroke-2: #E0E0E0;
    --brand: #0F6CBD; --brand-tint: #EBF3FC; --oil: #1F77D0; --pass: #0E700E; --fail: #C50F1F;
    --skeleton: #D5DEE8; --stage: #F6F8FB;
    --shadow: 0 40px 90px rgba(16,42,77,0.13), 0 10px 28px rgba(16,42,77,0.08), 0 0 0 1px rgba(16,42,77,0.06);
  }
  html, body { margin: 0; background: #fff; }
  #stage {
    position: relative; width: 1920px; height: 1080px; overflow: hidden; color: var(--fg-1);
    background: var(--stage);
    font-family: "Pretendard Variable", "Pretendard", "Apple SD Gothic Neo", sans-serif;
    letter-spacing: -0.03em;
  }
  .abs { position: absolute; left: 0; top: 0; will-change: transform, opacity; }
  .card { position: absolute; background: #fff; border-radius: 22px; box-shadow: var(--shadow); overflow: hidden; }
  .glow { position: absolute; border-radius: 50%; filter: blur(80px); }

  /* type */
  .line { position: absolute; left: 0; width: 1920px; text-align: center; white-space: nowrap; font-weight: 760; }
  .line .w { display: inline-block; margin: 0 0.12em; }
  .line .a { color: var(--brand); }
  .sub { position: absolute; left: 0; width: 1920px; text-align: center; font-size: 34px; font-weight: 500; color: var(--fg-3); }
  .pill { position: absolute; left: 960px; top: 0; white-space: nowrap; padding: 18px 34px 18px 30px; border-radius: 999px;
          background: rgba(255,255,255,0.96); box-shadow: var(--shadow); font-size: 34px; font-weight: 650; }
  .pill::before { content: ""; display: inline-block; width: 12px; height: 12px; margin: 0 16px 4px 0; border-radius: 50%; background: var(--brand); }

  /* act 1 */
  .player-ctl { position: absolute; left: 20px; right: 20px; bottom: 0; height: 92px; display: flex; align-items: center; gap: 22px; }
  .chip { padding: 8px 18px; border-radius: 999px; background: var(--brand-tint); color: var(--brand); font-size: 24px; font-weight: 700; }
  .sheet { font-size: 24px; }
  .sheet .row { position: absolute; left: 0; width: 800px; height: 50px; border-bottom: 1px solid var(--stroke-2); }
  .sheet .cell { position: absolute; top: 0; height: 50px; border-right: 1px solid var(--stroke-2); box-sizing: border-box; }
  .sheet .bar { position: absolute; left: 18px; top: 19px; height: 12px; border-radius: 6px; background: var(--skeleton); }
  .sheet .caret { position: absolute; top: 13px; width: 2px; height: 24px; background: var(--brand); }
  .sheet .head { background: var(--bg-3); font-weight: 700; color: var(--fg-2); }
  .sheet .head .cell { padding: 11px 18px; }
  .sk { position: absolute; height: 10px; border-radius: 5px; background: var(--skeleton); }

  /* the app's window */
  #win { position: absolute; left: 0; top: 0; width: 1600px; height: 936px; transform-origin: 0 0; border-radius: 14px;
         overflow: hidden; background: #fff; box-shadow: 0 60px 140px rgba(16,42,77,0.22), 0 16px 40px rgba(16,42,77,0.10), 0 0 0 1px rgba(16,42,77,0.10); }
  #titlebar { position: absolute; left: 0; top: 0; width: 1600px; height: 36px; background: #F3F3F3; display: flex; align-items: center;
              font-size: 13px; letter-spacing: 0; color: var(--fg-1); }
  #titlebar .name { padding-left: 16px; flex: 1; font-weight: 500; }
  #titlebar svg { width: 46px; height: 36px; }
  #body { position: absolute; left: 0; top: 36px; width: 1600px; height: 900px; overflow: hidden; }
  #body img { position: absolute; left: 0; top: 0; width: 1600px; height: 900px; }
  #cursor { position: absolute; left: 0; top: 0; transform-origin: 0 0; filter: drop-shadow(0 2px 3px rgba(0,0,0,0.3)); }
  #ripple { position: absolute; left: 0; top: 0; width: 100px; height: 100px; margin: -50px 0 0 -50px; border-radius: 50%;
            border: 3px solid var(--brand); box-sizing: border-box; }
  #miss { position: absolute; background: rgba(197,15,31,0.12); border: 2px solid rgba(197,15,31,0.75); border-radius: 6px; box-sizing: border-box; }
  #missLabel { position: absolute; padding: 6px 14px; border-radius: 8px; background: var(--fail); color: #fff; font-size: 20px; font-weight: 700; white-space: nowrap; }
  .lift { position: absolute; left: 0; top: 0; transform-origin: 0 0; border-radius: 14px; overflow: hidden; box-shadow: var(--shadow); background: #fff; }
  .lift img { display: block; width: 100%; height: 100%; }
  .rowmark { position: absolute; border-radius: 8px; background: rgba(15,108,189,0.10); box-shadow: inset 0 0 0 2px rgba(15,108,189,0.65); }

  /* act 3 */
  .flip { position: absolute; width: 520px; height: 420px; perspective: 1800px; }
  .face { position: absolute; inset: 0; border-radius: 24px; background: #fff; box-shadow: var(--shadow); backface-visibility: hidden;
          overflow: hidden; }
  .face .pic { position: absolute; left: 28px; top: 28px; width: 464px; height: 236px; border-radius: 14px; overflow: hidden; background: var(--bg-3); }
  .face .t { position: absolute; left: 34px; right: 34px; top: 292px; font-size: 34px; font-weight: 740; line-height: 1.25; }
  .face .k { position: absolute; left: 34px; top: 364px; font-size: 22px; font-weight: 600; color: var(--fg-3); }
  .face.after .k { color: var(--brand); }
  .face.before .t { color: var(--fg-3); }
  #white { position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; background: #fff; }
</style>
</head>
<body>
<div id="stage">
  <div id="backdrop" class="abs" style="width:1920px;height:1080px">
    <div id="glowA" class="glow" style="width:1100px;height:900px;background:rgba(15,108,189,0.10)"></div>
    <div id="glowB" class="glow" style="width:900px;height:800px;background:rgba(31,119,208,0.08)"></div>
  </div>

  <!-- act 1: the way it is done now -->
  <div id="player" class="card" style="width:900px;height:600px">
    <svg id="playerGlass" style="position:absolute;left:20px;top:20px;width:860px;height:484px;border-radius:12px" viewBox="0 0 860 484"></svg>
    <div class="player-ctl">
      <svg width="36" height="36" viewBox="0 0 20 20"><path id="playIcon" fill="var(--fg-1)" d="M6 4l10 6-10 6z"/></svg>
      <div id="speedChip" class="chip">▶▶ 배속</div>
      <div id="trackBox" style="position:relative;flex:1;height:8px">
        <div id="track" style="position:absolute;left:0;top:0;height:8px;border-radius:4px;background:var(--stroke-2);transform-origin:0 0"></div>
        <div id="trackDone" style="position:absolute;left:0;top:0;height:8px;border-radius:4px;background:var(--brand)"></div>
        <div id="trackThumb" style="position:absolute;top:-8px;width:24px;height:24px;margin-left:-12px;border-radius:50%;background:#fff;box-shadow:0 0 0 2px var(--brand),0 2px 6px rgba(0,0,0,0.2)"></div>
      </div>
    </div>
  </div>
  <div id="sheet" class="card sheet" style="width:800px;height:600px"></div>
  <div id="chart" class="card" style="width:800px;height:600px"><svg id="chartSvg" width="800" height="600" viewBox="0 0 800 600"></svg></div>
  <div id="pages"></div>
  <div id="fly" class="abs"></div>

  <!-- act 2: the app -->
  <div id="win">
    <div id="titlebar"><span class="name">Oil Level Tracker</span>
      <svg viewBox="0 0 46 36"><path d="M18 18h10" stroke="#424242" stroke-width="1"/></svg>
      <svg viewBox="0 0 46 36"><rect x="18.5" y="13.5" width="9" height="9" fill="none" stroke="#424242" stroke-width="1"/></svg>
      <svg viewBox="0 0 46 36"><path d="M18 13l10 10M28 13L18 23" stroke="#424242" stroke-width="1"/></svg>
    </div>
    <div id="body">
      <img id="appImg" alt="">
      <img id="appFade" alt="">
      <img id="appTop" alt="">
      <div id="miss"></div><div id="missLabel">놓친 구간</div>
    </div>
    <div id="ripple"></div>
    <svg id="cursor" width="32" height="32" viewBox="0 0 32 32"></svg>
  </div>
  <div id="cupCard" class="card" style="width:520px;height:498px"><img id="cupImg" style="width:520px;height:498px" alt="">
    <div id="cupBand" style="position:absolute;border:3px solid var(--brand);border-radius:6px;box-sizing:border-box;background:rgba(15,108,189,0.08)"></div></div>
  <div id="ctxCard" class="card" style="border-radius:16px"><div id="ctxClip" style="position:absolute;inset:0;overflow:hidden">
    <img id="ctxImg" style="position:absolute;left:0;top:0;width:100%;height:100%" alt=""></div></div>
  <div id="ctxLabel" class="sub" style="font-size:28px;font-weight:650;color:var(--brand)">맥락 이미지 — Glass 가운데 띠를 시간 순으로</div>
  <div id="strips"></div>
  <div id="judgeLift" class="lift"><img src="assets/judgment.png" alt=""><div id="rowMarks"></div></div>
  <div id="report1" class="lift" style="border-radius:6px"><img src="assets/report-1.png" alt=""></div>
  <div id="report0" class="lift" style="border-radius:6px"><img src="assets/report-0.png" alt=""></div>

  <!-- act 3 -->
  <div id="flips"></div>
  <div id="name" class="line" style="font-size:136px;font-weight:820;letter-spacing:-0.045em">Oil Level Tracker</div>
  <div id="nameRule" class="abs" style="height:6px;border-radius:3px;background:var(--oil)"></div>
  <div id="tagline" class="sub" style="font-size:40px">사이트글라스 영상으로 유면을 판정합니다</div>

  <div id="texts" class="abs" style="z-index:50"></div>
  <div id="white" style="z-index:60"></div>
</div>

<script>
"use strict";
const FPS = 30, DURATION = 89.4;
const BEAT = 60 / 108, bar = (n) => 0.034 + n * 4 * BEAT;
const $ = (id) => document.getElementById(id);

// sound effects, synthesised by scripts/render_intro.py under the music: [time, kind, gain]
const CUES = [];
const cue = (t, kind, gain = 1) => CUES.push([t, kind, gain]);

// ---- easing and timing ----
const clamp = (v, a = 0, b = 1) => Math.min(b, Math.max(a, v));
const lin = (t, a, b) => clamp((t - a) / (b - a));
const outCubic = (x) => 1 - (1 - x) ** 3;
const outQuint = (x) => 1 - (1 - x) ** 5;
const inOutCubic = (x) => (x < 0.5 ? 4 * x ** 3 : 1 - (-2 * x + 2) ** 3 / 2);
const inCubic = (x) => x ** 3;
const outBack = (x) => 1 + 2.4 * (x - 1) ** 3 + 1.4 * (x - 1) ** 2;
const ease = (t, a, b, f = outCubic) => f(lin(t, a, b));
const mix = (a, b, k) => a + (b - a) * k;
const life = (t, a, b, fi = 0.45, fo = 0.4) => Math.min(ease(t, a, a + fi), 1 - ease(t, b - fo, b));
function show(el, alpha, transform) {
  el.style.opacity = alpha;
  el.style.visibility = alpha <= 0.001 ? "hidden" : "visible";
  if (transform != null) el.style.transform = transform;
}
const place = (el, r) => Object.assign(el.style, { left: `${r.x}px`, top: `${r.y}px`, width: `${r.w}px`, height: `${r.h}px` });
const mixRect = (a, b, k) => ({ x: mix(a.x, b.x, k), y: mix(a.y, b.y, k), w: mix(a.w, b.w, k), h: mix(a.h, b.h, k) });
let seed = 11;
const rand = () => ((seed = (seed * 16807) % 2147483647) / 2147483647);

// ---- the timeline: bars of the edited music (render_intro.py MUSIC_EDIT) ----
const B = (n, beats = 0) => bar(n) + beats * BEAT;
const CLIP_AT = { recipe: B(12, 1.0), setup: B(16, 0.2), edit: B(22, 0.2), submit: B(31, 0.2) };

// ---- type: lines of words, each word with its own time ----
const TEXTS = [];
function line(y, size, words, end, opts = {}) {
  const el = document.createElement("div");
  el.className = "line";
  Object.assign(el.style, { top: `${y}px`, fontSize: `${size}px` });
  el.innerHTML = words.map(([w, , accent]) => `<span class="w${accent ? " a" : ""}">${w}</span>`).join("");
  $("texts").append(el);
  const item = { el, words: words.map(([, at]) => at), spans: [...el.children], end, ...opts };
  TEXTS.push(item);
  return item;
}
function sub(y, text, start, end) {
  const el = document.createElement("div");
  el.className = "sub";
  el.style.top = `${y}px`;
  el.textContent = text;
  $("texts").append(el);
  TEXTS.push({ el, sub: true, start, end });
}
function pill(y, text, start, end) {
  const el = document.createElement("div");
  el.className = "pill";
  el.textContent = text;
  $("texts").append(el);
  TEXTS.push({ el, pill: true, y, start, end });
}
function drawTexts(t) {
  for (const item of TEXTS) {
    if (item.pill) {
      const k = ease(t, item.start, item.start + 0.5, outQuint), out = ease(t, item.end - 0.3, item.end);
      show(item.el, Math.min(k, 1 - out), `translate(-50%, ${item.y + mix(30, 0, k) - 14 * out}px) scale(${mix(0.94, 1, k)})`);
      continue;
    }
    if (item.sub) {
      const k = life(t, item.start, item.end, 0.6, 0.35);
      show(item.el, k, `translateY(${mix(14, 0, ease(t, item.start, item.start + 0.6))}px)`);
      continue;
    }
    const out = ease(t, item.end - 0.35, item.end, inOutCubic);
    show(item.el, item.words[0] - 0.05 <= t && out < 1 ? 1 : 0, item.move ? item.move(t) : `translateY(${-24 * out}px)`);
    item.el.style.filter = out > 0 ? `blur(${8 * out}px)` : "";
    item.el.style.opacity = 1 - out;
    item.spans.forEach((span, i) => {
      const k = ease(t, item.words[i], item.words[i] + 0.55, outQuint);
      span.style.opacity = k;
      span.style.transform = `translateY(${mix(40, 0, k)}px)`;
      span.style.filter = k < 1 ? `blur(${mix(10, 0, k)}px)` : "";
    });
  }
}

// ---- act 1 pictures ----
function sightGlass(svg, id) {
  svg.innerHTML = `
    <defs>
      <linearGradient id="${id}b" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#C9D2DA"/><stop offset="1" stop-color="#9AA7B3"/></linearGradient>
      <radialGradient id="${id}f" cx="0.42" cy="0.36" r="0.75"><stop offset="0" stop-color="#EEF2F5"/><stop offset="1" stop-color="#9DA9B4"/></radialGradient>
      <linearGradient id="${id}o" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#F0B44A"/><stop offset="1" stop-color="#B9741A"/></linearGradient>
      <linearGradient id="${id}i" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#2B3540"/><stop offset="1" stop-color="#1B232B"/></linearGradient>
      <clipPath id="${id}c"><circle cx="430" cy="242" r="118"/></clipPath>
    </defs>
    <rect width="860" height="484" fill="url(#${id}b)"/>
    ${[90, 150, 340, 400].map((y) => `<rect x="0" y="${y}" width="860" height="2" fill="#fff" opacity="0.13"/>`).join("")}
    <circle cx="430" cy="242" r="196" fill="url(#${id}f)" stroke="#8A96A1" stroke-width="2"/>
    ${[0, 60, 120, 180, 240, 300].map((a) => {
      const x = 430 + 166 * Math.cos((a + 30) * Math.PI / 180), y = 242 + 166 * Math.sin((a + 30) * Math.PI / 180);
      const hex = [0, 1, 2, 3, 4, 5].map((k) => `${x + 19 * Math.cos(k * Math.PI / 3)},${y + 19 * Math.sin(k * Math.PI / 3)}`).join(" ");
      return `<polygon points="${hex}" fill="#D3DAE0" stroke="#7D8994" stroke-width="2"/><circle cx="${x}" cy="${y}" r="8" fill="#B9C2CA"/>`;
    }).join("")}
    <circle cx="430" cy="242" r="134" fill="#6B7783"/>
    <g clip-path="url(#${id}c)">
      <rect x="300" y="110" width="260" height="270" fill="url(#${id}i)"/>
      <path data-oil fill="url(#${id}o)"/>
      <path data-foam fill="#F6EBD2"/>
      <g data-bubbles></g>
      <path d="M352 190 A 96 96 0 0 1 452 146" stroke="#fff" stroke-width="10" stroke-linecap="round" fill="none" opacity="0.28"/>
      <ellipse cx="370" cy="212" rx="9" ry="16" fill="#fff" opacity="0.22" transform="rotate(30 370 212)"/>
    </g>
    <circle cx="430" cy="242" r="118" fill="none" stroke="#3E4852" stroke-width="5"/>`;
  const bubbles = svg.querySelector("[data-bubbles]");
  const dots = [];
  for (let i = 0; i < 30; i += 1) {
    const c = document.createElementNS("http://www.w3.org/2000/svg", "circle");
    c.setAttribute("fill", "rgba(255,255,255,0.45)");
    c.setAttribute("stroke", "#E1C998");
    c.setAttribute("stroke-width", "1.5");
    bubbles.append(c);
    dots.push({ c, u: rand(), v: rand(), r: 3 + rand() * 6 });
  }
  return { oil: svg.querySelector("[data-oil]"), foam: svg.querySelector("[data-foam]"), dots };
}
// level and foam as fractions of the window's height; phase drives the waves
function drawGlass(g, level, foam, phase) {
  const top = 124, h = 236, x0 = 300, x1 = 560;
  const yl = top + h * (1 - level), yf = yl - h * foam;
  const wave = (x, y, a) => y + a * Math.sin(x * 0.035 + phase) + a * 0.5 * Math.sin(x * 0.09 - phase * 1.7);
  const pts = (y, a) => Array.from({ length: 27 }, (_, i) => { const x = x0 + i * 10; return [x, wave(x, y, a)]; });
  const surface = pts(yl, 4), cap = pts(yf, 6);
  g.oil.setAttribute("d", `M${surface.map((p) => p.join(",")).join(" L")} L${x1},380 L${x0},380 Z`);
  g.foam.setAttribute("d", `M${cap.map((p) => p.join(",")).join(" L")} L${[...surface].reverse().map((p) => p.join(",")).join(" L")} Z`);
  for (const d of g.dots) {
    const x = x0 + ((d.u * 260 + phase * 6) % 260);
    const y = mix(wave(x, yf, 6), wave(x, yl, 4), d.v);
    d.c.setAttribute("cx", x);
    d.c.setAttribute("cy", y);
    d.c.setAttribute("r", Math.min(d.r, h * foam * 0.45 + 1));
  }
}
const slosh = (t) => ({ level: 0.5 + 0.06 * Math.sin(t * 1.3) + 0.025 * Math.sin(t * 3.4), foam: 0.07 + 0.035 * Math.sin(t * 0.9 + 1), phase: t * 3.2 });

let G = null;            // the player's sight glass
let sheetRows = [];      // [{row, bars: [[el, width]], caret}]
let typed = [];          // when each row is typed
let points = [];         // the hand-made chart's points
let pages = [];

function buildSheet() {
  const sheet = $("sheet");
  const head = document.createElement("div");
  head.className = "row head";
  head.style.top = "0px";
  head.innerHTML = `<div class="cell" style="left:0;width:56px"></div><div class="cell" style="left:56px;width:220px">시각</div>
    <div class="cell" style="left:276px;width:240px">유면 높이</div><div class="cell" style="left:516px;width:284px;border-right:0">비고</div>`;
  const body = document.createElement("div");
  body.id = "sheetBody";
  body.style.cssText = "position:absolute;left:0;top:50px;width:800px;height:550px;overflow:hidden";
  const inner = document.createElement("div");
  inner.id = "sheetInner";
  inner.style.cssText = "position:absolute;left:0;top:0;width:800px";
  body.append(inner);
  sheet.append(head, body);
  for (let i = 0; i < 18; i += 1) {
    const row = document.createElement("div");
    row.className = "row";
    row.style.top = `${i * 50}px`;
    const cells = [[0, 56], [56, 220], [276, 240], [516, 284]];
    row.innerHTML = cells.map(([l, w], k) => `<div class="cell" style="left:${l}px;width:${w}px;${k === 0 ? "background:var(--bg-3)" : ""}${k === 3 ? ";border-right:0" : ""}"></div>`).join("");
    const bars = [[1, 110 + rand() * 60], [2, 70 + rand() * 70]];
    if (rand() < 0.3) bars.push([3, 80 + rand() * 120]);
    const made = bars.map(([k, w]) => {
      const bar = document.createElement("div");
      bar.className = "bar";
      row.children[k].append(bar);
      return [bar, w];
    });
    const caret = document.createElement("div");
    caret.className = "caret";
    row.children[2].append(caret);
    const select = document.createElement("div");
    select.style.cssText = "position:absolute;left:56px;top:-1px;width:460px;height:51px;box-shadow:inset 0 0 0 2px var(--brand);border-radius:2px";
    row.append(select);
    inner.append(row);
    sheetRows.push({ row, bars: made, caret, select });
  }
  // a row each "적고", sooner as it goes on: watching, pausing, typing, again and again
  let at = B(2, 2);
  const gaps = [3, 3, 2, 2, 1.5, 1.5, 1, 1, 1, 0.75, 0.75, 0.75, 0.5, 0.5, 0.5, 0.5, 0.5, 0.5];
  for (let i = 0; i < 18; i += 1) {
    typed.push(at);
    cue(at, "type", 0.6);
    cue(at + 0.12, "type", 0.45);
    at += gaps[i] * BEAT;
  }
}

function buildChart() {
  const svg = $("chartSvg");
  const ys = [0.78, 0.8, 0.62, 0.42, 0.36, 0.3, 0.33, 0.42, 0.5, 0.56, 0.58, 0.57];
  let html = `<rect x="0" y="0" width="800" height="600" fill="#fff"/>
    <rect x="70" y="40" width="240" height="14" rx="7" fill="var(--skeleton)"/>
    <g id="axes"><line x1="90" y1="110" x2="90" y2="520" stroke="var(--fg-3)" stroke-width="2"/>
    <line x1="90" y1="520" x2="740" y2="520" stroke="var(--fg-3)" stroke-width="2"/>
    ${[0, 1, 2, 3, 4].map((k) => `<line x1="80" x2="90" y1="${520 - k * 100}" y2="${520 - k * 100}" stroke="var(--fg-3)" stroke-width="2"/><line x1="92" x2="740" y1="${520 - k * 100}" y2="${520 - k * 100}" stroke="var(--stroke-2)"/>`).join("")}
    ${[1, 2, 3, 4, 5, 6].map((k) => `<line y1="520" y2="530" x1="${90 + k * 108}" x2="${90 + k * 108}" stroke="var(--fg-3)" stroke-width="2"/>`).join("")}</g>
    <g id="plot"><path id="handLine" fill="none" stroke="var(--brand)" stroke-width="4" stroke-linejoin="round" stroke-linecap="round"/>`;
  points = ys.map((v, i) => ({ x: 130 + i * 52, y: 130 + v * 380 }));
  html += points.map((p, i) => `<circle id="pt${i}" r="9" fill="var(--brand)" stroke="#fff" stroke-width="3"/>`).join("");
  html += "</g>";
  svg.innerHTML = html;
  let d = "";
  points.forEach((p, i) => { d += `${i ? "L" : "M"}${p.x + (rand() - 0.5) * 6},${p.y + (rand() - 0.5) * 6} `; });
  $("handLine").setAttribute("d", d);
}

function buildPages() {

function drawAct1(t) {
  const end = B(9, 1);
  // backdrop: two soft lights drifting
  $("glowA").style.transform = `translate(${-200 + 120 * Math.sin(t * 0.11)}px, ${-260 + 80 * Math.cos(t * 0.09)}px)`;
  $("glowB").style.transform = `translate(${1200 + 140 * Math.cos(t * 0.08)}px, ${420 + 90 * Math.sin(t * 0.12)}px)`;

  // collapse at bar 9: everything of the old way pulls into the middle and goes
  const gone = ease(t, B(9, 0.6), B(9, 2.4), inOutCubic);
  const pull = (x, y, el) => {
    const k = gone;
    return { x: mix(x, 960 - el.offsetWidth / 2, k * 0.85), y: mix(y, 540 - el.offsetHeight / 2, k * 0.85), s: mix(1, 0.35, k), a: 1 - k };
  };

  // the player: centred, then smaller with its track running far off to the right, then left
  const s = slosh(t);
  const playing = !typed.some((at) => t > at - BEAT * 0.7 && t < at + BEAT * 0.25);  // paused while typing
  drawGlass(G, s.level, s.foam, s.phase);
  $("playIcon").setAttribute("d", playing ? "M6 4l10 6-10 6z" : "M5 4h3.5v12H5zM11.5 4H15v12h-3.5z");
  const pin = ease(t, 0.05, 0.9, outQuint);
  const small = ease(t, B(1), B(1, 1.6), inOutCubic);
  const left = ease(t, B(2), B(2, 1.4), inOutCubic);
  const exit = ease(t, B(5), B(5, 1.4), inOutCubic);
  const px = mix(mix(510, 330, small), 120, left) - 1100 * exit, py = mix(mix(150, 210, small), 210, left) + mix(40, 0, pin);
  const ps = mix(mix(1, 0.8, small), 0.8, left);
  const pp = pull(px, py, $("player"));
  show($("player"), pin * pp.a * (1 - exit), `translate(${pp.x}px, ${pp.y}px) scale(${ps * pp.s})`);
  $("player").style.transformOrigin = "0 0";
  // the track: longer than the screen once the player is small
  const long = ease(t, B(1, 0.4), B(1, 2.6), inOutCubic);
  $("track").style.width = `${mix(670, 4200, long)}px`;
  const done = 0.5 + 18 * lin(t, 0, end);
  $("trackDone").style.width = `${done}px`;
  $("trackThumb").style.left = `${done}px`;
  $("speedChip").style.transform = `scale(${1 + 0.06 * Math.max(0, Math.sin(t * Math.PI / BEAT))})`;
  $("player").style.overflow = long > 0 ? "visible" : "hidden";
  $("playerGlass").style.borderRadius = "12px";

  // the sheet, filling row by row; then to the left for the chart
  const sin = ease(t, B(2, 0.3), B(2, 1.8), outQuint);
  const sx = mix(1010, 120, exit), sy = 210 + mix(40, 0, sin);
  const sp = pull(sx, sy, $("sheet"));
  const sheetFade = 1 - ease(t, B(8, 0.2), B(8, 1.6));
  show($("sheet"), sin * sp.a * mix(1, 0.45, 1 - sheetFade), `translate(${sp.x}px, ${sp.y}px) scale(${sp.s * mix(1, 0.9, 1 - sheetFade)})`);
  $("sheet").style.transformOrigin = "0 0";
  let rowsDone = 0;
  sheetRows.forEach((r, i) => {
    const k = ease(t, typed[i] - 0.05, typed[i] + 0.35, (x) => x);
    if (t >= typed[i]) rowsDone = i + 1;
    r.bars.forEach(([bar, w], j) => { bar.style.width = `${w * clamp(k * (j === 0 ? 1.6 : 1.2) - j * 0.35)}px`; });
    const active = t > typed[i] - 0.3 && t < (typed[i + 1] ?? typed[i] + 0.5) - 0.3;
    r.select.style.opacity = active ? 1 : 0;
    r.caret.style.opacity = active && Math.floor(t * 4) % 2 === 0 ? 1 : 0;
    r.caret.style.left = `${18 + r.bars[1][1] * clamp(k * 1.2 - 0.35)}px`;
  });
  $("sheetInner").style.transform = `translateY(${-Math.max(0, rowsDone - 9) * 50}px)`;

  // the chart, point by point from the rows; the axis set wrong once; then the line by hand
  const cin = ease(t, B(5, 0.3), B(5, 1.7), outQuint);
  const cx = 1010, cy = 210 + mix(40, 0, cin);
  const cp = pull(cx, cy, $("chart"));
  const chartFade = 1 - ease(t, B(8, 0.2), B(8, 1.6));
  show($("chart"), cin * cp.a * mix(1, 0.45, 1 - chartFade), `translate(${cp.x}px, ${cp.y}px) scale(${cp.s * mix(1, 0.9, 1 - chartFade)})`);
  $("chart").style.transformOrigin = "0 0";
  const wrong = ease(t, B(6, 1), B(6, 1.25), outCubic) * (1 - ease(t, B(6, 2.6), B(7, 0.2), outBack));
  points.forEach((p, i) => {
    const at = B(5, 1) + i * BEAT * 0.55;
    const k = ease(t, at, at + 0.4, outBack);
    const c = $(`pt${i}`);
    c.setAttribute("cx", p.x);
    c.setAttribute("cy", mix(p.y, 130 + (p.y - 130) * 0.35, wrong));
    c.setAttribute("r", 9 * clamp(k));
    c.style.opacity = clamp(k * 3);
  });
  const drawn = ease(t, B(7, 0.2), B(7, 2.4), inOutCubic);
  const hl = $("handLine");
  const len = 700;
  hl.style.strokeDasharray = `${len}`;
  hl.style.strokeDashoffset = `${len * (1 - drawn)}`;

  // the report: pages slide in, each with its capture pasted
  pages.forEach((page, i) => {
    const at = B(8, 0.25 + i * 1.6);
    const k = ease(t, at, at + 0.8, outQuint);
    const paste = ease(t, at + 0.45, at + 0.85, outBack);
    const x = 600 + i * 220, y = 236 - i * 36 + mix(520, 0, k);
    const pg = pull(x, y, page);
    show(page, Math.min(k * 2, 1) * pg.a, `translate(${pg.x}px, ${pg.y}px) rotate(${(i - 1) * 4 + mix(8, 0, k)}deg) scale(${pg.s * 0.92})`);
    page.style.transformOrigin = "50% 50%";
    page.style.zIndex = 10 + i;
    const cap = page.querySelector(".cap");
    cap.style.transform = `rotate(-2deg) scale(${mix(1.25, 1, paste)})`;
    cap.style.opacity = clamp(paste * 2);
  });
}

// ---- act 2: the app ----
let F = null;           // assets/facts.json
const CLIPS = {};       // name -> {fps, frames, marks, smooth: [[x, y]], presses: [frame]}
const HOME = { cx: 800, cy: 468, z: 0.82 };
const pending = [];
function setSrc(img, src) {
  if (img.getAttribute("src") !== src) {
    img.setAttribute("src", src);
    pending.push(img.decode().catch(() => {}));
  }
}
const clipSrc = (name, shot) => `assets/clips/${name}/${String(shot).padStart(4, "0")}.jpg`;
function clipFrame(name, t) {
  const clip = CLIPS[name];
  const i = clamp(Math.floor((t - CLIP_AT[name]) * FPS), 0, clip.frames.length - 1);
  return { clip, i, f: clip.frames[i] };
}
const clipTime = (name, mark) => CLIP_AT[name] + (typeof mark === "number" ? mark : CLIPS[name].marks[mark]) / FPS;
const camMix = (a, b, k) => ({ cx: mix(a.cx, b.cx, k), cy: mix(a.cy, b.cy, k), z: mix(a.z, b.z, k) });
// the body's (x, y) in the window's coordinates
const W = (x, y) => [x, y + 36];

// a clip's camera: from each key on, glide to its target (a point, or the pointer followed)
function clipCam(name, t, keys) {
  const { clip, i } = clipFrame(name, t);
  const sm = clip.smooth[i];
  const target = (key) => {
    if (key.follow) {
      const [x, y] = W(sm[0], sm[1]);
      return { cx: mix(key.cx ?? x, x, key.follow), cy: mix(key.cy ?? y, y, key.follow), z: key.z };
    }
    return key;
  };
  let cam = target(keys[0]);
  for (const key of keys.slice(1)) {
    const at = CLIP_AT[name] + (typeof key.at === "number" ? key.at : clip.marks[key.at] + (key.after ?? 0)) / FPS;
    cam = camMix(cam, target(key), ease(t, at, at + (key.over ?? 0.8), inOutCubic));
  }
  return cam;
}

const CURSORS = {
  arrow: '<path d="M4 2 L4 24 L9.5 19 L13.2 27.5 L17 25.8 L13.4 17.6 L21 17.6 Z" fill="#fff" stroke="#111" stroke-width="1.6" stroke-linejoin="round"/>',
  move: '<path d="M16 2l5 5h-3.5v6.5H24V10l5 6-5 6v-3.5h-6.5V25H21l-5 5-5-5h3.5v-6.5H8V22l-5-6 5-6v3.5h6.5V7H11z" fill="#fff" stroke="#111" stroke-width="1.4" stroke-linejoin="round" transform="translate(-16 -16) translate(16 16)"/>',
  resize: '<path d="M4 4h9l-3.2 3.2 14 14L27 18v9h-9l3.2-3.2-14-14L4 13z" fill="#fff" stroke="#111" stroke-width="1.4" stroke-linejoin="round"/>',
  zero: '<path d="M16 2l7 8h-4.5v12H23l-7 8-7-8h4.5V10H9z" fill="#fff" stroke="#111" stroke-width="1.4" stroke-linejoin="round"/>',
  pencil: '<path d="M4 28l2-7.5L21 5.5l5.5 5.5L11.5 26z" fill="#fff" stroke="#111" stroke-width="1.6" stroke-linejoin="round"/><path d="M18.5 8l5.5 5.5" stroke="#111" stroke-width="1.6"/><path d="M4 28l2-7.5 5.5 5.5z" fill="#111"/>',
};
const HOT = { arrow: [4, 2], move: [16, 16], resize: [15.5, 15.5], zero: [16, 16], pencil: [4, 28] };
let cursorKind = "";
function drawCursor(x, y, kind, down, cam, alpha) {
  if (kind !== cursorKind) { $("cursor").innerHTML = CURSORS[kind]; cursorKind = kind; }
  const s = 1.55 / cam.z * (down ? 0.88 : 1);
  const [hx, hy] = HOT[kind];
  show($("cursor"), alpha, `translate(${x - hx * s}px, ${y + 36 - hy * s}px) scale(${s})`);
}
function drawRipple(name, t, cam) {
  const clip = CLIPS[name];
  let best = null;
  for (const p of clip.presses) {
    const at = CLIP_AT[name] + p / FPS;
    if (t >= at && t < at + 0.5) best = { at, f: clip.frames[p] };
  }
  if (!best) { show($("ripple"), 0); return; }
  const k = lin(t, best.at, best.at + 0.5);
  show($("ripple"), (1 - k) * 0.9, `translate(${best.f[1]}px, ${best.f[2] + 36}px) scale(${mix(0.2, 1, outCubic(k)) / cam.z})`);
}

function cover(cam) {
  const fit = (c, span, half) => { const a = half / cam.z, b = span - half / cam.z; return clamp(c, Math.min(a, b), Math.max(a, b)); };
  return { cx: fit(cam.cx, 1600, 960), cy: fit(cam.cy, 936, 540), z: cam.z };
}
function drawWindow(cam, alpha, dy = 0) {
  show($("win"), alpha, `translate(${960 - cam.cx * cam.z}px, ${540 - cam.cy * cam.z + dy}px) scale(${cam.z})`);
}
// a window point on the stage, under a camera
const onStage = (x, y, cam, dy = 0) => ({ x: 960 + (x - cam.cx) * cam.z, y: 540 + (y - cam.cy) * cam.z + dy });
const boxOnStage = (b, cam) => { const p = onStage(b.x, b.y + 36, cam); return { x: p.x, y: p.y, w: b.width * cam.z, h: b.height * cam.z }; };

function ctxX(time) {
  const b = F.boxes.contextImage, [t0, t1] = F.view;
  return b.x + (time - t0) / (t1 - t0) * b.width;
}

function drawAct2(t) {
  const rise = ease(t, B(10, 2.6), B(11, 1.6), outQuint);
  const away = ease(t, B(16, 3.0), B(16, 3.8), inOutCubic) * (1 - ease(t, B(18), B(18, 1.3), outQuint));
  const final = ease(t, B(33, 3), B(34, 1), inOutCubic);
  let cam = { ...HOME, z: mix(0.76, 0.82, rise) + 0.02 * lin(t, B(11), B(12)) };
  let alpha = rise * (1 - away) * (1 - final);
  let dy = mix(560, 0, rise);
  let cursor = null, ripple = null;
  show($("appFade"), 0);
  show($("appTop"), 0);
  show($("miss"), 0);
  show($("missLabel"), 0);

  if (t < CLIP_AT.recipe) {
    setSrc($("appImg"), "assets/editor-final.jpg");
  } else if (t < CLIP_AT.setup) {
    const { f } = clipFrame("recipe", t);
    setSrc($("appImg"), clipSrc("recipe", f[0]));
    setSrc($("appFade"), "assets/editor-final.jpg");
    show($("appFade"), 1 - ease(t, CLIP_AT.recipe, CLIP_AT.recipe + 0.45));
    const frameMid = { cx: 620, cy: 500, z: 1.16 };
    cam = camMix(cam, clipCam("recipe", t, [
      HOME,
      { at: "move", after: -20, ...frameMid },
      { at: "move", after: 6, follow: 0.55, cx: 640, cy: 520, z: 1.34, over: 1.0 },
      { at: "save", after: -24, cx: 1240, cy: 260, z: 1.05, over: 1.1 },
      { at: "save", after: 20, ...HOME, over: 1.0 },
    ]), 1);
    cursor = { name: "recipe", f, alpha: life(t, CLIP_AT.recipe, CLIP_AT.setup - 0.2, 0.3, 0.3) };
  } else if (t < B(18)) {
    const { f } = clipFrame("setup", t);
    setSrc($("appImg"), clipSrc("setup", f[0]));
    setSrc($("appFade"), clipSrc("recipe", CLIPS.recipe.frames.at(-1)[0]));
    show($("appFade"), 1 - ease(t, CLIP_AT.setup, CLIP_AT.setup + 0.4));
    cam = clipCam("setup", t, [HOME, { at: 6, follow: 0.6, z: 1.06, over: 0.7 }]);
    cam = camMix(cam, { cx: 800, cy: 468, z: 0.7 }, away);
    cursor = { name: "setup", f, alpha: life(t, CLIP_AT.setup, B(16, 3.2), 0.2, 0.3) };
  } else if (t < CLIP_AT.edit) {
    // the editor as the analysis left it: the draft drawn on, then where it misses the edge
    setSrc($("appImg"), "assets/editor-noline.jpg");
    setSrc($("appTop"), "assets/editor-draft.jpg");
    const wipe = ease(t, B(18, 1.6), B(19, 2.2), inOutCubic);
    const edge = mix(50, 1226, wipe);
    show($("appTop"), wipe > 0 ? 1 : 0);
    $("appTop").style.clipPath = `inset(0 ${1600 - edge}px 0 0)`;
    const m = F.boxes.contextImage;
    const x0 = ctxX(6.5), x1 = ctxX(31.5);
    place($("miss"), { x: x0, y: m.y - 4, w: x1 - x0, h: m.height + 8 });
    const pulse = 0.75 + 0.25 * Math.sin((t - B(20)) * Math.PI / BEAT);
    const missIn = life(t, B(20, 1), CLIP_AT.edit + 0.6, 0.5, 0.5);
    show($("miss"), missIn * pulse);
    place($("missLabel"), { x: x0, y: m.y - 52, w: null, h: null });
    $("missLabel").style.width = $("missLabel").style.height = "";
    show($("missLabel"), missIn);
    const look = { cx: (x0 + x1) / 2 + 40, cy: m.y + 36 + m.height / 2 - 70, z: 1.32 };
    cam = camMix(cam, look, ease(t, B(20), B(20, 2.2), inOutCubic));
  } else if (t < B(27)) {
    const { f } = clipFrame("edit", t);
    setSrc($("appImg"), clipSrc("edit", f[0]));
    const m = F.boxes.contextImage;
    const x0 = ctxX(6.5), x1 = ctxX(31.5);
    const look = { cx: (x0 + x1) / 2 + 40, cy: m.y + 36 + m.height / 2 - 70, z: 1.32 };
    const v = F.boxes.video, j = F.boxes.judgment;
    cam = clipCam("edit", t, [
      look,
      { at: 4, follow: 0.7, cx: 600, cy: 300, z: 1.12, over: 0.9 },
      { at: "stroke", after: -16, follow: 0.45, cx: look.cx, cy: look.cy, z: 1.3, over: 0.9 },
      { at: "stroked", after: 4, cx: j.x + j.width / 2, cy: j.y + 36 + 110, z: 2.0, over: 0.9 },
      { at: "look", after: -18, follow: 0.5, cx: 700, cy: 600, z: 1.1, over: 0.7 },
      { at: "look", after: 14, cx: v.x + v.width / 2, cy: v.y + 36 + v.height / 2 + 60, z: 2.0, over: 0.9 },
      { at: "check", after: -20, cx: j.x + j.width / 2, cy: j.y + 36 + 200, z: 1.9, over: 0.8 },
    ]);
    cam = camMix(cam, HOME, ease(t, B(26, 1), B(26, 3), inOutCubic));
    cursor = { name: "edit", f, alpha: life(t, CLIP_AT.edit, B(26, 2), 0.3, 0.4) };
    show($("miss"), (1 - ease(t, CLIP_AT.edit, CLIP_AT.edit + 0.6)) * 0.9);
    place($("miss"), { x: x0, y: m.y - 4, w: x1 - x0, h: m.height + 8 });
  } else if (t < CLIP_AT.submit) {
    setSrc($("appImg"), clipSrc("edit", CLIPS.edit.frames.at(-1)[0]));
    const aside = { cx: 1467, cy: 368, z: 0.6 };
    cam = camMix(HOME, aside, ease(t, B(27), B(27, 2), inOutCubic) * (1 - ease(t, B(30, 2), B(31), inOutCubic)));
  } else {
    const { f } = clipFrame("submit", t);
    setSrc($("appImg"), clipSrc("submit", f[0]));
    cam = clipCam("submit", t, [
      HOME,
      { at: "dialog", after: -6, cx: 800, cy: 470, z: 1.22, over: 0.7 },
      { at: "submitted", after: 2, cx: 640, cy: 150, z: 1.3, over: 0.7 },
      { at: "submitted", after: 26, ...HOME, z: 0.74, over: 1.0 },
    ]);
    cursor = { name: "submit", f, alpha: life(t, CLIP_AT.submit, clipTime("submit", "submitted") + 0.6, 0.3, 0.3) };
    const report = clipTime("submit", "submitted") + 0.7;
    alpha *= 1 - ease(t, report, report + 0.9);
  }
  cam = cover(cam);
  drawWindow(cam, alpha, dy);
  if (cursor && alpha > 0) {
    drawCursor(cursor.f[1], cursor.f[2], cursor.f[4], cursor.f[3], cam, cursor.alpha * alpha);
    drawRipple(cursor.name, t, cam);
  } else {
    show($("cursor"), 0);
    show($("ripple"), 0);
  }
}

// the analysis as a picture: the video runs, each moment's middle band flies into the context image
const CUP = { x: 150, y: 330, w: 520, h: 498 };     // the cup card (crop 760-1490 x 300-1000 at 0.712)
const CTX = { x: 800, y: 330, w: 980, h: 498 };     // the context image card
const STRIPS = 24;
let strips = [];
function buildStrips() {

    const s = document.createElement("div");
    s.className = "abs";
    s.style.cssText += "border-radius:3px;background-repeat:no-repeat;box-shadow:0 4px 12px rgba(16,42,77,0.25)";
    s.style.backgroundImage = `url(assets/cup-${String(i).padStart(2, "0")}.jpg)`;

}
function drawBuild(t) {
  const start = B(16, 3.3), end = B(17, 3.2);
  const k = life(t, start, B(18, 1.2), 0.6, 0.01);
  const fly = ease(t, B(18), B(18, 1.4), inOutCubic);
  const scale = CUP.w / 730;
  const band = { x: (F.band[0] - 760) * scale, y: (F.top - 300) * scale, w: (F.band[1] - F.band[0]) * scale, h: (F.bottom - F.top) * scale };
  const n = clamp(Math.floor(lin(t, start, end) * STRIPS), 0, STRIPS - 1);
  setSrc($("cupImg"), `assets/cup-${String(n).padStart(2, "0")}.jpg`);
  show($("cupCard"), k * (1 - ease(t, B(18), B(18, 0.9))), `translate(${CUP.x - 60 * fly}px, ${CUP.y + mix(40, 0, ease(t, start, start + 0.6))}px)`);
  place($("cupBand"), band);
  // the context image: revealed as strips land; at bar 18 it flies into the editor
  const target = boxOnStage(F.boxes.contextImage, HOME);
  const r = mixRect(CTX, target, fly);
  place($("ctxCard"), r);
  const enter = ease(t, start - 0.2, start + 0.5, outQuint);
  show($("ctxCard"), enter * (1 - ease(t, B(18, 1.0), B(18, 1.4))), `translateY(${mix(30, 0, enter)}px)`);
  $("ctxCard").style.borderRadius = `${mix(16, 2, fly)}px`;
  const shown = lin(t, start + 0.25, end + 0.35);
  $("ctxClip").style.clipPath = `inset(0 ${(1 - shown) * 100}% 0 0)`;
  show($("ctxLabel"), life(t, B(17, 0.6), B(18, 0.3)), `translateY(${CTX.y + CTX.h + 34}px)`);
  strips.forEach((s, i) => {
    const at = start + (end - start) * i / STRIPS;
    const p = ease(t, at, at + 0.55, inOutCubic);
    const from = { x: CUP.x + band.x, y: CUP.y + band.y, w: band.w, h: band.h };
    const to = { x: CTX.x + CTX.w * (i / STRIPS), y: CTX.y, w: CTX.w / STRIPS + 1, h: CTX.h };
    const r2 = mixRect(from, to, p);
    place(s, r2);
    s.style.backgroundSize = `${730 * scale * r2.w / band.w}px ${700 * scale * r2.h / band.h}px`;
    s.style.backgroundPosition = `${-band.x * r2.w / band.w}px ${-band.y * r2.h / band.h}px`;
    show(s, t >= at && p < 1 ? 1 - ease(t, at + 0.4, at + 0.55) : 0, `translateY(${-60 * Math.sin(Math.PI * p)}px)`);
  });
}

function drawJudgment(t) {
  const j = F.boxes.judgment;
  const aside = { cx: 1467, cy: 368, z: 0.6 };
  const k = ease(t, B(27, 0.5), B(27, 2.3), inOutCubic);
  const back = ease(t, B(30, 2), B(31), inOutCubic);
  const camNow = camMix(HOME, aside, ease(t, B(27), B(27, 2), inOutCubic) * (1 - back));
  const from = boxOnStage(j, camNow);
  const to = { x: 1090, y: 220, w: 720, h: 720 * j.height / j.width };
  const r = mixRect(from, to, k * (1 - back));
  show($("judgeLift"), t > B(27, 0.4) && t < B(31) ? 1 : 0);
  place($("judgeLift"), r);
  $("judgeLift").style.boxShadow = `0 ${40 * k}px ${90 * k}px rgba(16,42,77,${0.18 * k}), 0 0 0 1px rgba(16,42,77,0.08)`;
  // its rows lit one by one: the rule's evidence
  const sc = r.w / j.width;
  const want = ["압축기 기동", "0선 회복", "회복 뒤 유지", "유효 비율"];
  const marks = $("rowMarks");
  if (!marks.children.length) {
    const v = document.createElement("div");
    v.className = "rowmark";
    marks.append(v);
    for (const label of want) {
      const row = F.judgmentRows.find((x) => x.label.trim() === label);
      const m = document.createElement("div");
      m.className = "rowmark";
      m.dataset.box = JSON.stringify(row ? row.box : null);
      marks.append(m);
    }
    marks.children[0].dataset.box = JSON.stringify(F.verdict);
  }
  [...marks.children].forEach((m, i) => {
    const b = JSON.parse(m.dataset.box);
    if (!b) return;
    const at = i === 0 ? B(28) : B(28, 2 * i);
    const a = life(t, at, i === 0 ? B(30, 1) : at + 2 * BEAT + 0.1, 0.25, 0.3) * (1 - back);
    place(m, { x: (b.x - 6) * sc, y: (b.y - 2) * sc, w: (b.width + 12) * sc, h: (b.height + 4) * sc });
    show(m, a);
  });
}

function drawReport(t) {
  const at = clipTime("submit", "submitted") + 0.7;
  const k = ease(t, at, at + 1.3, outQuint);
  const second = ease(t, B(33), B(33, 1.6), outQuint);
  const out = ease(t, B(33, 3), B(34, 1), inOutCubic);
  const w = 1150, h = w * 1588 / 2248;
  const from = { x: 960 - 200, y: 540 - 140, w: 400, h: 400 * 1588 / 2248 };
  const to = { x: 960 - w / 2 + 60, y: 214, w, h };
  place($("report0"), mixRect(from, to, k));
  show($("report0"), clamp(k * 3) * (1 - out), `translateY(${-200 * out}px) perspective(2400px) rotateX(${mix(18, 0, k)}deg)`);
  place($("report1"), { x: to.x + mix(0, -130, second), y: to.y + mix(0, -46, second), w, h });
  show($("report1"), second * 0.95 * (1 - out), `translateY(${-200 * out}px) rotate(${mix(0, -3, second)}deg)`);
  $("report1").style.transformOrigin = "50% 50%";
}

// ---- act 3 ----
const FLIPS = [
  { before: "배속으로 끝까지 보기", after: "한 장의 맥락 이미지로", key: "맥락 이미지" },
  { before: "엑셀에 적고 그래프 그리기", after: "자동 초안, 바로 그려지는 그래프", key: "초안 + 편집" },
  { before: "캡처를 붙여 보고서 만들기", after: "제출하면 보고서", key: "보고서" },
];
let flips = [];
function buildFlips() {
  FLIPS.forEach((item, i) => {
    const box = document.createElement("div");
    box.className = "flip";
    const before = ['<svg viewBox="0 0 464 236" width="464" height="236"><rect width="464" height="236" fill="#EEF1F4"/><rect x="92" y="38" width="280" height="140" rx="10" fill="#fff" stroke="#C9D2DA" stroke-width="3"/><circle cx="232" cy="108" r="44" fill="#9AA7B3"/><circle cx="232" cy="108" r="30" fill="#E9A23B"/><rect x="92" y="196" width="280" height="8" rx="4" fill="#D1D1D1"/><rect x="92" y="196" width="18" height="8" rx="4" fill="#0F6CBD"/><text x="380" y="70" font-size="30" font-weight="800" fill="#0F6CBD">▶▶</text></svg>',
      '<svg viewBox="0 0 464 236" width="464" height="236"><rect width="464" height="236" fill="#EEF1F4"/><rect x="40" y="30" width="180" height="176" rx="8" fill="#fff" stroke="#C9D2DA" stroke-width="3"/>' + [0, 1, 2, 3, 4, 5].map((r) => `<rect x="56" y="${50 + r * 26}" width="${70 + (r * 37) % 60}" height="9" rx="4" fill="#D5DEE8"/>`).join("") + '<rect x="244" y="30" width="180" height="176" rx="8" fill="#fff" stroke="#C9D2DA" stroke-width="3"/><polyline points="262,170 290,160 318,120 346,104 374,110 404,92" fill="none" stroke="#0F6CBD" stroke-width="4"/></svg>',
      '<svg viewBox="0 0 464 236" width="464" height="236"><rect width="464" height="236" fill="#EEF1F4"/><rect x="150" y="18" width="164" height="210" rx="6" fill="#fff" stroke="#C9D2DA" stroke-width="3"/><rect x="168" y="40" width="80" height="8" rx="4" fill="#9AA7B3"/><rect x="168" y="62" width="96" height="66" fill="#9AA7B3" transform="rotate(-3 216 95)" stroke="#0F6CBD" stroke-dasharray="5 4" stroke-width="2"/><rect x="168" y="146" width="128" height="8" rx="4" fill="#D5DEE8"/><rect x="168" y="166" width="110" height="8" rx="4" fill="#D5DEE8"/><rect x="168" y="186" width="120" height="8" rx="4" fill="#D5DEE8"/></svg>'][i];
    const g = F.boxes.graph;
    const after = [
      '<img src="assets/context.png" style="width:464px;height:236px">',
      `<div style="width:464px;height:236px;background:url(assets/editor-final.jpg);background-size:${1600 * 464 / g.width}px auto;background-position:0 ${-(g.y) * 464 / g.width}px"></div>`,
      '<img src="assets/report-0.png" style="width:464px;height:328px;margin-top:-6px">'][i];
    box.innerHTML = `<div class="face before"><div class="pic">${before}</div><div class="t">${item.before}</div><div class="k">이전</div></div>
      <div class="face after"><div class="pic">${after}</div><div class="t">${item.after}</div><div class="k">Oil Level Tracker · ${item.key}</div></div>`;
    $("flips").append(box);
    flips.push(box);
  });
}
function drawAct3(t) {
  const out = ease(t, B(37, 2.6), B(38, 0.5), inOutCubic);
  flips.forEach((box, i) => {
    const at = B(34, 0.3 + i * 0.4);
    const k = ease(t, at, at + 0.9, outQuint);
    const turn = ease(t, B(35 + i), B(35 + i, 1.3), outBack);
    const x = 120 + i * 580, y = 330 + mix(80, 0, k);
    show(box, k * (1 - out), `translate(${x}px, ${y - 60 * out}px) scale(${mix(1, 0.92, out)})`);
    const [before, after] = box.children;
    before.style.transform = `rotateY(${-180 * turn}deg)`;
    after.style.transform = `rotateY(${180 - 180 * turn}deg)`;
  });
  // the name: the level rises under it
  const n = ease(t, B(38, 0.2), B(38, 1.5), outQuint);
  show($("name"), n * (1 - ease(t, DURATION - 1.6, DURATION - 0.4)), `translateY(${mix(40, 0, n)}px)`);
  $("name").style.top = "380px";
  const rule = ease(t, B(38, 0.6), B(38, 2.4), inOutCubic);
  place($("nameRule"), { x: 960 - 520 * rule, y: 556, w: 1040 * rule, h: 6 });
  show($("nameRule"), rule > 0 ? 1 - ease(t, DURATION - 1.6, DURATION - 0.4) : 0);
  show($("tagline"), life(t, B(38, 1.2), DURATION - 0.4, 0.8, 1.2), `translateY(${600 + mix(16, 0, ease(t, B(38, 1.2), B(38, 2)))}px)`);
}

// ---- the frame at t ----
function seek(t) {
  pending.length = 0;
  drawAct1(t);
  drawAct2(t);
  drawBuild(t);
  drawJudgment(t);
  drawReport(t);
  drawAct3(t);
  drawTexts(t);
  show($("white"), ease(t, DURATION - 1.3, DURATION - 0.1));
  return Promise.all(pending);
}

function setup() {
  G = sightGlass($("playerGlass"), "pl");
  buildSheet();
  buildChart();
  buildPages();
  buildStrips();
  buildFlips();
  $("ctxImg").src = "assets/context.png";

  // act 1 (the line at the bottom: the eye learns where the words are)
  line(860, 78, [["긴", B(0, 0.6)], ["검사", B(0, 0.8)], ["영상을,", B(0, 1.0)], ["배속으로,", B(1, 0.2), 1], ["끝까지", B(1, 0.6), 1]], B(2, -0.1));
  line(860, 78, [["보고,", B(2)], ["멈추고,", B(2, 1)], ["적고.", B(2, 2), 1]], B(5, -0.1));
  sub(966, "영상이 끝날 때까지, 계속", B(3, 0.5), B(5, -0.1));
  line(860, 78, [["그래프", B(5, 0.1)], ["작성도", B(5, 0.3)], ["손으로.", B(5, 0.6), 1]], B(8, -0.1));
  sub(966, "범위를 맞추고, 다시 그리고", B(6, 1.6), B(8, -0.1));
  line(860, 78, [["캡처를", B(8, 0.1)], ["붙여", B(8, 0.3)], ["보고서까지.", B(8, 0.6), 1]], B(9, 1.0));
  const all = line(470, 96, [["이", B(9, 2.3)], ["모든", B(9, 2.5)], ["일을,", B(9, 2.7)], ["하나의", B(10), 1], ["앱으로.", B(10, 0.3), 1]], B(12, -0.15));
  all.move = (t) => {
    const k = ease(t, B(10, 1.5), B(10, 3.3), inOutCubic);
    return `translateY(${mix(0, -410, k)}px) scale(${mix(1, 0.62, k)})`;
  };

  // act 2 (above the window, and pills over it while the camera is close)
  const top = 44, size = 60;
  line(top, size, [["장비마다", B(12, 0.2)], ["한", B(12, 0.4)], ["번,", B(12, 0.6)], ["Recipe", B(12, 1.0), 1]], clipTime("recipe", "move") - 0.45);
  pill(968, "타원을 끌어 Glass에 맞추고", clipTime("recipe", "move") - 0.3, clipTime("recipe", "zero") - 0.1);
  pill(968, "0선을 끌어 기준을 정하면", clipTime("recipe", "zero") - 0.1, clipTime("recipe", "save"));
  pill(968, "저장. 장비마다 한 번이면 됩니다", clipTime("recipe", "save"), B(16, -0.05));
  line(top, size, [["분석을", B(16, 0.3)], ["시작하면", B(16, 0.6)]], B(16, 3.2));
  line(150, 72, [["긴", B(17)], ["영상이", B(17, 0.2)], ["한", B(17, 0.5)], ["장의", B(17, 0.7)], ["그림으로", B(17, 1.0), 1]], B(18, 0.6));
  line(top, size, [["초안은", B(19)], ["앱이", B(19, 0.25)], ["그리고", B(19, 0.5), 1]], B(20, 0.6));
  pill(968, "흐릿한 경계에서는 초안이 빗나가기도 합니다", B(20, 1.5), CLIP_AT.edit);
  line(top, size, [["판단은", B(22)], ["검사자가", B(22, 0.4), 1]], B(22, 2.0));
  pill(968, "맥락 이미지의 경계를 따라 그리면", clipTime("edit", "stroke") - 0.4, clipTime("edit", "stroked"));
  pill(968, "판정이 바로 다시 계산되고", clipTime("edit", "stroked"), clipTime("edit", "look") - 0.2);
  pill(968, "원본 영상과 나란히 확인하고", clipTime("edit", "look") - 0.2, clipTime("edit", "check") - 0.1);
  pill(968, "판단은 검사자의 확인으로", clipTime("edit", "check") - 0.1, B(26, 3));
  line(top + 40, 68, [["규칙대로,", B(27, 0.4)], ["근거와", B(27, 0.8)], ["함께", B(27, 1.1), 1]], B(31, -0.1));
  pill(968, "제출하면 이 버전은 잠깁니다", clipTime("submit", "dialog") - 0.2, clipTime("submit", "submitted") + 0.6);
  line(top, size, [["제출하면,", clipTime("submit", "submitted") + 0.5], ["보고서까지", clipTime("submit", "submitted") + 0.8, 1]], B(34, 0.4));

  // act 3
  line(150, 72, [["같은", B(34, 0.2)], ["검사,", B(34, 0.4)], ["더", B(34, 0.7)], ["가볍게", B(34, 0.9), 1]], B(38, 0.3));

  // sounds that follow the pictures
  cue(B(1, 0.4), "whoosh", 0.5);
  cue(B(2), "whoosh", 0.4);
  points.forEach((_, i) => cue(B(5, 1) + i * BEAT * 0.55, "tick", 0.5));
  cue(B(6, 1), "tok", 0.8);
  cue(B(6, 2.7), "tok", 0.6);
  cue(B(7, 0.2), "scribble", 0.5);
  pages.forEach((_, i) => { cue(B(8, 0.25 + i * 1.6), "whoosh", 0.45); cue(B(8, 0.7 + i * 1.6), "click", 0.8); });
  cue(B(9, 0.6), "whoosh", 0.7);
  cue(B(10, 2), "whoosh", 0.6);
  cue(B(11), "shimmer", 0.8);
  for (const name of Object.keys(CLIP_AT)) for (const p of CLIPS[name].presses) cue(CLIP_AT[name] + p / FPS, "click", 0.9);
  for (let i = 0; i < STRIPS; i += 1) cue(B(16, 3.3) + (B(17, 3.2) - B(16, 3.3)) * i / STRIPS + 0.5, "tick", 0.35);
  cue(B(18), "whoosh", 0.7);
  cue(clipTime("edit", "stroke"), "scribble", 0.6);
  cue(clipTime("edit", "stroked") + 0.3, "chime", 0.8);
  cue(clipTime("edit", "check") + 0.3, "chime", 0.5);
  cue(B(27, 0.5), "whoosh", 0.5);
  for (let i = 0; i < 4; i += 1) cue(i === 0 ? B(28) : B(28, 2 * i), "tick", 0.6);
  cue(clipTime("submit", "submitted") + 0.1, "stamp", 0.9);
  cue(clipTime("submit", "submitted") + 0.7, "whoosh", 0.6);
  for (let i = 0; i < 3; i += 1) cue(B(35 + i), "flip", 0.8);
  cue(B(38, 0.3), "shimmer", 0.9);
}

async function ready() {
  F = await (await fetch("assets/facts.json")).json();
  for (const name of Object.keys(CLIP_AT)) {
    const clip = await (await fetch(`assets/clips/${name}.json`)).json();
    // the pointer smoothed over a third of a second, for a camera that follows it calmly
    clip.smooth = clip.frames.map((_, i) => {
      let x = 0, y = 0, n = 0;
      for (let j = Math.max(0, i - 10); j <= Math.min(clip.frames.length - 1, i + 10); j += 1) {
        x += clip.frames[j][1]; y += clip.frames[j][2]; n += 1;
      }
      return [x / n, y / n];
    });
    clip.presses = clip.frames.flatMap((f, i) => (f[3] && !(clip.frames[i - 1]?.[3]) ? [i] : []));
    CLIPS[name] = clip;
  }
  setup();
  await Promise.all([...document.images].map((img) => (img.complete ? null : new Promise((r) => { img.onload = img.onerror = r; }))));
  await document.fonts.ready;
  await seek(0);
  return { fps: FPS, duration: DURATION, cues: CUES };
}

window.intro = { ready: ready(), seek };
window.intro.ready.then(() => {
  const query = new URLSearchParams(location.search);
  if (query.has("t")) seek(Number(query.get("t")));
  if (query.has("play")) {
    const began = performance.now();
    const tick = () => { seek(((performance.now() - began) / 1000) % DURATION); requestAnimationFrame(tick); };
    requestAnimationFrame(tick);
  }
});
</script>
