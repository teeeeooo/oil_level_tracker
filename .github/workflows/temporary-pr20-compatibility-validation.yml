name: Temporary PR20 Compatibility Validation

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read
  pull-requests: write

jobs:
  full-suite:
    name: Python ${{ matrix.python-version }} full suite
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.13", "3.14"]

    steps:
      - name: Check out exact feature head
        uses: actions/checkout@v4
        with:
          ref: 261a8b32f64817adeafaaec5ea31e644922c833c
          fetch-depth: 0

      - name: Assert exact checkout SHA
        shell: bash
        run: |
          expected="261a8b32f64817adeafaaec5ea31e644922c833c"
          actual="$(git rev-parse HEAD)"
          echo "Expected SHA: ${expected}"
          echo "Actual SHA:   ${actual}"
          test "${actual}" = "${expected}"

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install project and test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Record runtime versions
        run: |
          python - <<'PY' > runtime-versions.txt
          import sys
          import PySide6
          import matplotlib

          print(f"Python: {sys.version}")
          print(f"PySide6: {PySide6.__version__}")
          print(f"Matplotlib: {matplotlib.__version__}")
          PY
          cat runtime-versions.txt

      - name: Run canonical offscreen suite
        id: pytest
        continue-on-error: true
        env:
          QT_QPA_PLATFORM: offscreen
        shell: bash
        run: |
          set +e
          python -m pytest -q > pytest-output.txt 2>&1
          status=$?
          cat pytest-output.txt
          echo "exit_code=${status}" >> "${GITHUB_OUTPUT}"
          exit 0

      - name: Publish matrix result to validation PR
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          PYTHON_VERSION: ${{ matrix.python-version }}
          EXACT_SHA: 261a8b32f64817adeafaaec5ea31e644922c833c
        shell: bash
        run: |
          {
            echo "### Temporary exact-head validation — Python ${PYTHON_VERSION}"
            echo
            echo "- Exact feature SHA: \`${EXACT_SHA}\`"
            echo "- Runner: Ubuntu 24.04"
            echo "- Command: \`QT_QPA_PLATFORM=offscreen python -m pytest -q\`"
            echo
            echo '```text'
            cat runtime-versions.txt
            echo
            tail -n 180 pytest-output.txt
            echo '```'
          } > validation-comment.md
          gh pr comment "${{ github.event.pull_request.number }}" --body-file validation-comment.md

      - name: Preserve pytest failure conclusion
        if: steps.pytest.outputs.exit_code != '0'
        run: exit 1
