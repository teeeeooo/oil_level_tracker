name: Phase 2C-3 focused validation

on:
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/phase2c3-focused.yml

permissions:
  contents: write

jobs:
  patch-feature:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/result-review-user-truth-regression
      - name: Assert exact feature head
        run: test "$(git rev-parse HEAD)" = "48be9f58d7b38bad73c886ab38377f04e786cee9"
      - name: Normalize Qt enum data and render test contract
        shell: python
        run: |
          from pathlib import Path

          def replace_once(path, old, new, label):
              text = path.read_text(encoding="utf-8")
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{label}: expected one target, found {count}")
              path.write_text(text.replace(old, new), encoding="utf-8")

          window = Path("src/oil_tracker/ui/truth_annotation_window.py")
          replace_once(
              window,
              '''        disposition_filter = self.disposition_filter.currentData()
        error_filter = self.error_filter.currentData()''',
              '''        raw_disposition_filter = self.disposition_filter.currentData()
        raw_error_filter = self.error_filter.currentData()
        disposition_filter = (
            None
            if raw_disposition_filter is None
            else TruthDisposition(str(raw_disposition_filter))
        )
        error_filter = (
            None
            if raw_error_filter is None
            else TruthErrorType(str(raw_error_filter))
        )''',
              "filter enum normalization",
          )
          replace_once(
              window,
              '''        fill_state = self.fill_state.currentData() if disposition is TruthDisposition.CORRECTED else None''',
              '''        fill_state = (
            FillState(str(self.fill_state.currentData()))
            if disposition is TruthDisposition.CORRECTED
            else None
        )''',
              "draft fill state normalization",
          )
          replace_once(
              window,
              '''    def _state_changed(self, _index: int) -> None:
        state = self.fill_state.currentData()''',
              '''    def _state_changed(self, _index: int) -> None:
        state = FillState(str(self.fill_state.currentData()))''',
              "state change normalization",
          )
          replace_once(
              window,
              '''        state = self.fill_state.currentData()
        visible_states = {''',
              '''        state = FillState(str(self.fill_state.currentData()))
        visible_states = {''',
              "validation state normalization",
          )

          canvas_test = Path("tests/gui/test_truth_annotation_canvas.py")
          replace_once(
              canvas_test,
              '''    painter = QPainter(image)
    canvas.render(painter)
    painter.end()''',
              '''    canvas.render(image)''',
              "PySide render signature",
          )
          replace_once(
              canvas_test,
              '''from PySide6.QtGui import QImage, QPainter''',
              '''from PySide6.QtGui import QImage''',
              "unused painter import",
          )

          window_test = Path("tests/gui/test_truth_annotation_window.py")
          replace_once(
              window_test,
              '''    assert window.fill_state.currentData() is official.fill_state''',
              '''    assert FillState(str(window.fill_state.currentData())) is official.fill_state''',
              "Qt enum assertion",
          )
      - name: Commit and push feature fixes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/oil_tracker/ui/truth_annotation_window.py tests/gui/test_truth_annotation_canvas.py tests/gui/test_truth_annotation_window.py
          git commit -m "fix: normalize truth editor Qt enum data"
          git push origin HEAD:feature/result-review-user-truth-regression
