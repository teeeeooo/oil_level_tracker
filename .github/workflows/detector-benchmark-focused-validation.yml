name: Detector benchmark focused exact-head validation

on:
  pull_request:
    branches: [main]

permissions:
  contents: read
  pull-requests: write

jobs:
  focused:
    runs-on: ubuntu-24.04
    env:
      EXPECTED_FEATURE_SHA: 73edfedb61948e2ff0431ed31075db1ac5d682ef
      OIL_TRACKER_SOURCE_REVISION: 73edfedb61948e2ff0431ed31075db1ac5d682ef
      PR_NUMBER: ${{ github.event.pull_request.number }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout exact feature head
        uses: actions/checkout@v4
        with:
          repository: teeeeooo/oil_level_tracker
          ref: 73edfedb61948e2ff0431ed31075db1ac5d682ef
          fetch-depth: 1
      - name: Assert exact checkout SHA
        run: |
          echo "expected_sha=$EXPECTED_FEATURE_SHA"
          echo "actual_sha=$(git rev-parse HEAD)"
          test "$(git rev-parse HEAD)" = "$EXPECTED_FEATURE_SHA"
      - name: Install Qt runtime library
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1
      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - name: Install project
        run: python -m pip install -e ".[dev]"
      - name: Print runtime versions
        run: |
          python --version
          python - <<'PY'
          import cv2, matplotlib, numpy, PySide6, pytest
          print(f"PySide6={PySide6.__version__}")
          print(f"NumPy={numpy.__version__}")
          print(f"OpenCV={cv2.__version__}")
          print(f"Matplotlib={matplotlib.__version__}")
          print(f"pytest={pytest.__version__}")
          PY
      - name: Run focused tests and publish bounded result
        env:
          QT_QPA_PLATFORM: offscreen
        shell: bash
        run: |
          set +e
          python -m pytest -q \
            tests/test_regression_dataset_reader.py \
            tests/test_detector_benchmark_metrics.py \
            tests/test_detector_benchmark_runner.py \
            tests/test_benchmark_result_writer.py \
            tests/test_benchmark_cli.py \
            tests/test_detector_benchmark_architecture.py \
            tests/test_detector_benchmark_integration.py \
            tests/test_ui_import_boundaries.py > focused.log 2>&1
          status=$?
          python - "$status" <<'PY'
          from pathlib import Path
          import sys
          status = int(sys.argv[1])
          lines = Path("focused.log").read_text(encoding="utf-8", errors="replace").splitlines()
          tail = "\n".join(lines[-220:])
          body = (
              "## Focused exact-head result\n\n"
              "- Expected/checked-out feature SHA: `73edfedb61948e2ff0431ed31075db1ac5d682ef`\n"
              f"- pytest exit code: `{status}`\n\n"
              "```text\n" + tail + "\n```\n"
          )
          Path("focused-comment.md").write_text(body, encoding="utf-8")
          PY
          gh pr comment "$PR_NUMBER" --repo teeeeooo/oil_level_tracker --body-file focused-comment.md
          cat focused.log
          exit "$status"
