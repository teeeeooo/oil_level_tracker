name: Cleanup focused detector benchmark validation

on:
  pull_request:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

jobs:
  cleanup:
    runs-on: ubuntu-24.04
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Close temporary validation PR
        run: gh pr close 30 --repo teeeeooo/oil_level_tracker --comment "Focused diagnostics applied to feature head; cleaning temporary validation resources."
      - name: Delete temporary validation branch
        run: gh api --method DELETE repos/teeeeooo/oil_level_tracker/git/refs/heads/validation/detector-benchmark-focused-e4e58b6
