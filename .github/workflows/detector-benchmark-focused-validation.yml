name: Detector benchmark focused exact-head validation

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  focused:
    runs-on: ubuntu-24.04
    env:
      EXPECTED_FEATURE_SHA: e4e58b628965d4ea9e40dbfac3657958f0afd5b2
      OIL_TRACKER_SOURCE_REVISION: e4e58b628965d4ea9e40dbfac3657958f0afd5b2
    steps:
      - name: Checkout exact feature head
        uses: actions/checkout@v4
        with:
          repository: teeeeooo/oil_level_tracker
          ref: e4e58b628965d4ea9e40dbfac3657958f0afd5b2
          fetch-depth: 1
      - name: Assert exact checkout SHA
        run: |
          echo "expected_sha=$EXPECTED_FEATURE_SHA"
          echo "actual_sha=$(git rev-parse HEAD)"
          test "$(git rev-parse HEAD)" = "$EXPECTED_FEATURE_SHA"
      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - name: Install project
        run: python -m pip install -e ".[dev]"
      - name: Print runtime versions
        run: |
          python --version
          python - <<'PY'
          import cv2, matplotlib, numpy, PySide6, pytest
          print(f"PySide6={PySide6.__version__}")
          print(f"NumPy={numpy.__version__}")
          print(f"OpenCV={cv2.__version__}")
          print(f"Matplotlib={matplotlib.__version__}")
          print(f"pytest={pytest.__version__}")
          PY
      - name: Run focused benchmark tests
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          python -m pytest -q \
            tests/test_regression_dataset_reader.py \
            tests/test_detector_benchmark_metrics.py \
            tests/test_detector_benchmark_runner.py \
            tests/test_benchmark_result_writer.py \
            tests/test_benchmark_cli.py \
            tests/test_detector_benchmark_architecture.py \
            tests/test_detector_benchmark_integration.py \
            tests/test_ui_import_boundaries.py
