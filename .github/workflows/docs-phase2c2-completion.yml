name: Apply Phase 2C-2 completion docs

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/docs-phase2c2-completion.yml

permissions:
  contents: write

jobs:
  update-docs:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 2
      - name: Assert merge head
        run: |
          test "$(git rev-parse HEAD^)" = "06d6937b55c70b4726340ee698dfd9ed7d089f23"
      - name: Update Phase 2C-2 completion records
        shell: python
        run: |
          from pathlib import Path

          ux_path = Path("docs/UX_IMPROVEMENT_BACKLOG.md")
          ux = ux_path.read_text(encoding="utf-8")
          replacements = [
              (
                  "| Phase 2C | 개발용 디버그, 재검출과 공유 확장 | 진행 중 — 2C-1 완료 |",
                  "| Phase 2C | 개발용 디버그, 재검출과 공유 확장 | 진행 중 — 2C-1, 2C-2 완료 |",
              ),
              (
                  "**진행 중 — Phase 2C-1 완료**\n\n- Phase 2C-1 `Debug Viewer`: 완료\n- 다음 작업: Phase 2C-2 `부분 재검출과 비교`",
                  "**진행 중 — Phase 2C-1, Phase 2C-2 완료**\n\n- Phase 2C-1 `Debug Viewer`: 완료\n- Phase 2C-2 `부분 재검출과 비교`: 완료\n- 다음 작업: Phase 2C-3 `사용자 정답과 회귀 자료`",
              ),
              (
                  "- 실제 Windows DPI, 장시간 영상 성능, production codec과 file lock 해제는 수동 확인 항목으로 유지\n\n### 목적",
                  "- 실제 Windows DPI, 장시간 영상 성능, production codec과 file lock 해제는 수동 확인 항목으로 유지\n\nPhase 2C-2는 PR #20 `feat: add partial re-detection comparison`으로 `main`에 반영했다.\n\n- PR head: `261a8b32f64817adeafaaec5ea31e644922c833c`\n- main merge SHA: `06d6937b55c70b4726340ee698dfd9ed7d089f23`\n- 검증: Python 3.13 및 3.14에서 각각 `370 passed`\n- 현재 장면, 앞뒤 짧은 구간과 선택 관찰창 전체 구간 재검출 구현\n- 임시 detector 설정, 공식/재검출 tracking·candidate·artifact·event·판정 비교 구현\n- 선택 관찰창 및 모든 관찰창 Workbench 적용을 독립적으로 검증하고 한 단계 Undo/Redo 지원\n- 공식 result bundle 불변, 임시 streaming workspace와 안전한 새 profile 저장 유지\n- 실제 Windows DPI, 실영상 temporal 결과, full-range 성능과 file lock 해제는 수동 확인 항목으로 유지\n\n### 목적",
              ),
              (
                  "### Phase 2C-2 — 부분 재검출과 비교\n\n- 현재 frame 다시 검출",
                  "### Phase 2C-2 — 부분 재검출과 비교\n\n**완료**\n\n- 현재 frame 다시 검출",
              ),
              (
                  "현재 `main`에는 Phase 1, Phase 2A 전체, Phase 2B 전체와 Phase 2C-1 Debug Viewer가 완료되어 있다.\n\n다음 구현 순서는 다음과 같다.\n\n1. **Phase 2C-2:** 부분 재검출과 비교\n2. **Phase 2C-3:** 사용자 정답과 회귀 자료\n3. **Phase 2C-4:** 공유용 결과 영상\n4. **Phase 2D:** 반복 시험 운영과 자동 복구 기능 재평가",
                  "현재 `main`에는 Phase 1, Phase 2A 전체, Phase 2B 전체와 Phase 2C-1 Debug Viewer, Phase 2C-2 부분 재검출과 비교가 완료되어 있다.\n\n다음 구현 순서는 다음과 같다.\n\n1. **Phase 2C-3:** 사용자 정답과 회귀 자료\n2. **Phase 2C-4:** 공유용 결과 영상\n3. **Phase 2D:** 반복 시험 운영과 자동 복구 기능 재평가",
              ),
          ]
          for old, new in replacements:
              count = ux.count(old)
              if count != 1:
                  raise SystemExit(f"UX replacement expected once, found {count}: {old[:80]!r}")
              ux = ux.replace(old, new)
          ux_path.write_text(ux, encoding="utf-8")

          plan_path = Path("docs/RESULT_REVIEW_VIEWER_PLAN.md")
          plan = plan_path.read_text(encoding="utf-8")
          replacements = [
              (
                  "### Phase 2C-2 이후\n\n**다음 작업 — Phase 2C-2**\n\n- 부분 재검출과 설정 비교\n- 사용자 수동 정답과 regression fixture\n- annotated MP4 export",
                  "### Phase 2C-2 — 부분 재검출과 설정 비교\n\n**완료**\n\nPR #20 `feat: add partial re-detection comparison`으로 `main`에 반영했다.\n\n- PR head: `261a8b32f64817adeafaaec5ea31e644922c833c`\n- main merge SHA: `06d6937b55c70b4726340ee698dfd9ed7d089f23`\n- 검증: Python 3.13 및 3.14에서 각각 `370 passed`\n- 현재 장면 독립 검출, bounded short-range와 선택 관찰창 full-range 재검출\n- 임시 detector 설정과 공식/재검출 tracking, candidate, artifact, event와 판정 비교\n- current/all Workbench 적용의 범위별 compatibility와 한 단계 Undo/Redo\n- result bundle 불변, streaming temporary workspace와 bundle 외부 새 profile 저장\n\n### Phase 2C-3 이후\n\n**다음 작업 — Phase 2C-3**\n\n- 사용자 수동 정답과 regression fixture\n- annotated MP4 export",
              ),
              (
                  "**진행 중 — Phase 2C-1 완료 / 다음 작업 Phase 2C-2**",
                  "**진행 중 — Phase 2C-1, Phase 2C-2 완료 / 다음 작업 Phase 2C-3**",
              ),
              (
                  "### 9.3 부분 재검출과 설정 비교\n\n문제 frame에서 detector 설정을 임시 조정하고 다음 범위를 다시 검출한다.",
                  "### 9.3 부분 재검출과 설정 비교\n\n**완료**\n\n문제 frame에서 detector 설정을 임시 조정하고 다음 범위를 다시 검출한다.",
              ),
              (
                  "- detector 재실행과 설정 비교는 Phase 2C-2로 분리한다.",
                  "- detector 재실행과 설정 비교는 Phase 2C-2에서 별도 임시 workspace와 비교 workflow로 구현했다.",
              ),
          ]
          for old, new in replacements:
              count = plan.count(old)
              if count != 1:
                  raise SystemExit(f"Plan replacement expected once, found {count}: {old[:80]!r}")
              plan = plan.replace(old, new)
          plan_path.write_text(plan, encoding="utf-8")
      - name: Commit docs and remove temporary workflow
        run: |
          rm .github/workflows/docs-phase2c2-completion.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/UX_IMPROVEMENT_BACKLOG.md docs/RESULT_REVIEW_VIEWER_PLAN.md .github/workflows/docs-phase2c2-completion.yml
          test "$(git diff --cached --name-only | sort)" = $'.github/workflows/docs-phase2c2-completion.yml\ndocs/RESULT_REVIEW_VIEWER_PLAN.md\ndocs/UX_IMPROVEMENT_BACKLOG.md'
          git commit -m "docs: mark Phase 2C-2 complete"
          git push origin HEAD:main
