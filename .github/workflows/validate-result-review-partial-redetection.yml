name: Validate partial re-detection exact head

on:
  pull_request:
    branches: [main]

permissions:
  contents: read
  issues: write
  pull-requests: write

jobs:
  test:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.13", "3.14"]
    env:
      QT_QPA_PLATFORM: offscreen
      EXPECTED_SHA: 6b754d66bf0461dcd98f2d1d9f4a91e878a9ae64
    steps:
      - name: Checkout exact feature head
        uses: actions/checkout@v4
        with:
          ref: 6b754d66bf0461dcd98f2d1d9f4a91e878a9ae64
          fetch-depth: 1
          show-progress: false
      - name: Assert checkout SHA
        shell: bash
        run: |
          set -euo pipefail
          actual="$(git rev-parse HEAD)"
          echo "expected=${EXPECTED_SHA}"
          echo "actual=${actual}"
          test "${actual}" = "${EXPECTED_SHA}"
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install dependencies
        shell: bash
        run: |
          python -m pip install --upgrade pip --quiet >/dev/null
          python -m pip install -e ".[dev]" --quiet >/dev/null
      - name: Report runtime versions
        shell: bash
        run: |
          python - <<'PY'
          import matplotlib
          import PySide6
          import sys
          print("python=" + sys.version.replace("\n", " "))
          print("pyside6=" + PySide6.__version__)
          print("matplotlib=" + matplotlib.__version__)
          PY
      - name: Canonical test suite
        id: tests
        continue-on-error: true
        shell: bash
        run: |
          set +e
          QT_QPA_PLATFORM=offscreen python -m pytest -q > /tmp/pytest.log 2>&1
          status=$?
          echo "status=${status}" >> "${GITHUB_OUTPUT}"
          tail -n 180 /tmp/pytest.log
          exit $status
      - name: Publish failure tail to validation PR
        if: steps.tests.outputs.status != '0'
        uses: actions/github-script@v7
        env:
          PYTHON_VERSION: ${{ matrix.python-version }}
        with:
          script: |
            const fs = require('fs');
            const text = fs.readFileSync('/tmp/pytest.log', 'utf8');
            const lines = text.split(/\r?\n/).slice(-180).join('\n');
            const body = [
              `### Exact-head validation failure · Python ${process.env.PYTHON_VERSION}`,
              '',
              `Feature SHA: \`${process.env.EXPECTED_SHA}\``,
              '',
              '```text',
              lines,
              '```'
            ].join('\n');
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body
            });
      - name: Fail job when tests failed
        if: steps.tests.outputs.status != '0'
        shell: bash
        run: exit 1
