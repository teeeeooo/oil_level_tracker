name: Validate partial re-detection exact head

on:
  pull_request:
    branches: [main]

permissions:
  contents: read
  issues: write
  pull-requests: write

jobs:
  test:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.13", "3.14"]
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - name: Checkout validation branch
        uses: actions/checkout@v4
        with:
          ref: validation/result-review-partial-redetection-2
          fetch-depth: 3
          show-progress: false
      - name: Resolve and assert exact feature SHA
        shell: bash
        run: |
          set -euo pipefail
          feature_sha="$(git rev-parse HEAD~2)"
          echo "FEATURE_SHA=${feature_sha}" >> "${GITHUB_ENV}"
          git checkout --detach "${feature_sha}"
          actual="$(git rev-parse HEAD)"
          echo "feature_sha=${feature_sha}"
          echo "actual=${actual}"
          test "${actual}" = "${feature_sha}"
      - name: Install Qt runtime libraries
        shell: bash
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libegl1 libgl1 libxkbcommon-x11-0 >/dev/null
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install dependencies
        shell: bash
        run: |
          python -m pip install --upgrade pip --quiet >/dev/null
          python -m pip install -e ".[dev]" --quiet >/dev/null
      - name: Report runtime versions
        shell: bash
        run: |
          python - <<'PY'
          import matplotlib
          import PySide6
          import sys
          print("feature_sha=" + __import__('os').environ['FEATURE_SHA'])
          print("python=" + sys.version.replace("\n", " "))
          print("pyside6=" + PySide6.__version__)
          print("matplotlib=" + matplotlib.__version__)
          PY
      - name: Canonical test suite
        id: tests
        continue-on-error: true
        shell: bash
        run: |
          set +e
          QT_QPA_PLATFORM=offscreen python -m pytest -q > /tmp/pytest.log 2>&1
          status=$?
          echo "status=${status}" >> "${GITHUB_OUTPUT}"
          tail -n 180 /tmp/pytest.log
          exit $status
      - name: Publish failure tail to validation PR
        if: steps.tests.outputs.status != '0'
        uses: actions/github-script@v7
        env:
          PYTHON_VERSION: ${{ matrix.python-version }}
        with:
          script: |
            const fs = require('fs');
            const text = fs.readFileSync('/tmp/pytest.log', 'utf8');
            const lines = text.split(/\r?\n/).slice(-180).join('\n');
            const body = [
              `### Exact-head validation failure · Python ${process.env.PYTHON_VERSION}`,
              '',
              `Feature SHA: \`${process.env.FEATURE_SHA}\``,
              '',
              '```text',
              lines,
              '```'
            ].join('\n');
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body
            });
      - name: Fail job when tests failed
        if: steps.tests.outputs.status != '0'
        shell: bash
        run: exit 1
