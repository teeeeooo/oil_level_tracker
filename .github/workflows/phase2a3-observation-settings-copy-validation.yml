name: Phase 2A-3 observation settings copy validation

on:
  pull_request:
    branches: [main]
  push:
    branches: [feature/observation-window-settings-copy]

permissions:
  contents: read
  issues: write
  pull-requests: write

jobs:
  test:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.13", "3.14"]
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: python -m pip install -q --upgrade pip && python -m pip install -q -e ".[dev]"
      - name: Run canonical suite
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PYTHON_VERSION: ${{ matrix.python-version }}
        run: |
          set +e
          QT_QPA_PLATFORM=offscreen python -m pytest -q > pytest.log 2>&1
          status=$?
          cat pytest.log
          if [ "$status" -ne 0 ] && [ -n "$PR_NUMBER" ]; then
            {
              echo "### Temporary validation failure — Python $PYTHON_VERSION"
              echo
              echo '```text'
              tail -n 120 pytest.log
              echo '```'
            } > pytest-comment.md
            gh pr comment "$PR_NUMBER" --body-file pytest-comment.md
          fi
          exit "$status"
