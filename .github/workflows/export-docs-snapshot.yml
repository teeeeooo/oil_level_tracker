name: Record Phase 2C-1 completion

on:
  pull_request:
    paths:
      - '.github/workflows/export-docs-snapshot.yml'

permissions:
  contents: write

jobs:
  update-docs:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout exact merged main
        uses: actions/checkout@v4
        with:
          ref: ed596f3781dc30c27c7e47b0d13b8edf16e17c59
          fetch-depth: 1
      - name: Assert exact main
        run: test "$(git rev-parse HEAD)" = "ed596f3781dc30c27c7e47b0d13b8edf16e17c59"
      - name: Update Phase 2C-1 documentation
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          ux = Path('docs/UX_IMPROVEMENT_BACKLOG.md')
          text = ux.read_text(encoding='utf-8')
          replacements = [
              (
                  '| Phase 2C | 개발용 디버그, 재검출과 공유 확장 | 다음 작업 — 2C-1 |',
                  '| Phase 2C | 개발용 디버그, 재검출과 공유 확장 | 진행 중 — 2C-1 완료 |',
              ),
              (
                  '**다음 작업 — Phase 2C-1**\n\n### 목적',
                  '**진행 중 — Phase 2C-1 완료**\n\n- Phase 2C-1 `Debug Viewer`: 완료\n- 다음 작업: Phase 2C-2 `부분 재검출과 비교`\n\nPhase 2C-1은 PR #13 `feat: add result review debug viewer`로 `main`에 반영했다.\n\n- PR head: `160f51b87e0ea4478a5a8c91b9723092e0502720`\n- main merge SHA: `ed596f3781dc30c27c7e47b0d13b8edf16e17c59`\n- 검증: Python 3.13 및 3.14에서 각각 `301 passed`\n- `none`, `basic`, `full` debug trace, streaming JSONL/PNG 저장과 lazy Debug Viewer 구현\n- 공식 result bundle 내부와 symlink alias로의 재현 패키지 export 차단\n- 실제 Windows DPI, 장시간 영상 성능, production codec과 file lock 해제는 수동 확인 항목으로 유지\n\n### 목적',
              ),
              (
                  '### Phase 2C-1 — Debug Viewer\n\n- 일반/디버그 모드 전환',
                  '### Phase 2C-1 — Debug Viewer\n\n**완료**\n\n- 일반/디버그 모드 전환',
              ),
              (
                  '현재 `main`에는 Phase 1, Phase 2A 전체와 Phase 2B 전체가 완료되어 있다.\n\n다음 구현 순서는 다음과 같다.\n\n1. **Phase 2C-1:** Debug Viewer\n2. **Phase 2C-2:** 부분 재검출과 비교\n3. **Phase 2C-3:** 사용자 정답과 회귀 자료\n4. **Phase 2C-4:** 공유용 결과 영상\n5. **Phase 2D:** 반복 시험 운영과 자동 복구 기능 재평가',
                  '현재 `main`에는 Phase 1, Phase 2A 전체, Phase 2B 전체와 Phase 2C-1 Debug Viewer가 완료되어 있다.\n\n다음 구현 순서는 다음과 같다.\n\n1. **Phase 2C-2:** 부분 재검출과 비교\n2. **Phase 2C-3:** 사용자 정답과 회귀 자료\n3. **Phase 2C-4:** 공유용 결과 영상\n4. **Phase 2D:** 반복 시험 운영과 자동 복구 기능 재평가',
              ),
          ]
          for old, new in replacements:
              if text.count(old) != 1:
                  raise SystemExit(f'UX replacement count mismatch: {old[:80]!r}')
              text = text.replace(old, new, 1)
          ux.write_text(text, encoding='utf-8')

          plan = Path('docs/RESULT_REVIEW_VIEWER_PLAN.md')
          text = plan.read_text(encoding='utf-8')
          replacements = [
              (
                  '### Phase 2C-1 — Debug Viewer\n\n**다음 작업**\n\n- 일반/디버그 모드 전환\n- detector 후보와 score breakdown\n- penalty와 smoothing 전후 정보\n- edge map, mask, gradient와 ROI crop\n- 문제 frame 중심 debug trace\n- 디버그 재현 패키지\n\n### Phase 2C-2 이후\n\n**예정**',
                  '### Phase 2C-1 — Debug Viewer\n\n**완료**\n\nPR #13 `feat: add result review debug viewer`로 `main`에 반영했다.\n\n- PR head: `160f51b87e0ea4478a5a8c91b9723092e0502720`\n- main merge SHA: `ed596f3781dc30c27c7e47b0d13b8edf16e17c59`\n- 검증: Python 3.13 및 3.14에서 각각 `301 passed`\n- `none`, `basic`, `full` debug trace level과 `basic` 신규 session 기본값\n- bounded-memory streaming JSONL/PNG writer와 atomic bundle 포함\n- backward-compatible optional debug pointer와 lazy index/record/image reader\n- 일반/디버그 mode, candidate overlay, score breakdown, state/smoothing와 artifact panel\n- debug scene filter, graph/timeline marker와 독립 재현 패키지\n- 공식 result bundle 내부와 symlink alias destination으로의 export 차단\n\n### Phase 2C-2 이후\n\n**다음 작업 — Phase 2C-2**',
              ),
              (
                  '**다음 작업 — Phase 2C-1**\n\n### 9.1 Debug Viewer',
                  '**진행 중 — Phase 2C-1 완료 / 다음 작업 Phase 2C-2**\n\n### 9.1 Debug Viewer\n\n**완료**',
              ),
              (
                  '#### `basic` — Phase 2C 목표 기본값',
                  '#### `basic` — 신규 session 기본값',
              ),
              (
                  '- debug trace가 구현되기 전 신규 bundle의 `debug_trace_level`은 `none`이다.\n- Phase 2C에서 debug trace를 구현할 때 실제 배포 기본 수준은 `basic`으로 전환하는 것을 목표로 한다.',
                  '- 과거 session에 `debug_trace_level`이 없으면 `none`으로 읽어 기존 bundle 호환성을 유지한다.\n- 신규 Workbench session의 기본 debug trace 수준은 문제 장면 중심의 `basic`이다.\n- 디버그 재현 패키지는 공식 result bundle 내부 또는 symlink alias 하위에 저장할 수 없다.',
              ),
          ]
          for old, new in replacements:
              if text.count(old) != 1:
                  raise SystemExit(f'Plan replacement count mismatch: {old[:80]!r}')
              text = text.replace(old, new, 1)
          plan.write_text(text, encoding='utf-8')
          PY
      - name: Verify docs-only diff
        shell: bash
        run: |
          test "$(git diff --name-only | sort)" = $'docs/RESULT_REVIEW_VIEWER_PLAN.md\ndocs/UX_IMPROVEMENT_BACKLOG.md'
          grep -F 'main merge SHA: `ed596f3781dc30c27c7e47b0d13b8edf16e17c59`' docs/UX_IMPROVEMENT_BACKLOG.md
          grep -F '**다음 작업 — Phase 2C-2**' docs/RESULT_REVIEW_VIEWER_PLAN.md
      - name: Commit docs to main
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/UX_IMPROVEMENT_BACKLOG.md docs/RESULT_REVIEW_VIEWER_PLAN.md
          git commit -m 'docs: record debug viewer completion'
          git push origin HEAD:main
