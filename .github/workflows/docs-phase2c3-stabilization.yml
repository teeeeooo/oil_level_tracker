name: Apply Phase 2C-3 and stabilization docs

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/docs-phase2c3-stabilization.yml

permissions:
  contents: write

jobs:
  update-docs:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 2
      - name: Assert documentation base
        run: |
          test "$(git rev-parse HEAD^)" = "5529596b43c8fbdbad9de5607f8753b1a75977b0"
          test "$(git rev-parse HEAD^^)" = "c9f130f58d51c79b29cf3594a0cbd44b3a570d78"
      - name: Update linked planning documents
        shell: python
        run: |
          from pathlib import Path

          ux_path = Path("docs/UX_IMPROVEMENT_BACKLOG.md")
          ux = ux_path.read_text(encoding="utf-8")
          replacements = [
              (
                  "Result Review Viewer의 화면, 데이터 계약, 일반 검토 모드와 디버그 모드에 대한 상세 설계는 [`RESULT_REVIEW_VIEWER_PLAN.md`](./RESULT_REVIEW_VIEWER_PLAN.md)를 따른다.\n",
                  "Result Review Viewer의 화면, 데이터 계약, 일반 검토 모드와 디버그 모드에 대한 상세 설계는 [`RESULT_REVIEW_VIEWER_PLAN.md`](./RESULT_REVIEW_VIEWER_PLAN.md)를 따른다.\n\n실제 사용에서 확인된 Workbench, graph, 분석 lifecycle과 detector 정확도 문제의 실행 계획은 [`REAL_WORLD_STABILIZATION_PLAN.md`](./REAL_WORLD_STABILIZATION_PLAN.md)를 따른다.\n",
              ),
              (
                  "| Phase 2C | 개발용 디버그, 재검출과 공유 확장 | 진행 중 — 2C-1, 2C-2 완료 |",
                  "| Phase 2C | 개발용 디버그, 재검출과 공유 확장 | 진행 중 — 2C-1, 2C-2, 2C-3 완료 |",
              ),
              (
                  "**진행 중 — Phase 2C-1, Phase 2C-2 완료**\n\n- Phase 2C-1 `Debug Viewer`: 완료\n- Phase 2C-2 `부분 재검출과 비교`: 완료\n- 다음 작업: Phase 2C-3 `사용자 정답과 회귀 자료`",
                  "**진행 중 — Phase 2C-1, Phase 2C-2, Phase 2C-3 완료**\n\n- Phase 2C-1 `Debug Viewer`: 완료\n- Phase 2C-2 `부분 재검출과 비교`: 완료\n- Phase 2C-3 `사용자 정답과 회귀 자료`: 완료\n- 다음 작업: 실사용 안정화 S1 `Detector benchmark foundation`",
              ),
              (
                  "- 실제 Windows DPI, 실영상 temporal 결과, full-range 성능과 file lock 해제는 수동 확인 항목으로 유지\n\n### 목적",
                  "- 실제 Windows DPI, 실영상 temporal 결과, full-range 성능과 file lock 해제는 수동 확인 항목으로 유지\n\nPhase 2C-3은 PR #27 `feat: add user truth annotations and regression fixtures`로 `main`에 반영했다.\n\n- PR head: `7cf152083b72394a90ae1118a94084c32b0c9033`\n- main merge SHA: `c9f130f58d51c79b29cf3594a0cbd44b3a570d78`\n- 검증: Python 3.13 및 3.14에서 각각 `485 passed`\n- 외부 `.oiltruth` 사용자 정답 세트와 confirmed/corrected/unusable workflow 구현\n- 유면·거품 위치, fill state, 오류 유형과 메모를 공식 결과와 분리 저장\n- deterministic regression fixture dataset, manifest, hash, frame identity와 atomic export 구현\n- Truth Annotation UI의 NumPy/OpenCV 직접 의존을 presentation adapter 경계로 이동\n- UI import architecture guard를 추가하고 `result_review_canvas.py`만 temporary allowlist로 유지\n- 실제 compressor 영상, Windows DPI와 exported fixture 호환성은 수동 확인 항목으로 유지\n\nPhase 2C-4 전에 수행할 실사용 안정화 순서와 acceptance criteria는 [`REAL_WORLD_STABILIZATION_PLAN.md`](./REAL_WORLD_STABILIZATION_PLAN.md)에 기록한다.\n\n### 목적",
              ),
              (
                  "### Phase 2C-3 — 사용자 정답과 회귀 자료\n\n- 실제 유면 위치 수동 표시",
                  "### Phase 2C-3 — 사용자 정답과 회귀 자료\n\n**완료**\n\n- 실제 유면 위치 수동 표시",
              ),
              (
                  "### Phase 2C-4 — 공유용 결과 영상\n\n- overlay annotated MP4 export",
                  "### Phase 2C-4 — 공유용 결과 영상\n\n**실사용 안정화 gate 이후 진행**\n\n- overlay annotated MP4 export",
              ),
              (
                  "- 임시 detector 설정으로 부분 재검출하고 원본과 비교할 수 있다.\n",
                  "- 임시 detector 설정으로 부분 재검출하고 원본과 비교할 수 있다.\n- 사용자 정답을 공식 결과와 분리해 저장하고 regression fixture로 내보낼 수 있다.\n",
              ),
              (
                  "현재 `main`에는 Phase 1, Phase 2A 전체, Phase 2B 전체와 Phase 2C-1 Debug Viewer, Phase 2C-2 부분 재검출과 비교가 완료되어 있다.\n\n다음 구현 순서는 다음과 같다.\n\n1. **Phase 2C-3:** 사용자 정답과 회귀 자료\n2. **Phase 2C-4:** 공유용 결과 영상\n3. **Phase 2D:** 반복 시험 운영과 자동 복구 기능 재평가",
                  "현재 `main`에는 Phase 1, Phase 2A 전체, Phase 2B 전체와 Phase 2C-1 Debug Viewer, Phase 2C-2 부분 재검출과 비교, Phase 2C-3 사용자 정답과 회귀 자료가 완료되어 있다.\n\n실제 사용에서 확인된 문제와 상세 acceptance criteria는 [`REAL_WORLD_STABILIZATION_PLAN.md`](./REAL_WORLD_STABILIZATION_PLAN.md)를 따른다.\n\n다음 구현 순서는 다음과 같다.\n\n1. **S1:** Detector benchmark foundation\n2. **S2:** UI raster boundary architecture refactor\n3. **S3:** Workbench usability stabilization\n4. **S4:** Analysis lifecycle 및 결과 시각화 안정화\n5. **S5-A:** Foam과 투명 오일 아지랑이 구분 개선\n6. **S5-B:** 유면 경계 검출과 temporal tracking 개선\n7. **S6:** 실제 영상 validation gate\n8. **S7 / Phase 2C-4:** 공유용 annotated MP4\n9. **Phase 2D:** 반복 시험 운영과 자동 복구 기능 재평가",
              ),
          ]
          for old, new in replacements:
              count = ux.count(old)
              if count != 1:
                  raise SystemExit(f"UX replacement expected once, found {count}: {old[:100]!r}")
              ux = ux.replace(old, new)
          ux_path.write_text(ux, encoding="utf-8")

          plan_path = Path("docs/RESULT_REVIEW_VIEWER_PLAN.md")
          plan = plan_path.read_text(encoding="utf-8")
          replacements = [
              (
                  "전체 UX 우선순위와 Phase 순서는 [`UX_IMPROVEMENT_BACKLOG.md`](./UX_IMPROVEMENT_BACKLOG.md)를 따른다. 이 문서는 그중 **Phase 2B 이후 Result Review Viewer 관련 기능의 상세 설계 문서**다.\n",
                  "전체 UX 우선순위와 Phase 순서는 [`UX_IMPROVEMENT_BACKLOG.md`](./UX_IMPROVEMENT_BACKLOG.md)를 따른다. 이 문서는 그중 **Phase 2B 이후 Result Review Viewer 관련 기능의 상세 설계 문서**다.\n\n실사용 graph, detector benchmark와 Phase 2C-4 선행 gate는 [`REAL_WORLD_STABILIZATION_PLAN.md`](./REAL_WORLD_STABILIZATION_PLAN.md)를 따른다.\n",
              ),
              (
                  "### Phase 2C-3 이후\n\n**다음 작업 — Phase 2C-3**\n\n- 사용자 수동 정답과 regression fixture\n- annotated MP4 export",
                  "### Phase 2C-3 — 사용자 정답과 regression fixture\n\n**완료**\n\nPR #27 `feat: add user truth annotations and regression fixtures`로 `main`에 반영했다.\n\n- PR head: `7cf152083b72394a90ae1118a94084c32b0c9033`\n- main merge SHA: `c9f130f58d51c79b29cf3594a0cbd44b3a570d78`\n- 검증: Python 3.13 및 3.14에서 각각 `485 passed`\n- 외부 `.oiltruth`, bundle identity validation과 atomic 저장\n- 사용자 유면·거품 위치, fill state, 오류 유형과 공식/truth 비교\n- annotation 탐색, graph/timeline marker와 dirty lifecycle\n- deterministic regression fixture dataset과 비동기 export\n- official result bundle 불변과 path safety\n\n### 실사용 안정화 이후\n\n**다음 작업 — S1 Detector benchmark foundation**\n\n- Phase 2C-3 fixture를 읽는 benchmark runner와 current detector baseline\n- UI raster boundary, Workbench UX와 graph 안정화\n- Foam/아지랑이 및 유면 tracking 개선\n- 실제 영상 validation gate 후 annotated MP4 export",
              ),
              (
                  "**진행 중 — Phase 2C-1, Phase 2C-2 완료 / 다음 작업 Phase 2C-3**",
                  "**진행 중 — Phase 2C-1, Phase 2C-2, Phase 2C-3 완료 / 다음 작업 S1 Detector benchmark foundation**",
              ),
              (
                  "### 9.4 사용자 정답과 regression 자료\n\n사용자가 잘못 검출된 frame에서 실제 유면 위치와 오류 유형을 지정한다.",
                  "### 9.4 사용자 정답과 regression 자료\n\n**완료**\n\n사용자가 잘못 검출된 frame에서 실제 유면 위치와 오류 유형을 지정한다.",
              ),
              (
                  "공식 분석 결과와 사용자 수정값은 명확히 분리한다.\n",
                  "공식 분석 결과와 사용자 수정값은 명확히 분리한다.\n\n구현 결과:\n\n- 외부 `.oiltruth` annotation set\n- confirmed/corrected/unusable disposition\n- canonical source-frame 유면·거품 좌표\n- annotation 수정·삭제·filter와 graph/timeline marker\n- 공식/truth pure comparison\n- current/selected/all regression fixture export\n- official result bundle 불변\n",
              ),
              (
                  "### 9.6 공유용 결과 영상\n\n- overlay annotated MP4 export",
                  "### 9.6 공유용 결과 영상\n\n**실사용 안정화 gate 이후 진행**\n\n- overlay annotated MP4 export",
              ),
              (
                  "- 디버그 정보 포함 여부 선택\n\n## 10. 아키텍처 방향",
                  "- 디버그 정보 포함 여부 선택\n\n상세 선행 조건은 [`REAL_WORLD_STABILIZATION_PLAN.md`](./REAL_WORLD_STABILIZATION_PLAN.md)의 S1~S6을 따른다.\n\n### 9.7 실사용 결과 시각화 안정화\n\nPhase 2C-4 전에 다음을 완료한다.\n\n- Matplotlib 한글 font resolver\n- 사용자-facing `oil-air`를 `유면` 또는 `유면 경계`로 변경\n- graph y축을 검출값 autoscale이 아니라 Glass 전체 분석 영역으로 고정\n- 기준선 0과 분석 영역 위·아래 경계 표시\n- Result Review와 HTML report의 동일 graph 범위 정책\n\n## 10. 아키텍처 방향",
              ),
              (
                  "분석 pipeline이 Qt widget, 색상 또는 화면 배치 정보를 직접 생성하지 않도록 한다.\n",
                  "분석 pipeline이 Qt widget, 색상 또는 화면 배치 정보를 직접 생성하지 않도록 한다.\n\nDecoded frame과 debug artifact는 presentation adapter에서 detached `QImage`로 변환한 뒤 UI에 전달한다. `result_review_canvas.py`의 temporary NumPy/OpenCV allowlist는 별도 S2 architecture refactor에서 제거한다.\n",
              ),
          ]
          for old, new in replacements:
              count = plan.count(old)
              if count != 1:
                  raise SystemExit(f"Plan replacement expected once, found {count}: {old[:100]!r}")
              plan = plan.replace(old, new)
          plan_path.write_text(plan, encoding="utf-8")
      - name: Commit docs and remove temporary workflow
        run: |
          rm .github/workflows/docs-phase2c3-stabilization.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/UX_IMPROVEMENT_BACKLOG.md docs/RESULT_REVIEW_VIEWER_PLAN.md .github/workflows/docs-phase2c3-stabilization.yml
          test "$(git diff --cached --name-only | sort)" = $'.github/workflows/docs-phase2c3-stabilization.yml\ndocs/RESULT_REVIEW_VIEWER_PLAN.md\ndocs/UX_IMPROVEMENT_BACKLOG.md'
          git commit -m "docs: record Phase 2C-3 and stabilization roadmap"
          git push origin HEAD:main
