name: S5-A development validation 4

on:
  pull_request:
    branches: [main]

permissions:
  contents: read
  pull-requests: write

env:
  QT_QPA_PLATFORM: offscreen
  EXPECTED_SHA: 8248f3eff5bc8304acd2dcb8bbbd1c0f98b667b7

jobs:
  diagnostics:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.EXPECTED_SHA }}
      - name: Assert exact feature checkout
        run: |
          actual=$(git rev-parse HEAD)
          echo "expected=$EXPECTED_SHA actual=$actual"
          test "$actual" = "$EXPECTED_SHA"
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
      - name: Install
        run: python -m pip install -e '.[dev]'
      - name: Run and publish bounded diagnostics
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set +e
          python -m pytest -q \
            tests/test_foam_controlled_benchmark.py \
            tests/test_foam_evidence.py \
            tests/test_foam_temporal_gate.py \
            tests/test_foam_fill_state_policy.py \
            tests/test_foam_settings.py \
            tests/test_detector_benchmark_metrics.py \
            tests/test_detector_benchmark_runner.py \
            tests/test_detector_benchmark_integration.py \
            tests/test_benchmark_cli.py > /tmp/pytest.log 2>&1
          code=$?
          {
            echo '### S5-A bounded pytest diagnostic'
            echo
            echo '```text'
            tail -n 180 /tmp/pytest.log
            echo '```'
            echo
            echo "exit_code=$code"
          } > /tmp/comment.md
          gh pr comment "$PR_NUMBER" --body-file /tmp/comment.md
          exit "$code"
