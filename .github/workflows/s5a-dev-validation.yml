name: S5-A development validation 4

on:
  pull_request:
    branches: [main]

permissions:
  contents: read
  pull-requests: write

env:
  QT_QPA_PLATFORM: offscreen
  EXPECTED_SHA: 2eecc6f3292d1ccf8085b288529034066a8fed46

jobs:
  full-regression-diagnostics:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.EXPECTED_SHA }}
      - name: Assert exact feature checkout
        run: |
          actual=$(git rev-parse HEAD)
          echo "expected=$EXPECTED_SHA actual=$actual"
          test "$actual" = "$EXPECTED_SHA"
      - name: Install Qt runtime libraries
        run: sudo apt-get update && sudo apt-get install -y libegl1 libgl1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
      - name: Install
        run: python -m pip install -e '.[dev]'
      - name: Print runtime identity
        run: |
          python - <<'PY'
          import sys, cv2, numpy, PySide6, matplotlib
          from oil_tracker.adapters.vision.opencv_phase_detector import OpenCvPhaseDetector
          print('Python', sys.version)
          print('PySide6', PySide6.__version__)
          print('NumPy', numpy.__version__)
          print('OpenCV', cv2.__version__)
          print('Matplotlib', matplotlib.__version__)
          print('detector', OpenCvPhaseDetector.version)
          PY
      - name: Run canonical suite and publish bounded diagnostic
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set +e
          python -m pytest -q > /tmp/pytest.log 2>&1
          code=$?
          {
            echo '### S5-A full regression diagnostic · Python 3.13'
            echo
            echo '```text'
            tail -n 320 /tmp/pytest.log
            echo '```'
            echo
            echo "exit_code=$code"
          } > /tmp/comment.md
          gh pr comment "$PR_NUMBER" --body-file /tmp/comment.md
          exit "$code"
