name: Phase 2C-3 canonical validation

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  pytest:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.13', '3.14']
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 9161f8a042dad701e2c88d49705f56f822700579
      - name: Assert exact feature SHA
        run: test "$(git rev-parse HEAD)" = "9161f8a042dad701e2c88d49705f56f822700579"
      - name: Install Qt runtime libraries
        run: sudo apt-get update -qq >/tmp/apt-update.log && sudo apt-get install -y -qq libegl1 libgl1 libxkbcommon-x11-0 libxcb-cursor0 >/tmp/apt-install.log
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install project and test dependencies
        run: |
          python -m pip install --upgrade pip -q >/tmp/pip-upgrade.log
          python -m pip install -e '.[dev]' -q >/tmp/pip-install.log
      - name: Report exact runtime and run canonical suite
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          set +e
          python --version
          python - <<'PY'
          import matplotlib
          import PySide6
          print('PySide6', PySide6.__version__)
          print('Matplotlib', matplotlib.__version__)
          PY
          echo 'EXACT_FEATURE_SHA=9161f8a042dad701e2c88d49705f56f822700579'
          echo 'COMMAND=QT_QPA_PLATFORM=offscreen python -m pytest -q'
          QT_QPA_PLATFORM=offscreen python -m pytest -q > /tmp/pytest-result.txt 2>&1
          status=$?
          cat /tmp/pytest-result.txt
          echo "EXIT_STATUS=$status"
          exit "$status"
