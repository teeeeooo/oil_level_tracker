name: Phase 2C-3 canonical validation

on:
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/phase2c3-canonical.yml

permissions:
  contents: write

jobs:
  pytest:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Checkout validation branch
        uses: actions/checkout@v4
        with:
          ref: validation/phase2c3-canonical-1
      - name: Checkout exact feature SHA
        uses: actions/checkout@v4
        with:
          ref: 9161f8a042dad701e2c88d49705f56f822700579
          path: source
      - name: Assert exact feature SHA
        run: test "$(git -C source rev-parse HEAD)" = "9161f8a042dad701e2c88d49705f56f822700579"
      - name: Install Qt runtime libraries
        run: sudo apt-get update -qq >/tmp/apt-update.log && sudo apt-get install -y -qq libegl1 libgl1 libxkbcommon-x11-0 libxcb-cursor0 >/tmp/apt-install.log
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Run Python 3.13 canonical suite
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          python -m pip install --upgrade pip -q >/tmp/pip-313-upgrade.log
          python -m pip install -e 'source[dev]' -q >/tmp/pip-313-install.log
          set +e
          {
            python --version
            python - <<'PY'
          import matplotlib
          import PySide6
          print('PySide6', PySide6.__version__)
          print('Matplotlib', matplotlib.__version__)
          PY
            echo 'EXACT_FEATURE_SHA=9161f8a042dad701e2c88d49705f56f822700579'
            echo 'COMMAND=QT_QPA_PLATFORM=offscreen python -m pytest -q'
            cd source
            QT_QPA_PLATFORM=offscreen python -m pytest -q
          } > python-3.13-result.txt 2>&1
          status=$?
          cd ..
          mv source/python-3.13-result.txt python-3.13-result.txt
          printf '\nEXIT_STATUS=%s\n' "$status" >> python-3.13-result.txt
          echo "$status" > python-3.13-status.txt
          cat python-3.13-result.txt
          exit 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - name: Run Python 3.14 canonical suite
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          python -m pip install --upgrade pip -q >/tmp/pip-314-upgrade.log
          python -m pip install -e 'source[dev]' -q >/tmp/pip-314-install.log
          set +e
          {
            python --version
            python - <<'PY'
          import matplotlib
          import PySide6
          print('PySide6', PySide6.__version__)
          print('Matplotlib', matplotlib.__version__)
          PY
            echo 'EXACT_FEATURE_SHA=9161f8a042dad701e2c88d49705f56f822700579'
            echo 'COMMAND=QT_QPA_PLATFORM=offscreen python -m pytest -q'
            cd source
            QT_QPA_PLATFORM=offscreen python -m pytest -q
          } > python-3.14-result.txt 2>&1
          status=$?
          cd ..
          mv source/python-3.14-result.txt python-3.14-result.txt
          printf '\nEXIT_STATUS=%s\n' "$status" >> python-3.14-result.txt
          echo "$status" > python-3.14-status.txt
          cat python-3.14-result.txt
          exit 0
      - name: Persist concise validation results
        run: |
          rm -rf source
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add python-3.13-result.txt python-3.13-status.txt python-3.14-result.txt python-3.14-status.txt
          git commit -m "ci: record Phase 2C-3 canonical results" || true
          git push origin HEAD:validation/phase2c3-canonical-1
      - name: Require both canonical suites to pass
        run: |
          test "$(cat python-3.13-status.txt)" = "0"
          test "$(cat python-3.14-status.txt)" = "0"
