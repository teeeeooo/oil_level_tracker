name: Validate result review debug destination safety

on:
  pull_request:
    types: [opened, reopened, synchronize]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.13", "3.14"]
    env:
      QT_QPA_PLATFORM: offscreen
      TARGET_SHA: 160f51b87e0ea4478a5a8c91b9723092e0502720
    steps:
      - name: Checkout exact feature head
        uses: actions/checkout@v4
        with:
          ref: ${{ env.TARGET_SHA }}
          fetch-depth: 1

      - name: Assert exact checkout
        shell: bash
        run: |
          actual="$(git rev-parse HEAD)"
          echo "expected=${TARGET_SHA}"
          echo "actual=${actual}"
          test "${actual}" = "${TARGET_SHA}"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install Qt runtime libraries
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libegl1 \
            libgl1 \
            libxkbcommon-x11-0 \
            libxcb-cursor0 \
            libxcb-icccm4 \
            libxcb-image0 \
            libxcb-keysyms1 \
            libxcb-render-util0

      - name: Install project
        shell: bash
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Record versions
        shell: bash
        run: |
          python - <<'PY' | tee "validation-environment-${{ matrix.python-version }}.txt"
          import platform
          import sys
          import matplotlib
          import PySide6

          print(f"OS={platform.platform()}")
          print(f"Python={sys.version.split()[0]}")
          print(f"PySide6={PySide6.__version__}")
          print(f"Matplotlib={matplotlib.__version__}")
          PY
          echo "Exact feature SHA=${TARGET_SHA}" | tee -a "validation-environment-${{ matrix.python-version }}.txt"

      - name: Run canonical suite
        shell: bash
        run: |
          set -o pipefail
          QT_QPA_PLATFORM=offscreen python -m pytest -q 2>&1 | tee "pytest-${{ matrix.python-version }}.log"

      - name: Upload validation summary
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: result-review-debug-destination-${{ matrix.python-version }}
          path: |
            validation-environment-${{ matrix.python-version }}.txt
            pytest-${{ matrix.python-version }}.log
          if-no-files-found: warn
          retention-days: 7
