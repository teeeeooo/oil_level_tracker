name: S4 canonical validation

on:
  pull_request:
    branches: [main]

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: s4-canonical-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  canonical:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.13', '3.14']
    env:
      EXPECTED_SHA: 20dbe42d1d1624d2f3d8f252d44d7bd7eb97ffc0
      QT_QPA_PLATFORM: offscreen
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout exact feature SHA
        uses: actions/checkout@v4
        with:
          ref: ${{ env.EXPECTED_SHA }}
          fetch-depth: 1
      - name: Assert exact checkout
        run: |
          echo "expected exact SHA=$EXPECTED_SHA"
          echo "actual SHA=$(git rev-parse HEAD)"
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
      - name: Install runner dependencies
        run: |
          timeout 180s sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=30 update -qq
          timeout 180s sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq fonts-noto-cjk libegl1 libgl1 libxkbcommon-x11-0
          fc-cache -f
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install package
        run: |
          python -m pip install --upgrade pip -q
          python -m pip install -e '.[dev]' -q
      - name: Record environment and font
        run: |
          python - <<'PY' | tee /tmp/env.txt
          import matplotlib, numpy, cv2, PySide6, sys
          from oil_tracker.visualization.matplotlib_font import resolve_matplotlib_font
          selected = resolve_matplotlib_font()
          print('Python=' + sys.version.split()[0])
          print('PySide6=' + PySide6.__version__)
          print('NumPy=' + numpy.__version__)
          print('OpenCV=' + cv2.__version__)
          print('Matplotlib=' + matplotlib.__version__)
          print('selected_font=' + selected.family)
          print('font_source=' + selected.source)
          print('font_supports_Hangul=' + str(selected.supports_hangul))
          PY
      - name: Run canonical suite
        id: pytest
        continue-on-error: true
        run: |
          set -o pipefail
          python -m pytest -q 2>&1 | tee /tmp/pytest.txt
      - name: Publish bounded canonical evidence
        if: always() && steps.pytest.outcome != 'skipped'
        run: |
          glyph_count=$(grep -Ec 'Glyph .* missing from font' /tmp/pytest.txt || true)
          {
            echo "### S4 canonical Python ${{ matrix.python-version }} exact-head evidence"
            echo
            echo "- run_id: $GITHUB_RUN_ID"
            echo "- expected_sha: $EXPECTED_SHA"
            echo "- actual_sha: $(git rev-parse HEAD)"
            echo "- pytest_outcome: ${{ steps.pytest.outcome }}"
            echo "- missing_hangul_glyph_warnings: $glyph_count"
            echo
            echo '```text'
            cat /tmp/env.txt
            tail -n 80 /tmp/pytest.txt
            echo '```'
          } > /tmp/comment.md
          gh pr comment "${{ github.event.pull_request.number }}" --body-file /tmp/comment.md
      - name: Fail when canonical tests fail
        if: steps.pytest.outcome == 'failure'
        run: exit 1
