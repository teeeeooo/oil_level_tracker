name: S5-B focused probe

on:
  pull_request:
    branches: [main]

permissions:
  contents: read
  pull-requests: write

jobs:
  oil-core:
    name: oil-core-${{ matrix.name }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: consensus
            file: tests/test_oil_candidate_consensus.py
          - name: scoring
            file: tests/test_oil_signed_scoring.py
          - name: no-interface
            file: tests/test_oil_no_interface.py
          - name: path
            file: tests/test_oil_temporal_path.py
          - name: smoothing
            file: tests/test_oil_temporal_tracker.py
          - name: detector
            file: tests/test_oil_detector_integration.py
          - name: fill-state
            file: tests/test_oil_fill_state_classifier.py
          - name: settings
            file: tests/test_oil_settings.py
    env:
      QT_QPA_PLATFORM: offscreen
      EXPECTED_SHA: 2a58795a470f8d9284648d60c3a5d49e9fd31cb2
      TEST_FILE: ${{ matrix.file }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.EXPECTED_SHA }}
      - name: Assert exact feature head
        run: |
          actual="$(git rev-parse HEAD)"
          echo "expected_exact_sha=${EXPECTED_SHA}"
          echo "actual_checkout_sha=${actual}"
          test "${actual}" = "${EXPECTED_SHA}"
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install runtime and package
        run: |
          sudo apt-get update -qq >/dev/null
          sudo apt-get install -y -qq libegl1 libgl1 libxkbcommon-x11-0 libxcb-cursor0 libxcb-xinerama0 libxcb-keysyms1 libxcb-render-util0 >/dev/null
          python -m pip install -q -e '.[dev]'
      - name: Run isolated oil core file
        shell: bash
        run: |
          set +e
          python -m pytest -q --tb=short ${TEST_FILE} > /tmp/pytest.log 2>&1
          status=$?
          cat /tmp/pytest.log
          if [ "${status}" -ne 0 ]; then
            {
              echo "## Temporary S5-B oil-core diagnostic: ${{ matrix.name }}"
              echo
              echo "Exact feature SHA: \`${EXPECTED_SHA}\`"
              echo
              echo '```text'
              cat /tmp/pytest.log
              echo '```'
            } > /tmp/body.md
            gh pr edit 55 --body-file /tmp/body.md || true
          fi
          exit ${status}
