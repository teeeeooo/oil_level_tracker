name: S5-B focused failure extraction

on:
  pull_request:
    branches: [main]

concurrency:
  group: s5b-validation-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  actions: read
  pull-requests: write
  contents: read

jobs:
  extract:
    runs-on: ubuntu-24.04
    env:
      GH_TOKEN: ${{ github.token }}
      FAILED_RUN_ID: '29855794866'
      FAILED_JOB_ID: '88719653310'
    steps:
      - name: Extract focused failure tail
        run: |
          gh run view "${FAILED_RUN_ID}" --repo "${GITHUB_REPOSITORY}" --job "${FAILED_JOB_ID}" --log > /tmp/job.log
          {
            echo '## S5-B polarity-consensus focused failure'
            echo
            echo 'Stored log only; tests were not rerun.'
            echo
            echo '```text'
            grep -n -E 'FAILED|FAILURES|AssertionError|assert |ERROR|Traceback|short test summary|passed|failed' /tmp/job.log | tail -n 140
            echo
            tail -n 100 /tmp/job.log
            echo '```'
          } > /tmp/body.md
          gh pr edit 55 --repo "${GITHUB_REPOSITORY}" --body-file /tmp/body.md
