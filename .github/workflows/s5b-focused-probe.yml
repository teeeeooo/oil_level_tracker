name: S5-B oil metric traceback

on:
  pull_request:
    branches: [main]

concurrency:
  group: s5b-validation-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  actions: read
  pull-requests: write
  contents: read

jobs:
  extract:
    runs-on: ubuntu-24.04
    env:
      GH_TOKEN: ${{ github.token }}
      FAILED_RUN_ID: '29852027251'
      FAILED_JOB_ID: '88707021465'
    steps:
      - name: Extract stored traceback
        run: |
          gh run view "${FAILED_RUN_ID}" --repo "${GITHUB_REPOSITORY}" --job "${FAILED_JOB_ID}" --log > /tmp/job.log
          {
            echo '## S5-B oil metric diagnostic traceback'
            echo
            echo '```text'
            tail -n 70 /tmp/job.log
            echo '```'
          } > /tmp/body.md
          gh pr edit 55 --repo "${GITHUB_REPOSITORY}" --body-file /tmp/body.md
