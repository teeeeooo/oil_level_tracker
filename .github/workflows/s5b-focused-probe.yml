name: S5-B clear diagnosis extraction

on:
  pull_request:
    branches: [main]

concurrency:
  group: s5b-validation-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  actions: read
  pull-requests: write
  contents: read

jobs:
  extract:
    runs-on: ubuntu-24.04
    env:
      GH_TOKEN: ${{ github.token }}
      SOURCE_RUN_ID: '29855992543'
      SOURCE_JOB_ID: '88720322806'
    steps:
      - name: Extract clear scene JSON from stored log
        run: |
          gh run view "${SOURCE_RUN_ID}" --repo "${GITHUB_REPOSITORY}" --job "${SOURCE_JOB_ID}" --log > /tmp/job.log
          python - <<'PY'
          import re
          from pathlib import Path
          lines = Path('/tmp/job.log').read_text(encoding='utf-8', errors='replace').splitlines()
          extracted = []
          for line in lines:
              if any(key in line for key in ("'scene':", '"scene"', "'truth_y':", '"truth_y"', "'raw_y':", '"raw_y"', "'decision':", '"decision"', "'correction':", '"correction"', "'signed_region':", '"signed_region"', "'support':", '"support"')) and '^[[36;1m' not in line:
                  extracted.append(re.sub(r'^.*?Z\s+', '', line))
          body = [
              '## S5-B clear-boundary stored diagnosis', '',
              'Stored log only; detector tests were not rerun.', '',
              '```text', *extracted[-260:], '```',
          ]
          Path('/tmp/body.md').write_text('\n'.join(body), encoding='utf-8')
          PY
          cat /tmp/body.md
          gh pr edit 55 --repo "${GITHUB_REPOSITORY}" --body-file /tmp/body.md
