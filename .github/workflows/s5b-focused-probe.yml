name: S5-B candidate coordinate diagnosis

on:
  pull_request:
    branches: [main]

concurrency:
  group: s5b-validation-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write

jobs:
  diagnose:
    runs-on: ubuntu-24.04
    env:
      QT_QPA_PLATFORM: offscreen
      FEATURE_SHA: 387fdd9d9849853186b6b1f3df709127630a3046
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.FEATURE_SHA }}
      - name: Assert exact feature checkout
        run: test "$(git rev-parse HEAD)" = "${FEATURE_SHA}"
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install package
        run: |
          sudo apt-get update -qq >/dev/null
          sudo apt-get install -y -qq libegl1 libgl1 libxkbcommon-x11-0 libxcb-cursor0 >/dev/null
          python -m pip install -q -e '.[dev]'
      - name: Print candidate coordinates for representative high-error scenes
        run: |
          PYTHONPATH=tests python - <<'PY' > /tmp/candidates.txt
          import json
          from oil_benchmark_fixtures import controlled_oil_scenes
          from oil_tracker.adapters.vision.opencv_phase_detector import OpenCvPhaseDetector
          from oil_tracker.domain.recipe import InspectionRecipe

          selected_ids = {
              'opposite-polarity',
              'weak-valid',
              'glare-plus-real',
              'polarity-change-2',
              'polarity-change-3',
          }
          scenes = [scene for scene in controlled_oil_scenes() if scene.case_id in selected_ids]
          rows = []
          for scene in scenes:
              detector = OpenCvPhaseDetector()
              glass = InspectionRecipe.default_glass(320, 240)
              glass.id = 'diagnostic-' + scene.case_id
              detection, _ = detector.detect(scene.frame, glass, 0, scene.timestamp, debug=True)
              candidates = []
              for candidate in detection.candidates:
                  if candidate.kind.value != 'OIL_AIR':
                      continue
                  candidates.append({
                      'source': candidate.source,
                      'y': candidate.y,
                      'local_y': candidate.features.get('local_y'),
                      'source_y': candidate.features.get('source_y'),
                      'raw_generator_y': candidate.features.get('raw_generator_y'),
                      'representative_local_y': candidate.features.get('representative_local_y'),
                      'unrounded_representative_local_y': candidate.features.get('unrounded_representative_local_y'),
                      'consensus_representative_local_y': candidate.features.get('consensus_representative_local_y'),
                      'paired_boundary_original_y': candidate.features.get('paired_boundary_original_y'),
                      'paired_boundary_unrounded_midpoint': candidate.features.get('paired_boundary_unrounded_midpoint'),
                      'paired_boundary_merged_y': candidate.features.get('paired_boundary_merged_y'),
                      'polarity_sign': candidate.features.get('polarity_sign'),
                      'persistent_polarity_sign': candidate.features.get('persistent_polarity_sign'),
                      'observation_score': candidate.features.get('observation_score'),
                      'support': candidate.features.get('unique_generator_support_count'),
                      'selected': candidate.selected,
                      'rejected': candidate.rejected,
                      'reject_reason': candidate.reject_reason,
                  })
              candidates.sort(key=lambda item: (not item['selected'], item['rejected'], -float(item['observation_score'] or 0.0), float(item['y'])))
              rows.append({
                  'scene': scene.case_id,
                  'truth_y': scene.oil_y,
                  'raw_y': detection.raw_oil_air_level_y,
                  'smoothed_y': detection.smoothed_oil_air_level_y,
                  'decision': detection.debug_metrics.get('oil_decision_status'),
                  'candidates': candidates[:12],
              })
          print(json.dumps(rows, sort_keys=True, indent=2))
          PY
          cat /tmp/candidates.txt
          {
            echo '## S5-B candidate-coordinate diagnosis'
            echo
            echo 'Feature-only representative scenes; no base, Foam, CPU, or canonical rerun.'
            echo
            echo '```json'
            cat /tmp/candidates.txt
            echo '```'
          } > /tmp/body.md
          gh pr edit 55 --repo "${GITHUB_REPOSITORY}" --body-file /tmp/body.md
