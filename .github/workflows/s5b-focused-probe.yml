name: S5-B focused probe

on:
  pull_request:
    branches: [main]

permissions:
  contents: read
  pull-requests: write

jobs:
  focused:
    name: focused-${{ matrix.group }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - group: core
            files: >-
              tests/test_oil_candidate_consensus.py
              tests/test_oil_signed_scoring.py
              tests/test_oil_no_interface.py
              tests/test_oil_temporal_path.py
              tests/test_oil_temporal_tracker.py
              tests/test_oil_detector_integration.py
              tests/test_oil_fill_state_classifier.py
              tests/test_oil_settings.py
          - group: controlled-oil
            files: tests/test_oil_controlled_benchmark.py
    env:
      QT_QPA_PLATFORM: offscreen
      EXPECTED_SHA: fff9144b588e682090eb5b76719c5fd2261a30bf
      TEST_FILES: ${{ matrix.files }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.EXPECTED_SHA }}
      - name: Assert exact feature head
        run: |
          actual="$(git rev-parse HEAD)"
          echo "expected_exact_sha=${EXPECTED_SHA}"
          echo "actual_checkout_sha=${actual}"
          test "${actual}" = "${EXPECTED_SHA}"
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install runtime and package
        run: |
          sudo apt-get update -qq >/dev/null
          sudo apt-get install -y -qq libegl1 libgl1 libxkbcommon-x11-0 libxcb-cursor0 libxcb-xinerama0 libxcb-keysyms1 libxcb-render-util0 >/dev/null
          python -m pip install -q -e '.[dev]'
      - name: Run focused group
        shell: bash
        run: |
          set +e
          python -m pytest -q --tb=short ${TEST_FILES} > /tmp/pytest.log 2>&1
          status=$?
          cat /tmp/pytest.log
          if [ "${status}" -ne 0 ]; then
            {
              echo "## Temporary S5-B diagnostic: ${{ matrix.group }}"
              echo
              echo "Exact feature SHA: \`${EXPECTED_SHA}\`"
              echo
              echo '```text'
              tail -n 300 /tmp/pytest.log
              echo '```'
            } > /tmp/body.md
            gh pr edit 55 --body-file /tmp/body.md || true
          fi
          exit ${status}
