name: S5-B focused probe

on:
  pull_request:
    branches: [main]

permissions:
  contents: read
  pull-requests: write
  issues: write

jobs:
  controlled:
    name: controlled-${{ matrix.group }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - group: oil
            files: tests/test_oil_controlled_benchmark.py
            comment_id: '5035885005'
          - group: foam
            files: >-
              tests/test_foam_front_detector.py
              tests/test_foam_temporal_gate.py
              tests/test_foam_detector_integration.py
              tests/test_foam_settings.py
              tests/test_foam_benchmark_fixtures.py
              tests/test_foam_controlled_benchmark.py
            comment_id: '5035885331'
    env:
      QT_QPA_PLATFORM: offscreen
      EXPECTED_SHA: 2add649e95691aced37aeff4fa0d1b114f7769a8
      TEST_FILES: ${{ matrix.files }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.EXPECTED_SHA }}
      - name: Assert exact feature head
        run: |
          actual="$(git rev-parse HEAD)"
          echo "expected_exact_sha=${EXPECTED_SHA}"
          echo "actual_checkout_sha=${actual}"
          test "${actual}" = "${EXPECTED_SHA}"
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install runtime and package
        run: |
          sudo apt-get update -qq >/dev/null
          sudo apt-get install -y -qq libegl1 libgl1 libxkbcommon-x11-0 libxcb-cursor0 libxcb-xinerama0 libxcb-keysyms1 libxcb-render-util0 >/dev/null
          python -m pip install -q -e '.[dev]'
      - name: Run controlled group
        shell: bash
        run: |
          set +e
          python -m pytest -q --tb=short ${TEST_FILES} > /tmp/pytest.log 2>&1
          status=$?
          cat /tmp/pytest.log
          {
            echo "### S5-B controlled diagnostic: ${{ matrix.group }}"
            echo
            echo "Exact feature SHA: \`${EXPECTED_SHA}\`"
            echo
            echo '```text'
            tail -n 240 /tmp/pytest.log
            echo '```'
          } > /tmp/comment.md
          gh api repos/teeeeooo/oil_level_tracker/issues/comments/${{ matrix.comment_id }} \
            --method PATCH -F body=@/tmp/comment.md
          exit ${status}
