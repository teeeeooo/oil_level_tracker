name: S5-B validation log diagnosis

on:
  pull_request:
    branches: [main]

concurrency:
  group: s5b-validation-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  actions: read
  pull-requests: write
  contents: read

jobs:
  extract-prior-failure:
    runs-on: ubuntu-24.04
    env:
      GH_TOKEN: ${{ github.token }}
      FAILED_RUN_ID: '29850719873'
      FAILED_JOB_ID: '88702810606'
    steps:
      - name: Extract bounded failed-step log
        shell: bash
        run: |
          set -o pipefail
          gh run view "${FAILED_RUN_ID}" --repo "${GITHUB_REPOSITORY}" --job "${FAILED_JOB_ID}" --log > /tmp/job.log
          {
            echo '## S5-B controlled base-step failure diagnosis'
            echo
            echo 'This job only extracts the stored log from the prior failed run; it does not execute feature tests.'
            echo
            echo '```text'
            grep -n -E 'Run base exact SHA|Traceback|Error|ERROR|Exception|ValueError|TypeError|KeyError|AssertionError|expected_base_sha|actual_base_checkout_sha|Unsupported|mismatch|failed|No such file|ImportError|ModuleNotFoundError' /tmp/job.log | tail -n 160
            echo
            tail -n 120 /tmp/job.log
            echo '```'
          } > /tmp/body.md
          gh pr edit 55 --repo "${GITHUB_REPOSITORY}" --body-file /tmp/body.md
