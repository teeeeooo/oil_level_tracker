name: S5-B final comparison diagnosis

on:
  pull_request:
    branches: [main]

concurrency:
  group: s5b-validation-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  actions: read
  pull-requests: write
  contents: read

jobs:
  extract:
    runs-on: ubuntu-24.04
    env:
      GH_TOKEN: ${{ github.token }}
      FAILED_RUN_ID: '29852941657'
      FAILED_JOB_ID: '88710364196'
    steps:
      - name: Extract stored controlled summary and traceback
        run: |
          gh run view "${FAILED_RUN_ID}" --repo "${GITHUB_REPOSITORY}" --job "${FAILED_JOB_ID}" --log > /tmp/job.log
          python - <<'PY'
          from pathlib import Path
          text = Path('/tmp/job.log').read_text(encoding='utf-8', errors='replace')
          start = text.find('{\n')
          candidates = []
          while start >= 0:
              end = text.find('\n}', start)
              if end < 0:
                  break
              block = text[start:end + 2]
              if '"base_errors"' in block and '"cpu_ratio"' in block:
                  candidates.append(block)
              start = text.find('{\n', start + 2)
          traceback = text[text.rfind('Traceback (most recent call last):'):]
          body = [
              '## S5-B final controlled comparison diagnosis',
              '',
              'This run only reads the stored final validation log; it does not execute detector tests.',
              '',
              '```json',
              candidates[-1] if candidates else 'controlled summary not found',
              '```',
              '',
              '```text',
              '\n'.join(traceback.splitlines()[:12]),
              '```',
          ]
          Path('/tmp/body.md').write_text('\n'.join(body), encoding='utf-8')
          PY
          cat /tmp/body.md
          gh pr edit 55 --repo "${GITHUB_REPOSITORY}" --body-file /tmp/body.md
