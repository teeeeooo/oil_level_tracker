name: S5-B paired-boundary midpoint patch

on:
  pull_request:
    branches: [main]

concurrency:
  group: s5b-validation-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  patch-feature:
    runs-on: ubuntu-24.04
    env:
      FEATURE_BRANCH: feature/oil-boundary-temporal-tracking
      EXPECTED_SHA: 79f934cc41a462cf2eb54e088e8e5fac418df425
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.FEATURE_BRANCH }}
          fetch-depth: 0
      - name: Assert exact feature head
        run: |
          actual="$(git rev-parse HEAD)"
          echo "expected_feature_sha=${EXPECTED_SHA}"
          echo "actual_feature_sha=${actual}"
          test "${actual}" = "${EXPECTED_SHA}"
      - name: Apply deterministic paired-boundary midpoint
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('src/oil_tracker/adapters/vision/candidate_scorer.py')
          text = path.read_text(encoding='utf-8')
          old = '''                left_weight = max(0.05, left_score)
                right_weight = max(0.05, right_score)
                merged_y = (
                    left_weight * float(left.y) + right_weight * float(right.y)
                ) / (left_weight + right_weight)
                keeper.features["paired_boundary_original_y"] = float(keeper.y)
                keeper.features["paired_boundary_merged_y"] = float(merged_y)
'''
          new = '''                unrounded_midpoint = (float(left.y) + float(right.y)) / 2.0
                merged_y = float(round(unrounded_midpoint))
                keeper.features["paired_boundary_original_y"] = float(keeper.y)
                keeper.features["paired_boundary_unrounded_midpoint"] = float(
                    unrounded_midpoint
                )
                keeper.features["paired_boundary_merged_y"] = float(merged_y)
'''
          if text.count(old) != 1:
              raise SystemExit(f'expected one replacement target, found {text.count(old)}')
          path.write_text(text.replace(old, new), encoding='utf-8')
          PY
          git diff --check
      - name: Commit feature fix
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/oil_tracker/adapters/vision/candidate_scorer.py
          git commit -m "fix: align paired oil boundary to deterministic midpoint"
          git push origin HEAD:"${FEATURE_BRANCH}"
          echo "new_feature_sha=$(git rev-parse HEAD)"
