name: S5-B focused probe

on:
  pull_request:
    branches: [main]

permissions:
  contents: read
  pull-requests: write

jobs:
  foam-regression:
    runs-on: ubuntu-24.04
    env:
      QT_QPA_PLATFORM: offscreen
      EXPECTED_SHA: afd0397d9cd32c1146760bc7fd2a85639ac9ad52
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.EXPECTED_SHA }}
      - name: Assert exact feature head
        run: |
          actual="$(git rev-parse HEAD)"
          echo "expected_exact_sha=${EXPECTED_SHA}"
          echo "actual_checkout_sha=${actual}"
          test "${actual}" = "${EXPECTED_SHA}"
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install runtime and package
        run: |
          sudo apt-get update -qq >/dev/null
          sudo apt-get install -y -qq libegl1 libgl1 libxkbcommon-x11-0 libxcb-cursor0 libxcb-xinerama0 libxcb-keysyms1 libxcb-render-util0 >/dev/null
          python -m pip install -q -e '.[dev]'
      - name: Run S5-A compatibility diagnostic
        shell: bash
        run: |
          set +e
          python -m pytest -vv --tb=long \
            tests/test_foam_evidence.py \
            tests/test_foam_fill_state_policy.py \
            tests/test_foam_phase_detector_integration.py \
            tests/test_foam_settings.py \
            tests/test_foam_temporal_gate.py \
            tests/test_foam_controlled_benchmark.py > /tmp/pytest.log 2>&1
          status=$?
          cat /tmp/pytest.log
          {
            echo "## Temporary S5-A compatibility diagnostic"
            echo
            echo "Exact feature SHA: \`${EXPECTED_SHA}\`"
            echo
            echo '```text'
            tail -n 720 /tmp/pytest.log
            echo '```'
          } > /tmp/body.md
          gh pr edit 55 --body-file /tmp/body.md || true
          exit ${status}
