name: S5-B focused probe

on:
  pull_request:
    branches: [main]

permissions:
  contents: read
  pull-requests: write
  issues: write

jobs:
  focused:
    name: focused-consensus-scoring
    runs-on: ubuntu-24.04
    env:
      QT_QPA_PLATFORM: offscreen
      EXPECTED_SHA: 3bdf7f5f8f8925eef372aa0f2bf3c797735d7139
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.EXPECTED_SHA }}
      - name: Assert exact feature head
        run: |
          actual="$(git rev-parse HEAD)"
          echo "expected_exact_sha=${EXPECTED_SHA}"
          echo "actual_checkout_sha=${actual}"
          test "${actual}" = "${EXPECTED_SHA}"
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install runtime and package
        run: |
          sudo apt-get update -qq >/dev/null
          sudo apt-get install -y -qq libegl1 libgl1 libxkbcommon-x11-0 libxcb-cursor0 libxcb-xinerama0 libxcb-keysyms1 libxcb-render-util0 >/dev/null
          python -m pip install -q -e '.[dev]'
      - name: Run isolated diagnostic
        shell: bash
        run: |
          set +e
          {
            echo 'candidate-related test files:'
            find tests -maxdepth 1 -type f -name '*candidate*' -printf '%f\n' | sort
            echo
            python -m pytest -q --tb=short \
              tests/test_oil_candidate_consensus.py \
              tests/test_oil_signed_scoring.py \
              tests/test_oil_no_interface.py
          } > /tmp/pytest.log 2>&1
          status=$?
          cat /tmp/pytest.log
          {
            echo "### S5-B isolated diagnostic: consensus-scoring"
            echo
            echo "Exact feature SHA: \`${EXPECTED_SHA}\`"
            echo
            echo '```text'
            tail -n 180 /tmp/pytest.log
            echo '```'
          } > /tmp/comment.md
          gh api repos/teeeeooo/oil_level_tracker/issues/comments/5035885005 \
            --method PATCH -F body=@/tmp/comment.md
          exit ${status}
