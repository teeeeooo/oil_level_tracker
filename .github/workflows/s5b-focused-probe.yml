name: S5-B raw error case diagnosis

on:
  pull_request:
    branches: [main]

concurrency:
  group: s5b-validation-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write

jobs:
  diagnose:
    runs-on: ubuntu-24.04
    env:
      QT_QPA_PLATFORM: offscreen
      FEATURE_SHA: 387fdd9d9849853186b6b1f3df709127630a3046
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.FEATURE_SHA }}
      - name: Assert exact feature checkout
        run: test "$(git rev-parse HEAD)" = "${FEATURE_SHA}"
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install package
        run: |
          sudo apt-get update -qq >/dev/null
          sudo apt-get install -y -qq libegl1 libgl1 libxkbcommon-x11-0 libxcb-cursor0 >/dev/null
          python -m pip install -q -e '.[dev]'
      - name: Generate feature oil payload and print high-error cases
        run: |
          PYTHONPATH=tests python - <<'PY' > /tmp/cases.txt
          from datetime import datetime, timezone
          import json
          import os
          from pathlib import Path
          from oil_benchmark_fixtures import generate_controlled_oil_dataset
          from oil_tracker.adapters.storage.benchmark_result_writer import AtomicBenchmarkResultWriter
          from oil_tracker.adapters.storage.regression_dataset_reader import FilesystemRegressionDatasetReader
          from oil_tracker.adapters.vision.opencv_phase_detector import OpenCvPhaseDetector
          from oil_tracker.application.services.detector_benchmark_service import DetectorBenchmarkService

          root = Path(os.environ['RUNNER_TEMP']) / 'raw-case-diagnosis'
          dataset, _ = generate_controlled_oil_dataset(root)
          service = DetectorBenchmarkService(
              FilesystemRegressionDatasetReader(),
              AtomicBenchmarkResultWriter(),
              OpenCvPhaseDetector,
              clock=lambda: datetime(2026, 7, 22, tzinfo=timezone.utc),
              runtime_metadata_factory=lambda: {'python':'diagnostic','packages':{}},
          )
          payload = service.run(dataset, root / 'results').payload
          selected = []
          for case in payload['cases']:
              error = case.get('raw_oil_absolute_error_px')
              if error is not None and error >= 1.0:
                  selected.append({
                      'category': case['category'],
                      'sequence_id': case['sequence_id'],
                      'sequence_order': case['sequence_order'],
                      'truth_y': case['truth_oil_boundary_y'],
                      'raw_y': case['raw_oil_boundary_y'],
                      'error': error,
                      'smoothed_y': case['smoothed_oil_boundary_y'],
                      'smoothed_error': case['smoothed_oil_absolute_error_px'],
                      'fill_state': case['predicted_fill_state'],
                      'flags': case['flags'],
                  })
          selected.sort(key=lambda item: (-item['error'], str(item['sequence_id']), item['sequence_order'] if item['sequence_order'] is not None else -1, item['truth_y']))
          print(json.dumps({
              'dataset_fingerprint': payload['dataset']['fingerprint'],
              'detector_version': payload['detector']['version'],
              'raw_median': payload['micro_aggregate']['metrics']['raw_oil_median_absolute_error']['value'],
              'raw_p90': payload['micro_aggregate']['metrics']['raw_oil_p90_absolute_error']['value'],
              'raw_p95': payload['micro_aggregate']['metrics']['raw_oil_p95_absolute_error']['value'],
              'cases': selected,
          }, sort_keys=True, indent=2))
          PY
          cat /tmp/cases.txt
          {
            echo '## S5-B raw-error case diagnosis'
            echo
            echo 'Feature-only controlled oil payload; no base, Foam, CPU, or canonical rerun.'
            echo
            echo '```json'
            cat /tmp/cases.txt
            echo '```'
          } > /tmp/body.md
          gh pr edit 55 --repo "${GITHUB_REPOSITORY}" --body-file /tmp/body.md
