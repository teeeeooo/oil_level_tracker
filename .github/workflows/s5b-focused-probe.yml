name: S5-B controlled log extraction

on:
  pull_request:
    branches: [main]

concurrency:
  group: s5b-validation-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  actions: read
  pull-requests: write
  contents: read

jobs:
  extract:
    runs-on: ubuntu-24.04
    env:
      GH_TOKEN: ${{ github.token }}
      FAILED_RUN_ID: '29854649152'
      FAILED_JOB_ID: '88716059931'
    steps:
      - name: Extract stored summary and traceback
        run: |
          gh run view "${FAILED_RUN_ID}" --repo "${GITHUB_REPOSITORY}" --job "${FAILED_JOB_ID}" --log > /tmp/job.log
          python - <<'PY'
          import re
          from pathlib import Path
          lines = Path('/tmp/job.log').read_text(encoding='utf-8', errors='replace').splitlines()
          keys = (
              '"base_sha"', '"feature_sha"', '"dataset_fingerprint"', '"case_count"',
              '"sequence_count"', '"category_count"', '"base_detector"', '"feature_detector"',
              '"base_errors"', '"feature_errors"', '"raw_oil_', '"smoothed_oil_',
              '"base_coverage"', '"feature_coverage"', '"base_no_interface_fpr"',
              '"feature_no_interface_fpr"', '"base_temporal_recovery"',
              '"feature_temporal_recovery"', '"base_foam_precision"', '"feature_foam_precision"',
              '"base_foam_recall"', '"feature_foam_recall"', '"base_shimmer_fpr"',
              '"feature_shimmer_fpr"', '"base_cpu_ms"', '"feature_cpu_ms"', '"cpu_ratio"',
              '"dependency_diff"',
          )
          extracted = []
          for line in lines:
              if any(key in line for key in keys) and '^[[36;1m' not in line:
                  extracted.append(re.sub(r'^.*?Z\s+', '', line))
          traceback = []
          for index, line in enumerate(lines):
              if 'Traceback (most recent call last):' in line:
                  traceback = [re.sub(r'^.*?Z\s+', '', value) for value in lines[index:index+7]]
                  break
          body = [
              '## S5-B controlled comparison diagnosis', '',
              'Stored log only; detector and benchmark were not rerun.', '',
              '```text', *extracted[-100:], '```', '',
              '```text', *traceback, '```',
          ]
          Path('/tmp/body.md').write_text('\n'.join(body), encoding='utf-8')
          PY
          cat /tmp/body.md
          gh pr edit 55 --repo "${GITHUB_REPOSITORY}" --body-file /tmp/body.md
