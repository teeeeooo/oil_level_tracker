name: S5-B polarity edge-center patch

on:
  pull_request:
    branches: [main]

concurrency:
  group: s5b-validation-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  patch-feature:
    runs-on: ubuntu-24.04
    env:
      FEATURE_BRANCH: feature/oil-boundary-temporal-tracking
      EXPECTED_SHA: 387fdd9d9849853186b6b1f3df709127630a3046
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.FEATURE_BRANCH }}
          fetch-depth: 0
      - name: Assert exact feature head
        run: |
          actual="$(git rev-parse HEAD)"
          echo "expected_feature_sha=${EXPECTED_SHA}"
          echo "actual_feature_sha=${actual}"
          test "${actual}" = "${EXPECTED_SHA}"
      - name: Apply bounded polarity edge-center refinement
        run: |
          python - <<'PY'
          from pathlib import Path

          scorer = Path('src/oil_tracker/adapters/vision/candidate_scorer.py')
          text = scorer.read_text(encoding='utf-8')
          old = '''    for candidate in candidates:
        if id(candidate) not in resolved:
            candidate.features.setdefault("paired_structure_distance_px", 0.0)
            candidate.features.setdefault("paired_structure_partner_y", 0.0)
            candidate.features.setdefault("paired_structure_opposite_polarity", 0.0)
            candidate.features.setdefault("paired_boundary_step_preserved", 0.0)
'''
          new = '''    for candidate in candidates:
        if id(candidate) not in resolved:
            candidate.features.setdefault("paired_structure_distance_px", 0.0)
            candidate.features.setdefault("paired_structure_partner_y", 0.0)
            candidate.features.setdefault("paired_structure_opposite_polarity", 0.0)
            candidate.features.setdefault("paired_boundary_step_preserved", 0.0)
        support = int(
            round(candidate.features.get("unique_generator_support_count", 0.0))
        )
        polarity_sign = float(candidate.features.get("polarity_sign", 0.0))
        polarity_score = float(candidate.features.get("polarity_score", 0.0))
        persistent_region = float(
            candidate.features.get("persistent_region_contrast", 0.0)
        )
        if (
            not candidate.rejected
            and candidate.source == "oil_consensus"
            and support >= int(settings.oil_min_consensus_sources)
            and float(candidate.features.get("paired_boundary_step_preserved", 0.0)) < 0.5
            and float(candidate.features.get("polarity_available", 0.0)) >= 0.5
            and abs(polarity_sign) > 0.5
            and polarity_score >= max(0.15, float(settings.oil_min_polarity_score))
            and persistent_region >= max(
                0.20,
                float(settings.minimum_region_contrast),
            )
        ):
            correction = -1.0 if polarity_sign > 0.0 else 1.0
            original_y = float(candidate.y)
            candidate.features["pre_polarity_edge_center_y"] = original_y
            candidate.features["polarity_edge_center_correction_px"] = correction
            candidate.y = original_y + correction
            candidate.features["representative_local_y"] = float(candidate.y)
        else:
            candidate.features.setdefault("polarity_edge_center_correction_px", 0.0)
'''
          if text.count(old) != 1:
              raise SystemExit(f'candidate scorer replacement target count={text.count(old)}')
          scorer.write_text(text.replace(old, new), encoding='utf-8')

          tests = Path('tests/test_oil_signed_scoring.py')
          test_text = tests.read_text(encoding='utf-8')
          marker = '''def test_single_signed_boundary_is_not_rejected_as_structure():
'''
          addition = '''def test_strong_consensus_polarity_refines_to_edge_center():
    _image, _mask, positive = _score(190, 70)
    _image, _mask, negative = _score(70, 190)
    assert positive.y == 23.0
    assert positive.features["polarity_edge_center_correction_px"] == -1.0
    assert negative.y == 25.0
    assert negative.features["polarity_edge_center_correction_px"] == 1.0


'''
          if test_text.count(marker) != 1:
              raise SystemExit(f'test insertion marker count={test_text.count(marker)}')
          tests.write_text(test_text.replace(marker, addition + marker), encoding='utf-8')
          PY
          git diff --check
      - name: Commit feature fix
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/oil_tracker/adapters/vision/candidate_scorer.py tests/test_oil_signed_scoring.py
          git commit -m "fix: refine strong oil edges to interface center"
          git push origin HEAD:"${FEATURE_BRANCH}"
          echo "new_feature_sha=$(git rev-parse HEAD)"
