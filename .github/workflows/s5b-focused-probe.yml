name: S5-B focused probe

on:
  pull_request:
    branches: [main]

permissions:
  contents: read
  pull-requests: write

jobs:
  controlled-oil:
    runs-on: ubuntu-24.04
    env:
      QT_QPA_PLATFORM: offscreen
      EXPECTED_SHA: cda5a1bfcfeaae0dcb86675b07021d03a4020273
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.EXPECTED_SHA }}
      - name: Assert exact feature head
        run: |
          actual="$(git rev-parse HEAD)"
          echo "expected_exact_sha=${EXPECTED_SHA}"
          echo "actual_checkout_sha=${actual}"
          test "${actual}" = "${EXPECTED_SHA}"
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install runtime and package
        run: |
          sudo apt-get update -qq >/dev/null
          sudo apt-get install -y -qq libegl1 libgl1 libxkbcommon-x11-0 libxcb-cursor0 libxcb-xinerama0 libxcb-keysyms1 libxcb-render-util0 >/dev/null
          python -m pip install -q -e '.[dev]'
      - name: Run controlled oil diagnostic
        shell: bash
        run: |
          set +e
          python -m pytest -q --tb=short tests/test_oil_controlled_benchmark.py > /tmp/pytest.log 2>&1
          status=$?
          cat /tmp/pytest.log
          {
            echo "### S5-B controlled oil diagnostic"
            echo
            echo "Exact feature SHA: \`${EXPECTED_SHA}\`"
            echo
            echo '```text'
            tail -n 260 /tmp/pytest.log
            echo '```'
          } > /tmp/comment.md
          gh pr comment 55 --body-file /tmp/comment.md || true
          exit ${status}
