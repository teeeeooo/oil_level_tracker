name: S5-B focused probe

on:
  pull_request:
    branches: [main]

permissions:
  contents: read
  pull-requests: write
  issues: write

jobs:
  focused:
    name: focused-integration
    runs-on: ubuntu-24.04
    env:
      QT_QPA_PLATFORM: offscreen
      EXPECTED_SHA: 6577f7cebd83021cfe4971f68cfbf9204f093c50
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.EXPECTED_SHA }}
      - name: Assert exact feature head
        run: |
          actual="$(git rev-parse HEAD)"
          echo "expected_exact_sha=${EXPECTED_SHA}"
          echo "actual_checkout_sha=${actual}"
          test "${actual}" = "${EXPECTED_SHA}"
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install runtime and package
        run: |
          sudo apt-get update -qq >/dev/null
          sudo apt-get install -y -qq libegl1 libgl1 libxkbcommon-x11-0 libxcb-cursor0 libxcb-xinerama0 libxcb-keysyms1 libxcb-render-util0 >/dev/null
          python -m pip install -q -e '.[dev]'
      - name: Run isolated diagnostic
        shell: bash
        run: |
          set +e
          python -m pytest -q --tb=short \
            tests/test_oil_detector_integration.py \
            tests/test_oil_fill_state_classifier.py \
            tests/test_oil_settings.py \
            tests/test_ui_import_boundaries.py > /tmp/pytest.log 2>&1
          status=$?
          if [ "${status}" -ne 0 ]; then
            python - <<'PY' >> /tmp/pytest.log 2>&1
          import sys
          sys.path.insert(0, 'tests')
          from test_oil_detector_integration import glass, oil_frame
          from oil_tracker.adapters.vision.opencv_phase_detector import OpenCvPhaseDetector
          detector = OpenCvPhaseDetector()
          detection, artifacts = detector.detect(oil_frame(130), glass(), 1, 0.0, debug=True)
          print('\n--- bounded detector diagnostic ---')
          for key in sorted(detection.debug_metrics):
              if key.startswith('oil_') or key in {'glare_ratio', 'previous_state', 'proposed_state', 'stabilized_state'}:
                  print(f'{key}={detection.debug_metrics[key]}')
          for row in (artifacts.candidate_rows if artifacts else [])[:12]:
              print({
                  'source': row.get('source'),
                  'y': row.get('y'),
                  'support': row.get('unique_generator_support_count'),
                  'consensus': row.get('consensus_score'),
                  'observation': row.get('observation_score'),
                  'polarity': row.get('polarity_score'),
                  'static': row.get('static_overlap'),
                  'path_rank': row.get('path_rank'),
                  'margin': row.get('best_second_path_margin'),
                  'rejected': row.get('rejected'),
                  'reason': row.get('reject_reason'),
              })
          PY
          fi
          cat /tmp/pytest.log
          {
            echo "### S5-B isolated diagnostic: integration"
            echo
            echo "Exact feature SHA: \`${EXPECTED_SHA}\`"
            echo
            echo '```text'
            tail -n 240 /tmp/pytest.log
            echo '```'
          } > /tmp/comment.md
          gh api repos/teeeeooo/oil_level_tracker/issues/comments/5035885331 \
            --method PATCH -F body=@/tmp/comment.md
          exit ${status}
