name: Apply guided workbench UX phase 1

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  apply-and-test:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out feature branch
        uses: actions/checkout@v4
        with:
          ref: feature/guided-workbench-ux-phase1
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install Qt runtime libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1 libxkbcommon-x11-0 libxcb-cursor0

      - name: Apply exact source patch
        run: |
          rm -f validation_failure.txt
          python scripts/apply_guided_ux_phase1.py

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run regression suite
        id: regression
        continue-on-error: true
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          set -o pipefail
          python -m pytest -q 2>&1 | tee validation_failure.txt

      - name: Publish failure details
        if: steps.regression.outcome == 'failure'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add validation_failure.txt
          git commit -m "test: record guided UX validation failure"
          git push origin HEAD:feature/guided-workbench-ux-phase1
          exit 1

      - name: Commit materialized source changes
        if: steps.regression.outcome == 'success'
        run: |
          rm -f validation_failure.txt
          rm -f scripts/apply_guided_ux_phase1.py
          rm -f .github/workflows/apply-guided-ux-phase1.yml
          git config user.name "github-actions[bot]"
          git config user.email "4189827+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: add guided workbench UX phase 1"
          git push origin HEAD:feature/guided-workbench-ux-phase1
