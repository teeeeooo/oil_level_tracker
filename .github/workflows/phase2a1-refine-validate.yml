name: Phase 2A-1 refine and validate

on:
  pull_request:
    branches:
      - main
    types: [opened, synchronize, reopened]

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  refine-and-validate:
    runs-on: ubuntu-24.04
    env:
      QT_QPA_PLATFORM: offscreen
      PIP_DISABLE_PIP_VERSION_CHECK: "1"
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: feature/workbench-readiness-feedback
          fetch-depth: 0

      - name: Install Qt runtime libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libegl1 \
            libgl1 \
            libxkbcommon-x11-0 \
            libxcb-cursor0 \
            libxcb-xinerama0

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Install project dependencies for Python 3.13
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Apply readiness refinement
        run: python scripts/refine_phase2a1_readiness.py

      - name: Remove temporary validation files
        run: |
          rm scripts/refine_phase2a1_readiness.py
          rm .github/workflows/phase2a1-refine-validate.yml

      - name: Pre-commit validation on Python 3.13
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set +e
          python -m pytest -q 2>&1 | tee /tmp/phase2a1-precommit-py313.log
          status=${PIPESTATUS[0]}
          set -e
          if [ "$status" -ne 0 ]; then
            {
              echo "### Phase 2A-1 refinement validation failure"
              echo
              echo "Python 3.13 pre-commit validation failed at head \`${{ github.event.pull_request.head.sha }}\`."
              echo
              echo '```text'
              tail -n 180 /tmp/phase2a1-precommit-py313.log
              echo '```'
            } > /tmp/phase2a1-comment.md
            gh pr comment "${{ github.event.pull_request.number }}" --body-file /tmp/phase2a1-comment.md
            exit "$status"
          fi

      - name: Commit refined implementation
        id: commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: refine readiness step boundaries"
          git push origin HEAD:feature/workbench-readiness-feedback
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Verify exact feature head on Python 3.13
        run: |
          test "$(git rev-parse HEAD)" = "${{ steps.commit.outputs.sha }}"
          python --version
          python -m pytest -q 2>&1 | tee /tmp/phase2a1-exact-py313.log

      - name: Set up Python 3.14
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip

      - name: Install project dependencies for Python 3.14
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Verify exact feature head on Python 3.14
        run: |
          test "$(git rev-parse HEAD)" = "${{ steps.commit.outputs.sha }}"
          python --version
          python -m pytest -q 2>&1 | tee /tmp/phase2a1-exact-py314.log

      - name: Publish validation summary
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          {
            echo "### Phase 2A-1 exact-head validation passed"
            echo
            echo "- Exact feature head: \`${{ steps.commit.outputs.sha }}\`"
            echo "- Workflow run ID: \`${{ github.run_id }}\`"
            echo "- Environment: Ubuntu 24.04, Qt offscreen"
            echo "- Command: \`QT_QPA_PLATFORM=offscreen python -m pytest -q\`"
            echo "- Python 3.13: \`$(tail -n 1 /tmp/phase2a1-exact-py313.log)\`"
            echo "- Python 3.14: \`$(tail -n 1 /tmp/phase2a1-exact-py314.log)\`"
            echo "- Temporary workflow and refinement script: removed before final commit"
          } > /tmp/phase2a1-success.md
          gh pr comment "${{ github.event.pull_request.number }}" --body-file /tmp/phase2a1-success.md
