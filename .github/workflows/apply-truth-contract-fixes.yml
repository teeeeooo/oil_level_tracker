name: Apply truth coordinate contract fixes

on:
  push:
    branches: [feature/result-review-user-truth-regression]
    paths:
      - .github/workflows/apply-truth-contract-fixes.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/result-review-user-truth-regression
          fetch-depth: 2
      - name: Assert exact source head
        run: test "$(git rev-parse HEAD^)" = "3b0b70b32fea75ba9cedb315b54369efc08e18b2"
      - name: Patch canonical coordinate validation
        shell: python
        run: |
          from pathlib import Path

          path = Path("src/oil_tracker/domain/user_truth.py")
          text = path.read_text(encoding="utf-8")
          old = '''        return cls(
              source_frame_y=_finite(payload.get("source_frame_y"), "source_frame_y"),
              roi_local_y=_finite(payload.get("roi_local_y"), "roi_local_y"),
              px_from_zero=_finite(payload.get("px_from_zero"), "px_from_zero"),
              mm_from_zero=_finite(payload.get("mm_from_zero"), "mm_from_zero"),
          )'''
          new = '''        source_y = _finite(payload.get("source_frame_y"), "source_frame_y")
          local_y = _finite(payload.get("roi_local_y"), "roi_local_y")
          if source_y is None or local_y is None:
              raise TruthValidationError("truth coordinate에는 source_frame_y와 roi_local_y가 필요합니다.")
          return cls(
              source_frame_y=source_y,
              roi_local_y=local_y,
              px_from_zero=_finite(payload.get("px_from_zero"), "px_from_zero"),
              mm_from_zero=_finite(payload.get("mm_from_zero"), "mm_from_zero"),
          )'''
          if text.count(old) != 1:
              raise SystemExit("TruthCoordinate.from_dict replacement target mismatch")
          text = text.replace(old, new)
          old = '''    local = value - ellipse.bounds.y
    px = glass.geometry.level_px_from_zero(value)'''
          new = '''    crop_origin_y = max(0, int(math.floor(ellipse.bounds.y)))
    local = value - crop_origin_y
    px = glass.geometry.level_px_from_zero(value)'''
          if text.count(old) != 1:
              raise SystemExit("coordinate origin replacement target mismatch")
          text = text.replace(old, new)
          path.write_text(text, encoding="utf-8")
      - name: Commit fixes and remove temporary workflow
        run: |
          rm .github/workflows/apply-truth-contract-fixes.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/oil_tracker/domain/user_truth.py .github/workflows/apply-truth-contract-fixes.yml
          test "$(git diff --cached --name-only | sort)" = $'.github/workflows/apply-truth-contract-fixes.yml\nsrc/oil_tracker/domain/user_truth.py'
          git commit -m "fix: align truth coordinates with ROI crop origin"
          git push origin HEAD:feature/result-review-user-truth-regression
