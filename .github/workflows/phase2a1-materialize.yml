name: Phase 2A-1 materialize and validate

on:
  push:
    branches:
      - feature/workbench-readiness-feedback

permissions:
  contents: write

jobs:
  materialize-and-validate:
    runs-on: ubuntu-24.04
    env:
      QT_QPA_PLATFORM: offscreen
      PIP_DISABLE_PIP_VERSION_CHECK: "1"
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: feature/workbench-readiness-feedback
          fetch-depth: 0

      - name: Install Qt runtime libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libegl1 \
            libgl1 \
            libxkbcommon-x11-0 \
            libxcb-cursor0 \
            libxcb-xinerama0

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Install project dependencies for Python 3.13
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Materialize implementation
        run: python scripts/apply_phase2a1_readiness.py

      - name: Remove temporary materialization files
        run: |
          rm scripts/apply_phase2a1_readiness.py
          rm .github/workflows/phase2a1-materialize.yml

      - name: Pre-commit validation on Python 3.13
        run: python -m pytest -q

      - name: Commit materialized implementation
        id: commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: add workbench readiness feedback"
          git push origin HEAD:feature/workbench-readiness-feedback
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Verify exact feature head on Python 3.13
        run: |
          test "$(git rev-parse HEAD)" = "${{ steps.commit.outputs.sha }}"
          python --version
          python -m pytest -q

      - name: Set up Python 3.14
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip

      - name: Install project dependencies for Python 3.14
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Verify exact feature head on Python 3.14
        run: |
          test "$(git rev-parse HEAD)" = "${{ steps.commit.outputs.sha }}"
          python --version
          python -m pytest -q

      - name: Validation summary
        run: |
          echo "Exact feature head: ${{ steps.commit.outputs.sha }}"
          echo "Command: QT_QPA_PLATFORM=offscreen python -m pytest -q"
          echo "Temporary workflow and materialization script removed before final commit."
