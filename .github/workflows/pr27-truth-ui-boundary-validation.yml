name: PR 27 Truth UI Boundary Diagnostics

on:
  pull_request:
    branches: [main]

permissions:
  contents: read
  pull-requests: write

jobs:
  diagnostics:
    name: Python 3.13 bounded diagnostics
    runs-on: ubuntu-24.04
    env:
      QT_QPA_PLATFORM: offscreen
      EXPECTED_FEATURE_SHA: 425cfdba141c98abaa860b18e1ec23624cccca26
    steps:
      - name: Checkout exact feature head
        uses: actions/checkout@v4
        with:
          ref: ${{ env.EXPECTED_FEATURE_SHA }}
          fetch-depth: 1
      - name: Assert exact checkout
        shell: bash
        run: |
          actual="$(git rev-parse HEAD)"
          test "$actual" = "$EXPECTED_FEATURE_SHA"
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - name: Install runtime and project dependencies
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libegl1 libgl1 libxkbcommon-x11-0 libxcb-cursor0 libxcb-icccm4 \
            libxcb-image0 libxcb-keysyms1 libxcb-randr0 libxcb-render-util0 \
            libxcb-shape0 libxcb-xinerama0
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
      - name: Run bounded diagnostics and publish result
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set +e
          python -m pytest -q --disable-warnings --tb=short 2>&1 | tee pytest.log
          status=${PIPESTATUS[0]}
          set -e
          {
            echo "## Python 3.13 bounded diagnostics"
            echo
            echo "Exact feature SHA: \`$EXPECTED_FEATURE_SHA\`"
            echo "Exit status: \`$status\`"
            echo
            echo '```text'
            cat pytest.log
            echo '```'
          } > validation-comment.md
          gh pr comment "${{ github.event.pull_request.number }}" --body-file validation-comment.md
          exit "$status"
