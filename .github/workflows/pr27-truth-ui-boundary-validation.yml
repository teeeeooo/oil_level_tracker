name: PR 27 Truth UI Boundary Validation

on:
  pull_request:
    branches: [main]

permissions:
  contents: read
  pull-requests: write

jobs:
  canonical:
    name: Python ${{ matrix.python-version }} canonical
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.13", "3.14"]
    env:
      QT_QPA_PLATFORM: offscreen
      EXPECTED_FEATURE_SHA: 7cf152083b72394a90ae1118a94084c32b0c9033
    steps:
      - name: Checkout exact feature head
        uses: actions/checkout@v4
        with:
          ref: ${{ env.EXPECTED_FEATURE_SHA }}
          fetch-depth: 1
      - name: Assert exact checkout
        shell: bash
        run: |
          actual="$(git rev-parse HEAD)"
          test "$actual" = "$EXPECTED_FEATURE_SHA"
          echo "Validated exact feature SHA: $actual"
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install Qt runtime libraries
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libegl1 libgl1 libxkbcommon-x11-0 libxcb-cursor0 libxcb-icccm4 \
            libxcb-image0 libxcb-keysyms1 libxcb-randr0 libxcb-render-util0 \
            libxcb-shape0 libxcb-xinerama0
      - name: Install project and test dependencies
        shell: bash
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
      - name: Run exact canonical suite and publish concise result
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set +e
          python -m pytest -q 2>&1 | tee pytest.log
          status=${PIPESTATUS[0]}
          set -e
          python - <<'PY' > runtime.txt
          import matplotlib
          import PySide6
          import sys
          print(f"Python {sys.version.split()[0]}")
          print(f"PySide6 {PySide6.__version__}")
          print(f"Matplotlib {matplotlib.__version__}")
          PY
          summary="$(grep -E '[0-9]+ (passed|failed|skipped)' pytest.log | tail -n 1 || true)"
          {
            echo "## Python ${{ matrix.python-version }} exact canonical result"
            echo
            echo "Exact feature SHA: \`$EXPECTED_FEATURE_SHA\`"
            echo "Command: \`QT_QPA_PLATFORM=offscreen python -m pytest -q\`"
            while IFS= read -r line; do echo "- $line"; done < runtime.txt
            echo "- Exit status: \`$status\`"
            echo "- Result: ${summary:-summary unavailable}"
            if [ "$status" -ne 0 ]; then
              echo
              echo '```text'
              grep -E '^(FAILED|ERROR|E   |=+ FAILURES|=+ short test summary|[0-9]+ failed)' pytest.log | tail -n 120 || tail -n 120 pytest.log
              echo '```'
            fi
          } > validation-comment.md
          gh pr comment "${{ github.event.pull_request.number }}" --body-file validation-comment.md
          exit "$status"
