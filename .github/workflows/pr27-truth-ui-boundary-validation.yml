name: PR 27 Validation Branch Cleanup

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  cleanup:
    name: Delete temporary validation branch
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout temporary branch
        uses: actions/checkout@v4
        with:
          ref: validation/pr27-truth-ui-boundary-20260721
          fetch-depth: 1
      - name: Delete temporary branch ref
        shell: bash
        run: git push origin --delete validation/pr27-truth-ui-boundary-20260721
