name: S4 focused validation

on:
  pull_request:
    branches: [main]

permissions:
  contents: read
  pull-requests: write

jobs:
  focused:
    runs-on: ubuntu-24.04
    env:
      EXPECTED_SHA: 20dbe42d1d1624d2f3d8f252d44d7bd7eb97ffc0
      QT_QPA_PLATFORM: offscreen
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout exact feature SHA
        uses: actions/checkout@v4
        with:
          ref: ${{ env.EXPECTED_SHA }}
          fetch-depth: 1
      - name: Assert exact checkout
        run: |
          echo "expected exact SHA=$EXPECTED_SHA"
          echo "actual SHA=$(git rev-parse HEAD)"
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
      - name: Install runner dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq fonts-noto-cjk libegl1 libgl1 libxkbcommon-x11-0
          fc-cache -f
      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
      - name: Install package
        run: |
          python -m pip install --upgrade pip -q
          python -m pip install -e '.[dev]' -q
      - name: Record environment and font
        run: |
          python - <<'PY' | tee /tmp/env.txt
          import matplotlib, numpy, cv2, PySide6, sys
          from oil_tracker.visualization.matplotlib_font import resolve_matplotlib_font
          selected = resolve_matplotlib_font()
          print('Python=' + sys.version.split()[0])
          print('PySide6=' + PySide6.__version__)
          print('NumPy=' + numpy.__version__)
          print('OpenCV=' + cv2.__version__)
          print('Matplotlib=' + matplotlib.__version__)
          print('selected_font=' + selected.family)
          print('font_source=' + selected.source)
          print('font_supports_Hangul=' + str(selected.supports_hangul))
          PY
      - name: Run focused tests
        run: |
          set -o pipefail
          python -m pytest -q --tb=short \
            tests/test_s4_progress_contract.py \
            tests/test_s4_graph_axis.py \
            tests/test_s4_matplotlib_font.py \
            tests/test_s4_analysis_progress_dialog.py \
            tests/test_s4_analysis_worker.py \
            tests/integration/test_result_review_bundle_output.py \
            tests/integration/test_debug_trace_bundle_output.py \
            tests/unit/test_analysis_debug_trace_pipeline.py \
            tests/unit/test_review_graph.py \
            tests/gui/test_result_review_graph.py \
            tests/gui/test_analysis_completion_coordinator.py \
            tests/test_redetection_comparison.py \
            tests/test_redetection_ui_controller.py \
            tests/test_ui_import_boundaries.py \
            tests/gui/test_result_review_canvas.py \
            tests/test_redetection_raster_boundary.py \
            tests/gui/test_workbench_usability_stabilization.py \
            tests/unit/test_preflight_use_case.py 2>&1 | tee /tmp/pytest.txt
      - name: Publish compact evidence
        run: |
          glyph_count=$(grep -Ec 'Glyph .* missing from font' /tmp/pytest.txt || true)
          {
            echo "### S4 focused final exact-head evidence"
            echo
            echo "- run_id: $GITHUB_RUN_ID"
            echo "- expected_sha: $EXPECTED_SHA"
            echo "- actual_sha: $(git rev-parse HEAD)"
            echo "- missing_hangul_glyph_warnings: $glyph_count"
            echo
            echo '```text'
            cat /tmp/env.txt
            tail -n 8 /tmp/pytest.txt
            echo '```'
          } > /tmp/comment.md
          gh pr comment "${{ github.event.pull_request.number }}" --body-file /tmp/comment.md
