name: S4 focused validation

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  focused:
    runs-on: ubuntu-24.04
    env:
      EXPECTED_SHA: 757ceb7f8768107809a7106d43311cfb094713b2
      QT_QPA_PLATFORM: offscreen
    steps:
      - name: Checkout exact feature SHA
        uses: actions/checkout@v4
        with:
          ref: ${{ env.EXPECTED_SHA }}
          fetch-depth: 1
      - name: Assert exact checkout
        run: |
          echo "expected exact SHA=$EXPECTED_SHA"
          echo "actual SHA=$(git rev-parse HEAD)"
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
      - name: Install runner display and Korean font dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq fonts-noto-cjk libegl1 libgl1 libxkbcommon-x11-0
          fc-cache -f
      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
      - name: Install package
        run: |
          python -m pip install --upgrade pip -q
          python -m pip install -e '.[dev]' -q
      - name: Print environment and selected font
        run: |
          python - <<'PY'
          import matplotlib, numpy, cv2, PySide6, sys
          from oil_tracker.visualization.matplotlib_font import resolve_matplotlib_font
          selected = resolve_matplotlib_font()
          print('Python=', sys.version)
          print('PySide6=', PySide6.__version__)
          print('NumPy=', numpy.__version__)
          print('OpenCV=', cv2.__version__)
          print('Matplotlib=', matplotlib.__version__)
          print('selected Matplotlib font=', selected.family)
          print('font resolver source=', selected.source)
          print('font supports Hangul=', selected.supports_hangul)
          PY
      - name: Run focused S4 and regression tests
        run: |
          python -m pytest -q --tb=short \
            tests/test_s4_progress_contract.py \
            tests/test_s4_graph_axis.py \
            tests/test_s4_matplotlib_font.py \
            tests/test_s4_analysis_progress_dialog.py \
            tests/integration/test_result_review_bundle_output.py \
            tests/unit/test_review_graph.py \
            tests/gui/test_result_review_graph.py \
            tests/gui/test_analysis_completion_coordinator.py \
            tests/test_redetection_comparison.py \
            tests/test_redetection_ui_controller.py \
            tests/test_ui_import_boundaries.py \
            tests/gui/test_result_review_canvas.py \
            tests/test_redetection_raster_boundary.py \
            tests/gui/test_workbench_usability_stabilization.py \
            tests/unit/test_preflight_use_case.py 2>&1 | tee /tmp/focused-pytest.txt
          printf 'missing Hangul glyph warning count='
          grep -Ec 'Glyph .* missing from font' /tmp/focused-pytest.txt || true
