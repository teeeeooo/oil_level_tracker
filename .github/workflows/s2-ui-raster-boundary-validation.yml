name: S2 UI raster boundary exact-head validation

on:
  pull_request:
    branches:
      - feature/ui-raster-boundary-refactor

permissions:
  contents: read

jobs:
  focused:
    name: Focused Python 3.13
    runs-on: ubuntu-24.04
    env:
      EXPECTED_SHA: c3cfa9bdda53d188e98be3ce0c83fe77775cd64f
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.EXPECTED_SHA }}
      - name: Assert exact feature head
        run: |
          echo "expected_sha=${EXPECTED_SHA}"
          echo "actual_sha=$(git rev-parse HEAD)"
          test "$(git rev-parse HEAD)" = "${EXPECTED_SHA}"
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install runtime and project
        run: |
          sudo apt-get update >/dev/null
          sudo apt-get install -y libegl1 >/dev/null
          python -m pip install --upgrade pip >/dev/null
          python -m pip install -e '.[dev]' >/dev/null
      - name: Print package versions
        run: |
          python - <<'PY'
          import sys
          import cv2
          import matplotlib
          import numpy
          import PySide6
          import pytest
          print(f"python={sys.version}")
          print(f"PySide6={PySide6.__version__}")
          print(f"numpy={numpy.__version__}")
          print(f"opencv={cv2.__version__}")
          print(f"matplotlib={matplotlib.__version__}")
          print(f"pytest={pytest.__version__}")
          PY
      - name: Run focused S2 tests
        shell: bash
        run: |
          set +e
          python -m pytest -q --tb=short \
            tests/test_ui_import_boundaries.py \
            tests/test_qt_frame_image_converter.py \
            tests/test_review_overlay_renderer.py \
            tests/test_review_debug_overlay_renderer.py \
            tests/test_review_frame_presenter.py \
            tests/test_review_png_exporter.py \
            tests/test_redetection_raster_boundary.py \
            tests/gui/test_result_review_canvas.py \
            tests/gui/test_result_review_window.py \
            tests/gui/test_result_review_enhancements.py \
            tests/gui/test_result_review_debug_viewer.py \
            tests/gui/test_result_review_png_export.py \
            tests/gui/test_result_review_coordinator_factory.py \
            tests/gui/test_result_review_workbench_entry.py \
            tests/gui/test_truth_annotation_lifecycle.py \
            tests/unit/test_result_review_replacement.py \
            tests/test_redetection_ui_controller.py \
            tests/test_redetection_additional_contracts.py > pytest.log 2>&1
          status=$?
          if [ "$status" -eq 0 ]; then tail -n 20 pytest.log; else tail -n 220 pytest.log; fi
          exit "$status"

  canonical:
    name: Canonical Python ${{ matrix.python-version }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.13', '3.14']
    env:
      EXPECTED_SHA: c3cfa9bdda53d188e98be3ce0c83fe77775cd64f
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.EXPECTED_SHA }}
      - name: Assert exact feature head
        run: |
          echo "expected_sha=${EXPECTED_SHA}"
          echo "actual_sha=$(git rev-parse HEAD)"
          test "$(git rev-parse HEAD)" = "${EXPECTED_SHA}"
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install runtime and project
        run: |
          sudo apt-get update >/dev/null
          sudo apt-get install -y libegl1 >/dev/null
          python -m pip install --upgrade pip >/dev/null
          python -m pip install -e '.[dev]' >/dev/null
      - name: Print package versions
        run: |
          python - <<'PY'
          import sys
          import cv2
          import matplotlib
          import numpy
          import PySide6
          import pytest
          print(f"python={sys.version}")
          print(f"PySide6={PySide6.__version__}")
          print(f"numpy={numpy.__version__}")
          print(f"opencv={cv2.__version__}")
          print(f"matplotlib={matplotlib.__version__}")
          print(f"pytest={pytest.__version__}")
          PY
      - name: Run canonical suite
        shell: bash
        run: |
          set +e
          python -m pytest -q --tb=short > pytest.log 2>&1
          status=$?
          if [ "$status" -eq 0 ]; then tail -n 20 pytest.log; else tail -n 260 pytest.log; fi
          exit "$status"
