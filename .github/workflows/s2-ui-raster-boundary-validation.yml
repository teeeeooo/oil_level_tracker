name: S2 UI raster boundary canonical diagnostics

on:
  pull_request:
    branches:
      - feature/ui-raster-boundary-refactor

permissions:
  contents: read
  pull-requests: write

jobs:
  canonical-diagnostic:
    name: Canonical diagnostic Python 3.13
    runs-on: ubuntu-24.04
    env:
      EXPECTED_SHA: ef98d3d13121f8c6c70d6f1b0b3993282119500b
      QT_QPA_PLATFORM: offscreen
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.EXPECTED_SHA }}
      - name: Assert exact feature head
        run: |
          echo "expected_sha=${EXPECTED_SHA}"
          echo "actual_sha=$(git rev-parse HEAD)"
          test "$(git rev-parse HEAD)" = "${EXPECTED_SHA}"
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install runtime and project
        run: |
          sudo apt-get update >/dev/null
          sudo apt-get install -y libegl1 >/dev/null
          python -m pip install --upgrade pip >/dev/null
          python -m pip install -e '.[dev]' >/dev/null
      - name: Run canonical suite and publish bounded result
        shell: bash
        run: |
          set +e
          python -m pytest -q --tb=short > canonical.log 2>&1
          status=$?
          {
            echo "## S2 canonical diagnostic"
            echo
            echo "- expected SHA: \`${EXPECTED_SHA}\`"
            echo "- actual SHA: \`$(git rev-parse HEAD)\`"
            echo "- exit code: \`${status}\`"
            echo
            echo '```text'
            tail -n 220 canonical.log
            echo '```'
          } > canonical-comment.md
          gh pr comment 33 --repo teeeeooo/oil_level_tracker --body-file canonical-comment.md
          cat canonical-comment.md
          exit "$status"
