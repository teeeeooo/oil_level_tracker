name: Multi-frame preflight validation

on:
  push:
    branches:
      - feature/multi-frame-preflight-check
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  statuses: write

jobs:
  test:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.13", "3.14"]
    env:
      QT_QPA_PLATFORM: offscreen
      PYTHONUNBUFFERED: "1"
      PIP_PROGRESS_BAR: "off"
      VALIDATED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      VALIDATION_PYTHON: ${{ matrix.python-version }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout exact branch head
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install Qt runtime libraries
        run: |
          sudo apt-get update -qq >/dev/null
          sudo apt-get install -qq -y --no-install-recommends \
            libegl1 \
            libgl1 \
            libxkbcommon-x11-0 \
            libxcb-cursor0 \
            libxcb-icccm4 \
            libxcb-image0 \
            libxcb-keysyms1 \
            libxcb-render-util0 >/dev/null
      - name: Install project and test dependencies
        run: python -m pip install -q --upgrade pip && python -m pip install -q -e ".[dev]"
      - name: Run canonical test suite
        shell: bash
        run: |
          set -o pipefail
          QT_QPA_PLATFORM=offscreen python -m pytest -q 2>&1 | tee pytest-output.txt
      - name: Publish pytest counts
        if: always()
        run: |
          python - <<'PY'
          import json
          import os
          import re
          import urllib.request

          output = open("pytest-output.txt", encoding="utf-8", errors="replace").read() if os.path.exists("pytest-output.txt") else ""
          def count(label: str) -> int:
              matches = re.findall(rf"(\d+) {label}", output)
              return int(matches[-1]) if matches else 0

          passed = count("passed")
          failed = count("failed") + count("error") + count("errors")
          skipped = count("skipped")
          state = "success" if passed > 0 and failed == 0 else "failure"
          description = f"{passed} passed, {failed} failed, {skipped} skipped"
          payload = json.dumps({
              "state": state,
              "context": f"preflight-validation/Python {os.environ['VALIDATION_PYTHON']}",
              "description": description,
          }).encode("utf-8")
          request = urllib.request.Request(
              f"https://api.github.com/repos/{os.environ['GITHUB_REPOSITORY']}/statuses/{os.environ['VALIDATED_SHA']}",
              data=payload,
              method="POST",
              headers={
                  "Accept": "application/vnd.github+json",
                  "Authorization": f"Bearer {os.environ['GH_TOKEN']}",
                  "X-GitHub-Api-Version": "2022-11-28",
                  "Content-Type": "application/json",
              },
          )
          with urllib.request.urlopen(request) as response:
              print(description, response.status)
          PY
