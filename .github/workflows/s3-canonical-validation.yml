name: S3 Canonical Validation

on:
  pull_request:
    branches:
      - feature/workbench-usability-stabilization

permissions:
  contents: read
  pull-requests: write

jobs:
  canonical:
    name: canonical-python-${{ matrix.python-version }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.13', '3.14']
    env:
      EXPECTED_SHA: 5778bb2f05175879b7aa1b5065af754f50d87768
      QT_QPA_PLATFORM: offscreen
    steps:
      - name: Checkout exact feature head
        uses: actions/checkout@v4
        with:
          ref: 5778bb2f05175879b7aa1b5065af754f50d87768
          fetch-depth: 1
      - name: Assert exact checkout
        shell: bash
        run: |
          actual="$(git rev-parse HEAD)"
          echo "expected exact SHA=$EXPECTED_SHA"
          echo "actual checkout SHA=$actual"
          test "$actual" = "$EXPECTED_SHA"
      - name: Install Qt offscreen runtime libraries
        run: sudo apt-get update -q && sudo apt-get install -y -q libegl1 libgl1 libxkbcommon-x11-0 libxcb-cursor0
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install package and test dependencies
        run: python -m pip install -q --upgrade pip && python -m pip install -q -e '.[dev]'
      - name: Capture runtime versions
        run: |
          python - <<'PY' | tee /tmp/s3-canonical-versions.txt
          import sys
          import PySide6
          import numpy
          import cv2
          import matplotlib
          print(f"Python version={sys.version}")
          print(f"PySide6 version={PySide6.__version__}")
          print(f"NumPy version={numpy.__version__}")
          print(f"OpenCV version={cv2.__version__}")
          print(f"Matplotlib version={matplotlib.__version__}")
          PY
      - name: Run canonical full suite
        id: tests
        shell: bash
        run: |
          set +e
          python -m pytest -q 2>&1 | tee /tmp/s3-canonical.log
          status=${PIPESTATUS[0]}
          echo "status=$status" >> "$GITHUB_OUTPUT"
          exit 0
      - name: Publish canonical evidence
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          TEST_STATUS: ${{ steps.tests.outputs.status }}
          MATRIX_PYTHON: ${{ matrix.python-version }}
        shell: bash
        run: |
          result=PASS
          if [ "${TEST_STATUS:-1}" != "0" ]; then result=FAIL; fi
          {
            echo "Canonical Python ${MATRIX_PYTHON} validation **${result}** for exact feature SHA \`$EXPECTED_SHA\`."
            echo
            echo '```text'
            echo "expected exact SHA=$EXPECTED_SHA"
            echo "actual checkout SHA=$(git rev-parse HEAD)"
            cat /tmp/s3-canonical-versions.txt
            if [ "$result" = PASS ]; then
              tail -n 25 /tmp/s3-canonical.log
            else
              python - <<'PY'
          from pathlib import Path
          text = Path('/tmp/s3-canonical.log').read_text(encoding='utf-8', errors='replace')
          marker = '=================================== FAILURES ==================================='
          if marker in text:
              section = text[text.index(marker):]
              warnings = section.find('=============================== warnings summary ===============================')
              if warnings >= 0:
                  section = section[:warnings]
              print(section[:30000])
          else:
              print('\n'.join(text.splitlines()[-80:]))
          PY
            fi
            echo '```'
          } > /tmp/s3-canonical-comment.md
          gh pr comment "${{ github.event.pull_request.number }}" --body-file /tmp/s3-canonical-comment.md
          test "${TEST_STATUS:-1}" = "0"
