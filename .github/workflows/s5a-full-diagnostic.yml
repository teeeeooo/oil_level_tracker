name: S5-A bounded source patch

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

env:
  EXPECTED_FEATURE_SHA: 51cf667a12e15753a80519ba31ec4226e7630e26

jobs:
  patch-feature:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/foam-shimmer-discrimination
          fetch-depth: 0
      - name: Assert and apply exact bounded replacement
        run: |
          actual=$(git rev-parse HEAD)
          echo "expected feature SHA=$EXPECTED_FEATURE_SHA"
          echo "actual feature SHA=$actual"
          test "$actual" = "$EXPECTED_FEATURE_SHA"
          python - <<'PY'
          from pathlib import Path

          path = Path('src/oil_tracker/adapters/vision/foam_front_detector.py')
          text = path.read_text(encoding='utf-8')
          marker = '    def __post_init__(self) -> None:\n'
          if marker in text:
              raise SystemExit('bounded patch already applied')
          needle = '''    bounding_box_fill_ratio: float\n    front_y: float | None\n\n\n'''
          replacement = '''    bounding_box_fill_ratio: float\n    front_y: float | None\n\n    def __post_init__(self) -> None:\n        if self.decision_status in {\n            FoamDecisionStatus.WEAK_REJECTED,\n            FoamDecisionStatus.AMBIGUOUS,\n            FoamDecisionStatus.GLARE_REJECTED,\n        }:\n            object.__setattr__(self, "candidate", None)\n            object.__setattr__(self, "mask", np.zeros_like(self.mask, dtype=np.uint8))\n\n\n'''
          if text.count(needle) != 1:
              raise SystemExit('expected dataclass insertion point was not unique')
          path.write_text(text.replace(needle, replacement), encoding='utf-8')
          PY
      - name: Commit and push feature patch
        run: |
          git diff --check
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/oil_tracker/adapters/vision/foam_front_detector.py
          git commit -m "fix: suppress rejected Foam candidates"
          git push origin HEAD:feature/foam-shimmer-discrimination
