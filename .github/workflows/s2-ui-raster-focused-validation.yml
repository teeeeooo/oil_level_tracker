name: S2 focused exact-head validation

on:
  pull_request:
    branches:
      - feature/ui-raster-boundary-refactor

permissions:
  contents: read
  pull-requests: write

jobs:
  focused:
    name: Focused Python 3.13
    runs-on: ubuntu-24.04
    env:
      EXPECTED_SHA: d022403bc95cbcd28fad390e8a9bacfe95297e02
      QT_QPA_PLATFORM: offscreen
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.EXPECTED_SHA }}
      - name: Assert exact feature head
        run: |
          echo "expected_sha=${EXPECTED_SHA}"
          echo "actual_sha=$(git rev-parse HEAD)"
          test "$(git rev-parse HEAD)" = "${EXPECTED_SHA}"
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install runtime and project
        run: |
          sudo apt-get update >/dev/null
          sudo apt-get install -y libegl1 >/dev/null
          python -m pip install --upgrade pip >/dev/null
          python -m pip install -e '.[dev]' >/dev/null
      - name: Run focused suite and publish evidence
        shell: bash
        run: |
          set +e
          python -m pytest -q --tb=short \
            tests/test_ui_import_boundaries.py \
            tests/test_qt_frame_image_converter.py \
            tests/test_review_overlay_renderer.py \
            tests/test_review_debug_overlay_renderer.py \
            tests/test_review_frame_presenter.py \
            tests/test_review_png_exporter.py \
            tests/test_redetection_raster_boundary.py \
            tests/gui/test_result_review_canvas.py \
            tests/gui/test_result_review_window.py \
            tests/gui/test_result_review_enhancements.py \
            tests/gui/test_result_review_debug_viewer.py \
            tests/gui/test_result_review_png_export.py \
            tests/gui/test_result_review_coordinator_factory.py \
            tests/gui/test_result_review_workbench_entry.py \
            tests/gui/test_truth_annotation_lifecycle.py \
            tests/unit/test_result_review_replacement.py \
            tests/unit/test_result_review_playback.py \
            tests/test_redetection_ui_controller.py \
            tests/test_redetection_additional_contracts.py > pytest.log 2>&1
          status=$?
          actual_sha=$(git rev-parse HEAD)
          summary=$(tail -n 1 pytest.log)
          {
            echo "## Final focused Python 3.13"
            echo
            echo "- workflow run ID: ${GITHUB_RUN_ID}"
            echo "- expected SHA: ${EXPECTED_SHA}"
            echo "- actual SHA: ${actual_sha}"
            echo "- exact SHA assertion: $([ "$actual_sha" = "$EXPECTED_SHA" ] && echo PASS || echo FAIL)"
            echo "- Python: $(python --version 2>&1)"
            echo "- PySide6: $(python -c 'import PySide6; print(PySide6.__version__)')"
            echo "- NumPy: $(python -c 'import numpy; print(numpy.__version__)')"
            echo "- OpenCV: $(python -c 'import cv2; print(cv2.__version__)')"
            echo "- Matplotlib: $(python -c 'import matplotlib; print(matplotlib.__version__)')"
            echo "- pytest: $(python -c 'import pytest; print(pytest.__version__)')"
            echo "- exit code: ${status}"
            echo "- summary: ${summary}"
            if [ "$status" -ne 0 ]; then grep '^FAILED ' pytest.log || true; fi
          } > evidence.md
          gh pr comment "${{ github.event.pull_request.number }}" --repo teeeeooo/oil_level_tracker --body-file evidence.md
          cat evidence.md
          exit "$status"
