name: Phase 2B-2 temporary validation

on:
  push:
    branches: [feature/result-review-general-enhancements]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  pytest:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.13", "3.14"]
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - name: Checkout exact feature head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - name: Assert exact checkout
        shell: bash
        run: |
          EXPECTED="${{ github.event.pull_request.head.sha || github.sha }}"
          ACTUAL="$(git rev-parse HEAD)"
          echo "expected=$EXPECTED"
          echo "actual=$ACTUAL"
          test "$ACTUAL" = "$EXPECTED"
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install Qt runtime libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1 libxkbcommon-x11-0 libxcb-cursor0
      - name: Install project
        run: python -m pip install --upgrade pip && python -m pip install -e ".[dev]"
      - name: Report runtime backends
        run: |
          python - <<'PY' | tee runtime-${{ matrix.python-version }}.txt
          import matplotlib
          import platform
          from matplotlib.backends.backend_qtagg import FigureCanvasQTAgg
          from PySide6 import __version__ as pyside_version
          print(f"Python={platform.python_version()}")
          print(f"PySide6={pyside_version}")
          print(f"matplotlib={matplotlib.__version__}")
          print(f"matplotlib default backend={matplotlib.get_backend()}")
          print(f"Qt canvas={FigureCanvasQTAgg.__name__}")
          PY
      - name: Focused graph model and filters
        run: python -m pytest -q tests/unit/test_review_graph.py tests/unit/test_review_filters.py
      - name: Focused bundle assets and actions
        run: python -m pytest -q tests/unit/test_bundle_asset_resolver.py tests/unit/test_result_actions.py
      - name: Focused transactional replacements
        run: python -m pytest -q tests/unit/test_result_review_replacement.py tests/unit/test_same_profile_workbench.py
      - name: Focused graph widget
        run: python -m pytest -q tests/gui/test_result_review_graph.py
      - name: Focused replacement rollback GUI
        run: >-
          python -m pytest -q
          tests/gui/test_result_review_enhancements.py::test_resolution_mismatch_replacement_preserves_complete_viewer_state
          tests/gui/test_result_review_enhancements.py::test_candidate_decode_failure_preserves_complete_viewer_state
          tests/gui/test_result_review_enhancements.py::test_failed_candidate_from_missing_video_state_keeps_missing_state
      - name: Focused graph seek GUI
        run: python -m pytest -q tests/gui/test_result_review_enhancements.py::test_graph_click_pauses_seeks_and_uses_actual_decoded_timestamp
      - name: Focused review filter GUI
        run: python -m pytest -q tests/gui/test_result_review_enhancements.py::test_review_filter_updates_count_highlights_and_preserves_events_and_glass_change
      - name: Focused result asset actions GUI
        run: python -m pytest -q tests/gui/test_result_review_enhancements.py::test_report_folder_and_selected_capture_actions_do_not_pause_playback
      - name: Focused analysis completion dialog
        run: python -m pytest -q tests/gui/test_analysis_complete_dialog.py
      - name: Focused analysis completion coordinator
        run: python -m pytest -q tests/gui/test_analysis_completion_coordinator.py
      - name: Focused same-profile coordinator
        run: python -m pytest -q tests/gui/test_same_profile_analysis_coordinator.py
      - name: Focused Viewer regression
        run: python -m pytest -q tests/unit/test_result_review_playback.py tests/gui/test_result_review_window.py tests/gui/test_result_review_workbench_entry.py
      - name: Run canonical suite
        shell: bash
        run: |
          set +e
          QT_QPA_PLATFORM=offscreen python -m pytest -q | tee pytest-${{ matrix.python-version }}.log
          STATUS=${PIPESTATUS[0]}
          tail -n 1 pytest-${{ matrix.python-version }}.log > summary-${{ matrix.python-version }}.txt
          exit $STATUS
      - name: Upload temporary validation summary
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase2b2-validation-${{ matrix.python-version }}
          path: |
            runtime-${{ matrix.python-version }}.txt
            summary-${{ matrix.python-version }}.txt
          retention-days: 1
