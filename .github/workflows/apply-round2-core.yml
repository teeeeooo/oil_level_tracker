name: Apply round-2 workbench fixes

on:
  push:
    branches:
      - fix/workbench-layout-overlay-report
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  apply-and-test:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out feature branch
        uses: actions/checkout@v4
        with:
          ref: fix/workbench-layout-overlay-report
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Apply exact source patch
        run: python scripts/apply_core_round2.py

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run regression suite
        id: regression
        continue-on-error: true
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          set -o pipefail
          python -m pytest -q 2>&1 | tee validation_failure.txt

      - name: Publish failure details
        if: steps.regression.outcome == 'failure'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add validation_failure.txt
          git commit -m "test: record round-2 validation failure"
          git push origin HEAD:fix/workbench-layout-overlay-report
          exit 1

      - name: Commit materialized source changes
        if: steps.regression.outcome == 'success'
        run: |
          rm -f validation_failure.txt
          rm -f scripts/apply_core_round2.py
          rm -f .github/workflows/apply-round2-core.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: stabilize workbench layout and overlay editing"
          git push origin HEAD:fix/workbench-layout-overlay-report
