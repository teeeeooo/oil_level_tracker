name: Apply round-2 workbench fixes

on:
  push:
    branches:
      - fix/workbench-layout-overlay-report
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  apply-and-test:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out feature branch
        uses: actions/checkout@v4
        with:
          ref: fix/workbench-layout-overlay-report
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install Qt runtime libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1 libxkbcommon-x11-0 libxcb-cursor0

      - name: Apply exact source patch
        run: |
          rm -f validation_failure.txt
          python scripts/apply_core_round2.py

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run regression suite
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m pytest -q

      - name: Commit materialized source changes
        run: |
          rm -f scripts/apply_core_round2.py
          rm -f .github/workflows/apply-round2-core.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: stabilize workbench layout and overlay editing"
          git push origin HEAD:fix/workbench-layout-overlay-report
