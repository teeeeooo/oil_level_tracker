[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "oil-level-tracker"
version = "2.0.0.dev0"
description = "Compressor sight-glass oil inspection: context image, editable lines, judgment and report."
requires-python = ">=3.14"
dependencies = [
    "pywebview==6.2.1",
    "opencv-python-headless>=4.13,<5",
    "numpy>=2.5,<3",
]

[project.optional-dependencies]
dev = ["pytest>=8", "playwright>=1.50"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
