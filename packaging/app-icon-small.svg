<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256">
  <!-- The app icon at 16 to 24 px: no scale marks, a wider glass, a heavier rim, edges on the 16 px grid. -->
  <defs><clipPath id="glass"><ellipse cx="128" cy="128" rx="72" ry="104"/></clipPath></defs>
  <rect x="0" y="0" width="256" height="256" rx="48" fill="#0F6CBD"/>
  <ellipse cx="128" cy="128" rx="72" ry="104" fill="#EBF3FC"/>
  <g clip-path="url(#glass)">
    <rect x="48" y="112" width="160" height="24" fill="#E8710A"/>
    <rect x="48" y="136" width="160" height="112" fill="#1F77D0"/>
  </g>
  <ellipse cx="128" cy="128" rx="72" ry="104" fill="none" stroke="#FFFFFF" stroke-width="24"/>
</svg>
