<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256">
  <!-- The app icon (DESIGN.md 4, "App icon"), 32 px and up: the sight glass on a brand tile.
       Colours: brand #0F6CBD, brand tint #EBF3FC, Oil #1F77D0, Foam #E8710A. -->
  <defs><clipPath id="glass"><ellipse cx="120" cy="128" rx="60" ry="94"/></clipPath></defs>
  <rect x="8" y="8" width="240" height="240" rx="52" fill="#0F6CBD"/>
  <ellipse cx="120" cy="128" rx="60" ry="94" fill="#EBF3FC"/>
  <g clip-path="url(#glass)">
    <rect x="40" y="120" width="160" height="16" fill="#E8710A"/>
    <rect x="40" y="136" width="160" height="100" fill="#1F77D0"/>
  </g>
  <ellipse cx="120" cy="128" rx="60" ry="94" fill="none" stroke="#FFFFFF" stroke-width="14"/>
  <g stroke="#FFFFFF" stroke-width="9" stroke-linecap="round">
    <line x1="200" y1="84" x2="218" y2="84"/>
    <line x1="200" y1="128" x2="224" y2="128"/>
    <line x1="200" y1="172" x2="218" y2="172"/>
  </g>
</svg>
